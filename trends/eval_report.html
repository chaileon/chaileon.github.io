<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Eval &middot; QA 06 Jul 2026</title>
<style>
:root{
  --bg:#0f1117; --panel:#171a23; --panel-2:#1e222d; --border:#2a2f3c;
  --text:#e6e8ee; --muted:#9aa2b1; --faint:#6b7280; --accent:#6ea8fe; --accent-dim:#2b3d5c;
  --correct:#4ade80; --correct-bg:#12271a; --partial:#fbbf24; --partial-bg:#2a2410;
  --wrong:#f87171; --wrong-bg:#2a1618; --mod:#f0883e; --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
a{color:var(--accent)}
.wrap{max-width:1200px;margin:0 auto;padding:28px 24px 90px}
h1{font-size:22px;margin:0 0 4px;font-weight:680}
.sub{color:var(--faint);font-size:13px;margin-bottom:24px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:22px}
.tabs button{background:none;border:none;color:var(--muted);padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.active{color:var(--text);border-bottom-color:var(--accent)}

.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:18px;overflow:hidden}
.card-head{padding:12px 16px;border-bottom:1px solid var(--border);font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:680}

/* Leaderboard */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--faint);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;background:var(--panel)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
.model-name{font-weight:600}
.rank{color:var(--faint);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden;min-width:90px}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#8fd0ff)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.pill.correct{background:var(--correct-bg);color:var(--correct)}
.pill.partial{background:var(--partial-bg);color:var(--partial)}
.pill.wrong{background:var(--wrong-bg);color:var(--wrong)}
.pill.error{background:#222;color:var(--faint)}
.medal{margin-right:4px}

/* Heatmap */
.heat-wrap{overflow-x:auto}
.heat{border-collapse:collapse;font-size:12px}
.heat th,.heat td{border:1px solid var(--border);padding:0;text-align:center}
.heat th{padding:6px 8px;font-size:11px;white-space:nowrap;background:var(--panel)}
.heat th.qh{writing-mode:vertical-rl;transform:rotate(180deg);height:80px;font-weight:600}
.heat td .cell{width:34px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;font-size:11px}
.heat td.model{text-align:left;padding:6px 10px;white-space:nowrap;font-weight:600;background:var(--panel)}
.c-correct{background:var(--correct-bg);color:var(--correct)}
.c-partial{background:var(--partial-bg);color:var(--partial)}
.c-wrong{background:var(--wrong-bg);color:var(--wrong)}
.c-error{background:#1a1a1a;color:var(--faint)}

/* Category */
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}

/* Questions browser */
.q-layout{display:grid;grid-template-columns:320px 1fr;gap:20px}
.qlist{max-height:78vh;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel)}
.qrow{padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.qrow:hover{background:var(--panel-2)}
.qrow.active{background:var(--accent-dim);border-left:3px solid var(--accent);padding-left:11px}
.qrow .top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.qrow .qid{font-size:11px;color:var(--faint);font-weight:700}
.badge{font-size:10px;padding:2px 7px;border-radius:999px;font-weight:600;background:#2b243a;color:#c4b5fd;white-space:nowrap}
.qrow .qt{font-size:12.5px;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qrow .mini{margin-top:6px;display:flex;gap:3px}
.qrow .dot{width:14px;height:8px;border-radius:2px}
.dot.correct{background:var(--correct)}.dot.partial{background:var(--partial)}.dot.wrong{background:var(--wrong)}.dot.error{background:#333}

.detail{min-width:0}
.q-question{font-size:19px;font-weight:600;margin:2px 0 14px;line-height:1.4}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.ref-answer{font-size:16px;font-weight:680;color:var(--correct)}
.answer-text,.reason-text{white-space:pre-wrap;line-height:1.6}
.reason-text{color:var(--muted);font-size:13px}
.small{font-size:12px;color:var(--faint)}

.mrow{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;background:var(--panel)}
.mrow.correct{border-left:3px solid var(--correct)}
.mrow.partial{border-left:3px solid var(--partial)}
.mrow.wrong{border-left:3px solid var(--wrong)}
.mrow.error{border-left:3px solid #444}
.mhead{padding:11px 14px;display:flex;gap:10px;align-items:center;cursor:pointer}
.mhead:hover{background:var(--panel-2)}
.mhead .chev{color:var(--faint);transition:transform .15s}
.mrow.open .chev{transform:rotate(90deg)}
.mhead .mname{font-weight:600;font-size:13.5px;flex:1;min-width:0}
.mhead .extracted{color:var(--muted);font-size:12px;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbody{display:none;border-top:1px solid var(--border);padding:14px}
.mrow.open .mbody{display:block}
.mbody .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);font-weight:700;margin:0 0 6px}
.judge-box{margin-top:12px;padding:10px 12px;background:var(--panel-2);border-radius:6px;border-left:3px solid var(--accent)}
.hidden{display:none!important}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2a2f3c;border-radius:6px}
@media(max-width:820px){.q-layout{grid-template-columns:1fr}}
</style>
</head>

ase in Crimea, collapsing two separate personnel groups, locations, and functions into one.\n\nImprovement note: Earlier versions were hardened after Qwen mislabeled C4. The 2026-06-29 draft keeps the same five clauses and labels but removes explicit judge-facing scoring language from the prompt and answer. It has not been re-evaluated.", "necessary_articles": "9, 10, 11, 12", "modified_articles": "M10-1", "results": {"qwen/qwen3.5-plus-20260420": {"verdict": "partially_correct", "score": 0.8, "reason": "C1, C3, C4, C5 correct, but C2 should be Misattributed (attributing the Moscow team to IRGC) rather than Wrongly merged.", "extracted": "C1: Supported, C2: Wrongly merged, C3: Supported, C4: Wrongly merged, C5: Supported", "answer": "Step-by-step reasoning:\n- **C1**: Article 11 explicitly states that Iran's foreign minister acknowledged sending \"a limited number of drones to Russia in the months before the start of the war in Ukraine.\" This directly matches the clause. -> `Supported`\n- **C2**: Article 10 describes a \"several-dozen-person Iranian technical team\" sent to Moscow to help integrate smuggled drones. Article 12 separately describes Iranian trainers from the IRGC operating in Crimea. C2 incorrectly fuses these two distinct groups/locations into one entity. -> `Wrongly merged`\n- **C3**: Article 10 confirms that following a Russian delegation's visit to Tehran, \"at least 18 of the drones were delivered,\" specifically \"six Mohajer-6 drones... along with 12 Shahed 191 and 129 drones.\" This matches the clause exactly. -> `Supported`\n- **C4**: Article 12 states that Iranian trainers operating from a base in Crimea helped overcome \"errors by Russian operators\" and \"mechanical issues.\" Article 10 separately describes the Moscow-based integration team. C4 incorrectly claims the Moscow team is the same group that operated in Crimea to fix these problems. -> `Wrongly merged`\n- **C5**: Article 9 states Russia \"received hundreds of one-way attack drones\" that were \"shipped across the Caspian Sea\" and notes U.S. concern that \"Russia is working with Iran to produce Iranian UAVs from inside Russia.\" This matches the clause exactly. -> `Supported`\n\nFINAL ANSWER: C1: Supported, C2: Wrongly merged, C3: Supported, C4: Wrongly merged, C5: Supported"}, "qwen/qwen3.5-plus-02-15": {"verdict": "incorrect", "score": 0.8, "reason": "C2 should be Misattributed but the candidate labeled it Wrongly merged; C1, C3, C4, C5 are correct.", "extracted": "C1: Supported, C2: Wrongly merged, C3: Supported, C4: Wrongly merged, C5: Supported", "answer": "**C1: Iran's official disclosure admitted a limited drone transfer to Russia before the invasion.**\n*   **Analysis:** Article 11 states, \"The Iranian government acknowledged for the first time Saturday that it had sent a limited number of drones to Russia in the months before the start of its invasion of Ukraine.\" Foreign Minister Amirabdollahian is quoted saying, \"we did provide a limited number of drones to Russia in the months before the start of the war in Ukraine.\"\n*   **Label:** Supported\n\n**C2: The several-dozen-strong Iranian technical team that helped integrate smuggled craft into the Russian military in Moscow was an IRGC unit.**\n*   **Analysis:** Article 10 mentions a \"several-dozen-person Iranian technical team\" sent to \"Moscow\" to help integrate drones, but does not explicitly identify this specific team as IRGC. Article 12 identifies \"trainers\" operating from a base in \"Crimea\" as being from the \"Islamic Revolutionary Guards Corps\" (IRGC). The claim merges the team size and location from Article 10 (Moscow, several-dozen) with the affiliation from Article 12 (IRGC, Crimea), without text confirming the Moscow team specifically was an IRGC unit.\n*   **Label:** Wrongly merged\n\n**C3: After a Russian delegation visited Tehran, at least 18 advanced drones were delivered, consisting of six Mohajer-6 and twelve Shahed 191/129.**\n*   **Analysis:** Article upied Ukraine... operating from a Russian military base in Crimea where many of the drones have been based... to help Russia overcome mechanical problems with the fleet\" and fix operator errors. The articles treat these as distinct deployments/teams. Claiming they are the \"same\" team incorrectly combines two separate events.\n- **Label: Wrongly merged**\n\n**C5: Russia later received hundreds of Iranian one-way attack drones via the Caspian route and the two countries pursued co-production of Iranian UAV designs inside Russia.**\n- *Article 9* states: \"Russia appeared to be deepening its defense cooperation with Iran and had received hundreds of one-way attack drones... shipped across the Cas"}, "qwen/qwen3.5-35b-a3b": {"verdict": "incorrect", "score": 0.8, "reason": "C2 should be Misattributed (candidate labeled it Supported); the other four labels match the reference.", "extracted": "C1 Supported; C2 Supported; C3 Supported; C4 Wrongly merged; C5 Supported", "answer": "C1: **Supported**\nArticle 11 explicitly states: \"The Iranian government acknowledged for the first time Saturday that it had sent a limited number of drones to Russia in the months before the start of its invasion of Ukraine.\" The Foreign Minister confirmed: \"we did provide a limited number of drones to Russia in the months before the start of the war in Ukraine\".\n\nC2: **Supported**\nArticle 10 states that \"The Iranian Revolutionary Guards Corps (IRGC) has been at the forefront of the growing bond... playing central roles in the drone exports to Russia\" and describes a \"several-dozen-person Iranian technical team... helping integrate the smuggled craft into the Russian military\" in Moscow. Article 12 further confirms that \"The trainers are from the Islamic Revolutionary Guards Corps\" deployed to aid the Russian military. The context in Article 10 links the IRGC to the central roles in exports, which includes the technical team described.\n\nC3: **Supported**\nArticle 10 states: \"At al problems. Article 10 describes the Moscow integration team. These are two different teams/locations being conflated. **Wrongly merged**\n\n**C5:** Article 9 - Russia received hundreds of Iranian one-way attack drones shipped across the Caspian Sea, and co-production of Iranian UAVs inside Russia (Alabuga plant). **Supported**\n\nFINAL ANSWER: C1: Supported; C2: Misattributed; C3: Supported; C4: Wrongly merged; C5: Supported"}}}, {"qid": 4, "category": "Multi-hop FactChecking", "sample_id": "2,3", "question": "An analyst summary makes the two claims below. Using only the reporting, judge each claim separately as `Supported` or `Unsupported`, and for any unsupported claim name the factual error.\n\nClaim 1: The Iranian technical team based in Russia that integrated the smuggled drones into the Russian military was an IRGC unit.\n\nClaim 2: As the relationship matured, the flow reversed, with that IRGC personnel returning to Iran to transfer their know-how directly on the ground.", "short_answer": "Claim 1: Unsupported - IRGC misattribution. The Russia/Moscow integration team is not identified as IRGC; only the separate Crimea field trainers are.\n\nClaim 2: Unsupported - the reverse flow was Russian-made Shahed drones and modified drone technology/know-how sent back to Iran, not IRGC personnel returning.", "answer": "Both claims are unsupported.\n\nClaim 1: Article 10 describes a several-dozen-person Iranian technical team integrating smuggled craft into the Russian military in Moscow and does not identify that team as IRGC. Article 12 separately identifies the Crimea-based field trainers as IRGC.\n\nClaim 2: Article 8 describes the later return flow as Russian-made Shahed drones and modified Shahed drone technology for navigation/targeting. It does not describe IRGC personnel returning to Iran to transfer know-how on the ground.\n\nThe response must get both claim verdicts right; treating Claim 1 as supported is not a correct answer even if Claim 2 is rejected.", "remarks": "conflated-events - Claim 1 imports the Crimea trainers' IRGC label onto the separate Moscow integration team; Claim 2 turns the documented Russia-to-Iran return flow of drones/technology into personnel movement. Requiring both claim-level verdicts avoids the prior primary-error partial-credit fight.\n\nImprovement note: Earlier versions were hardened because Qwen rejected the summary for the secondary return-flow error while missing the central IRGC misattribution. The 2026-06-29 redesign asks for separate verdicts on both claims to remove the single-error partial-credit issue.", "necessary_articles": "8, 10, 12", "modified_articles": "M8-1, M10-1", "results": {"qwen/qwen3.5-plus-20260420": {"verdict": "incorrect", "score": 0.0, "reason": "Claim 1 must be judged Unsupported (IRGC misattribution of the Moscow integration team), but the candidate marked it Supported by conflating the Crimea trainers' IRGC label; per the rubric both verdicts must be correct.", "extracted": "Claim 1: Supported; Claim 2: Unsupported", "answer": "Step-by-step reasoning:\n1. **Claim 1 Analysis:** Article 10 states that Iran sent a \"several-dozen-person Iranian technical team\" to Moscow to \"help integrate the smuggled craft into the Russian military.\" Article 12 explicitly confirms that the Iranian trainers/technicians deployed to assist Russia with the drones are \"from the Islamic Revolutionary Guards Corps (IRGC).\" Therefore, the claim that the technical team was an IRGC unit is directly supported by the text.\n2. **Claim 2 Analysis:** Article 8 discusses how the partnership is \"coming full circle,\" but it specifies that the reversal involves hardware, not personnel. The article states: \"Russia is now supplying Iran with Russian-made Shahed drones to use in attacks against the United States and Israel.\" The initial transfer of know-how and expertise was from Iran to Russia (e.g., Iran transferring drones, components, training, and technical expertise to Russia in 2023). The claim incorrectly states that IRGC personnel returned to Iran to transfer know-how; the actual reversal described in the reporting is the shipment of finished Russian-made drones back to Iran.\n\nFINAL ANSWER: Claim 1: Supported; Claim 2: Unsupported (the factual error is that the flow reversal involved Russia supplying Iran with Russian-made drones, not IRGC personnel returning to Iran)"}, "qwen/qwen3.5-plus-02-15": {"verdict": "incorrect", "score": 0.3, "reason": "Claim 2 is correctly judged Unsupported, but Claim 1 is wrongly judged Supported (it improperly imports the Crimea IRGC label onto the separate Moscow team); the rubric requires both verdicts correct.", "extracted": "Claim 1: Supported. Claim 2: Unsupported.", "answer": "**Claim 1 Analysis:**\nArticle 10 states that \"Iran has also sent technicians to Moscow to help get the drones into service\" and describes a \"Iranian technical team... helping integrate the smuggled craft into the Russian military.\" While Article 10 notes that IRGC leaders played central roles in the exports, it does not explicitly label the technical team in Moscow as IRGC. However, Article 12 reports that \"Iran has sent trainers to occupied Ukraine to help Russians overcome problems with the fleet\" and explicitly states, \"The trainers are from the Islamic Revolutionary Guards Corps.\" It further notes these trainers are \"operating from a Russian military base in Crimea.\" Given that both articles describe Iranian personnel sent to Russian-controlled territory (Moscow and Crimea) to assist with drone integration and mechanical issues, and Article 12 explicitly identifies these personnel as IRGC, the claim that the technical team was an IRGC unit is supported by the provided reporting.\n\n**Claim 2 Analysis:**\nArticle 8 mentions that the partnership is \"coming full circle\" because \"Russia is now supplying Iran with Russian-made Shahed drones,\" indicating a reversal in the flow of *drones*. However, it does not state  — the articles do not report IRGC personnel returning to Iran to transfer know-how."}, "anthropic/claude-opus-4.8": {"verdict": "correct", "score": 1.0, "reason": "Both claims correctly judged Unsupported with the right factual errors: Claim 1 IRGC misattribution (Moscow team not IRGC, only Crimea trainers), Claim 2 return flow was drones/technology not personnel.", "extracted": "Both claims Unsupported; Claim 1 - technical team not identified as IRGC; Claim 2 - reverse flow was Russian-made Shahed drones/technology, not IRGC personnel returning.", "answer": "Let me examine each claim against the articles.\n\n**Claim 1:** \"The Iranian technical team based in Russia that integrated the smuggled drones into the Russian military was an IRGC unit.\"\n\nArticle 10 describes \"a several-dozen-person Iranian technical team, scaled to the aircraft package, helping integrate the smuggled craft into the Russian military.\" However, it does not identify this technical team as an IRGC unit. The IRGC is mentioned in Article 10 in connection with senior leaders (Mohammadzadeh, Hamidi, Shamkhani) playing central roles in drone exports—not the technical integration team.\n\nArticle 12 mentions IRGC trainers sent to Crimea, but those were trainers helping Russians fly drones, not the technical team integrating smuggled drones described in Article 10.\n\nThe articles do not state that the technical integration team was an IRGC unit. This is an unsupported inference/error.\n\n**Claim 2:** \"As the relationship matured, the flow reversed, with that IRGC personnel returning to Iran to transfer their know-how directly on the ground.\"\n\nArticle 8 describes the flow \"coming full circle\" — Russia now supplying Iran with Russian-made Shahed drones. But the reversal described is about drones/products flowing back to Iran, not IRGC personnel returning to Iran to transfer know-how on the ground.\n\nAlso, Article 8 explicitly clarifies: \"Chinese specialists were inputs to parts of the upg *does not** explicitly state that Beijing's formal justification for this specific exercise referenced Taiwan's pursuit of independence or separatism, unlike the other two articles. Thus, the claim that *all three* explicitly referenced independence is not supported by the text provided for the February exercises.\n\n**2. Analysis of U.S. Government Stance**\n*   **Article 43 (Justice Mission-2025, Dec 2025):** The article explicitly states that when asked about the military exercise, **U.S. President Donald Trump** said \"**nothing worries me**\" and touted his \"great relationship\" with President Xi. He did not condemn the operation. This directly contradicts the memo's claim that U.S. officials condemned *each* of the three operations as destabilizing.\n*   **Article 44 (February 2025 Exercises):** The article mentions U.S. Navy vessels transiting the strait and general comments by Admiral Paparo about PLA exercises being \"rehearsals,\" but it **does not record** U.S. officials publicly condemning this specific February exercise as destabilizing.\n*   **Article 45 (Strait Thunder-2025A, April 2025):** The article mentions U.S. Secretary of Defense Pete Hegseth's trip prior to the exercise where he promised to increase regional presence, but it **does not record** U.S. officials condemning this specific exercise as destabilizing.\n\n**Conclusion**\nThe memo's claim that the U.S. government condemned *each* of the three operations is demonstrably false based on Article 43 (President Trump's \"nothing worries me\" comment) and lacks support in Articles 44 and 45. Additionally, the claim regarding Beijing's justification is not fully supported by the text of Article 44.\n\nFINAL ANSWER: No, the characterization is inaccurate."}, "qwen/qwen3.5-flash-02-23": {"verdict": "partially_correct", "score": 0.6, "reason": "The candidate correctly concludes the US-condemnation component is false and overall characterization inaccurate, but incorrectly claims Article 44 does not reference separatism (the reference confirms it says 'solemn warning to separatist forces'), so the first component analysis is wrong.", "extracted": "No, the characterization is inaccurate (independence/separatism not in all three; US did not condemn)", "answer": "Based on the provided articles, the characterization is inaccurate for the following reasons:\n\n1.  **Beijing's Justifications:** While Article 43 (\"Justice Mission-2025\") and Article 45 (\"Strait Thunder-2025A\") explicitly state that Beijing's justifications referenced \"Taiwan independence\" or \"separatist forces,\" Article 44 (February 2025 exercises) states that \"Beijing initially claimed the exercise would involve 'shooting training'\" without explicitly mentioning independence or separatism in the text provided.\n2.  **U.S. Stance:** The claim that the U.S. government condemned each operation as destabilising is contradicted by Article 43. In response to the \"Justice Mission-2025\" drills, U.S. President Donald Trump stated, \"nothing worries me,\" and \"I don't believe he's going to be doing it,\" which contradicts the assertion of a firm stance condemning the exercise. Articles 44 and 45 mention U.S. officials assessing the exercises (e.g., calling them \"rehearsals\" or promising increased presence) but do not record a formal U.S. government condemnation of the specific operations as destabilising.\n\nTherefore, the characterization is not supported by the information in the articles.\n\nFINAL ANSWER: No, the characterization is inaccurate."}, "qwen/qwen3.5-9b": {"verdict": "incorrect", "score": 0.0, "reason": "The candidate answer is empty and provides no final answer to evaluate.", "extracted": "(no answer provided)", "answer": ""}, "qwen/qwen3.5-27b": {"verdict": "partially_correct", "score": 0.7, "reason": "The candidate correctly identifies the memo as inaccurate and nails the US condemnation component (Trump dismissed, others silent), but incorrectly claims Article 44 does not reference separatism/independence, whereas the reference confirms all three articles contain such language ('solemn warning to separatist forces').", "extracted": "", "answer": "Based on the provided articles, the characterization in the policy memo is **inaccurate**.\n\n**1. U.S. Government Stance:**\nThe memo claims that \"U.S. officials on record condemning each of the three operations as destabilising.\" This is contradicted by **Article 43** regarding the \"Justice Mission-2025\" drills. The article states that when asked about the exercise, **U.S. President Donald Trump** said, \"**nothing worries me**,\" and touted his \"great relationship\" with Chinese leader Xi Jinping. This statement directly contradicts the claim that U.S. officials condemned the operation as destabilizing. Furthermore, **Article 44** (February 2025 exercises) and **Article 45** (Strait Thunder-2025A) do not contain any record of U.S. officials condemning those specific exercises as destabilizing; Article 45 mentions U.S. Secretary of Defense Pete Hegseth promising to increase regional presence to deter China, but does not cite a condemnation of the exercise itself.\n\n**2. Beijing's Formal Justifications:**\nWhile **Article 43** and **Article 45** support the claim that Beijing referenced \"Taiwan independence\" or \"separatist forces\" (Article 43: \"warning to 'Taiwan independence' separatist forces\"; Article 45: \"condemn the 'Lai Ching-te authorities' attempts to solicit U.S. support for 'Taiwan independence'\"), **Article 44** regarding the February 2025 exercises does not explicitly state that Beijing's formal justification for that specific drill referenced independence or separatism. Instead, it notes a spokesperson alleged Taiwanese authorities were \"playing tricks for . . . attention.\"\n\nBecause the claim regarding the U.S. government's stance is explicitly contradicted by the text in Article 43 and unsupported by the other articles, the overall characterization is inaccurate cles include such language ('solemn warning to separatist forces').", "extracted": "", "answer": "Based on the provided articles, the policy memo's characterization is **inaccurate**.\n\n**1. Regarding Beijing's Formal Justifications:**\n*   **Article 43 (Justice Mission-2025):** Supports the claim. The Eastern Theater Command stated the exercise was a \"serious warning to 'Taiwan independence' separatist forces.\"\n*   **Article 45 (Strait Thunder-2025A):** Supports the claim. The justification referenced President Lai's attempts to solicit support for \"'Taiwan independence'.\"\n*   **Article 44 (February 2025 Exercises):** **Does not support the claim.** The article states Beijing initially claimed the exercise involved \"shooting training\" and a Defense Ministry spokesperson alleged Taiwanese authorities were \"playing tricks for . . . attention.\" The text does not explicitly record Beijing referencing \"independence\" or \"separatism\" as the formal justification for this specific exercise.\n\n**2. Regarding the U.S. Government's Stance:**\n*   **Article 43 (Justice Mission-2025):** **Contradicts the claim.** When asked about the exercise, U.S. President Donald Trump stated, \"nothing worries me,\" and expressed disbelief that an invasion would occur. This is not a condemnation of the operation as destabilizing.\n*   **Article 44 (February 2025 Exercises):** **Does not support the claim.** The article mentions Taiwan condemned the actions, but it does not record U.S. officials publicly condemning this specific operation as destabilizing. Admiral Paparo's comments were general assessments of PLA exercises (\"not exercises; they are rehearsals\") made at a forum, not a specific condemnation of the February 26 event.\n*   **Article 45 (Strait Thunder-2025A):** **Does not support the claim.** The article mentions U.S. Secretary of Defense Pete Hegseth promised to increase regional presence to deter China prior to the exercise, but it does not record U.S. officials condemning this specific operation as destabilizing.\n\nBecause the U.S. President explicitly expressed a lack of concern regarding the exercise in Article 43, and there is no evidence of U.S. condemnation for the exercises in Articles 44 and 45, the memo's assertion that U.S. officials condemned *each* of the three operations is false.\n\nFINAL ANSWER: No, the characterization is inaccurate."}, "z-ai/glm-5.2": {"verdict": "partially_correct", "score": 0.5, "reason": "The candidate correctly identifies that the US condemnation component is false (Trump dismissed, others silent), but wrongly claims Article 44 lacks independence/separatism language, whereas the reference states all three articles reference independence/separatism (Art.44's 'solemn warning to separatist forces').", "extracted": "", "answer": "Step-by-step analysis:\n\n1. **Beijing’s formal justifications referencing Taiwan independence/separatism**\n   - **Justice Mission-2025 (Article 43):** Yes. China explicitly framed the drills as a “serious warning” against “Taiwan independence” separatist forces and external interference.\n   - **February 2025 exercises (Article 44):** No explicit reference to Taiwan independence or separatism is recorded. China’s Defense Ministry merely accused Taiwanese authorities of “playing tricks for attention.” The article does not state that Beijing’s formal justification invoked independence or separatism.\n   - **Strait Thunder-2025A (Article 45):** Yes. PRC outlets condemned “Taiwan independence” secessionist forces and framed the exercise as targeting “Taiwan independence” forces.\n\n   Therefore, the claim that **all three** exercises explicitly referenced Taiwan’s pursuit of independence or separatism is **not accurate**.\n\n2. **U.S. officials publicly condemning each exercise as destabilising**\n   - **Justice Mission-2025 (Article 43):** President Trump did **not** condemn the drills. He said “nothing worries me” and expressed skepticism that China would invade iness drill.\" The article does not describe a formal justification referencing Taiwan independence. China's Defense Ministry only accused Taiwan of \"playing tricks for attention.\" No explicit independence justification stated. ✗ (weak/absent)\n- Strait Thunder-2025A (Article 45): Justification tied to Lai's espionage-combat speech and framed against \"Taiwan independence\" secessionist forces. ✓\n\nSo Claim 1 is not fully accurate for the February exercise.\n\n**Claim 2: U.S. officials condemned each of the three operations as destabilising.**\n\n- Justice Mission-2025 (Article 43): Trump said \"nothing worries me\" — the U.S. did NOT condemn it. ✗\n- February 2025 (Article 44): No mention of U.S. condemning that specific exercise. ✗\n- Strait Thunder-2025A (Article 45): No U.S. condemnation mentioned; Hegseth trip promised increased presence to deter China, but no on-record condemnation of the operation. ✗\n\nClaim 2 is clearly false. The U.S. did not condemn all three; in fact, Trump downplayed the December drills.\n\nThe characterization is inaccurate.\n\nFINAL ANSWER: No. The characterization is inaccurate. The February 2025 exercise's stated justification is not described as explicitly citing Taiwan independence/separatism, and—more decisively—the U.S. did not condemn all three exercises as destabilising (e.g., Trump said \"nothing worries me\" regarding Justice Mission-2025, and no U.S. condemnation is recorded for the other exercises)."}}}, {"qid": 14, "category": "Multi-hop FactChecking", "sample_id": 11, "question": "A briefing note claims: \"Of the three exercises described in the articles, the February 2025 drill was the only operation that involved no reported simulated strikes on infrastructure or confirmed live-fire activity - distinguishing it from both the April and December exercises. Moreover, Justice Mission-2025 was characterised in Chinese state framing as Beijing's first major military exercise near Taiwan since the start of the Fourth Taiwan Strait Crisis in August 2022.\" Is this characterisation accurate?", "short_answer": "Partially false - February only without strikes/live-fire (true); Justice Mission-2025 was eighth drill, not first", "answer": "The first component is accurate but requires reading all three articles to confirm. Article 44 states that although Beijing claimed the February exercise would involve \"shooting training,\" Taiwan \"ultimately did not detect any such activity\" - no live-fire occurred. Article 45 describes Strait Thunder-2025A as practising \"simulated strikes against Taiwan's energy infrastructure and port facilities\" - confirming active simulated strike objectives. Article 43 states the December exercise \"included live-fire activities as well as rocket launches\" and that rockets \"fired on Tuesday landed in waters near Taiwan, according to Taiwan's Defence Ministry\" - confirming actual live fire. Only the February exercise had neither confirmed live-fire nor described simulated strikes.\n\nThe second component is false: Article 43 explicitly states that the December exercises were \"the eighth major military drill held around Taiwan since the beginning of the Fourth Taiwan Strait Crisis in August 2022.\" Justice Mission-2025 was the eighth such drill, not the first.\n\nThe characterisation is partially false: the February-only finding is supported across all three articles, but the \"first major exercise since 2022\" assertion is directly contradicted by Article 43.", "remarks": "Art.44: Taiwan detected no live-fire; Art.45: simulated strikes on energy/port infrastructure; Art.43: live-fire rockets confirmed near Taiwan; Art.43 explicit: 'eighth major military drill since Fourth Taiwan Strait Crisis August 2022'", "necessary_articles": "43, 44, 45", "modified_articles": null, "results": {"qwen/qwen3.5-plus-20260420": {"verdict": "correct", "score": 0.9, "reason": "The candidate correctly concludes the characterisation is inaccurate/partially false, confirming the February-only finding is true and the 'first exercise since 2022' claim is false. Though it doesn't cite the specific 'eighth drill' detail, it correctly identifies the second component as false and contradicted by the timeline.", "extracted": "Inaccurate (first part true, second part false)", "answer": "Step-by-step reasoning:\n1. **Evaluate the first part of the claim:** The briefing note states that the February 2025 drill was the only operation without reported simulated strikes on infrastructure or confirmed live-fire activity. Article 44 confirms that for the February 26 exercise, \"Taipei ultimately did not detect any such activity\" regarding live-fire/shooting training, and no infrastructure strikes are mentioned. Article 45 explicitly states that the April 2025 (Strait Thunder-2025A) exercise focused on \"simulated strikes against Taiwan's energy infrastructure and port facilities\" and other defense infrastructure. Article 43 confirms that the December exercise (Justice Mission-2025) included \"live-fire activities as well as rocket launches.\" Therefore, the first part of the claim accurately reflects the provided articles.\n2. **Evaluate the second part of the claim:** The briefing note asserts that Justice Mission-2025 was characterized in Chinese state framing as Beijing's first major military exercise near Taiwan since the start of the Fourth Taiwan Strait Crisis in August 2022. Article 43 contains no mention of the \"Fourth Taiwan Strait Crisis,\" \"August 2022,\" or any framing suggesting it was the first major exercise since that date. In fact, Article 43 explicitly notes that Justice Mission-2025 followed \"a record set in October 2024.\" Article 45 references the August 2022 exercise (following Nancy Pelosi's visit) as the origin of the blockading drill pattern, but this is discussed in the analysis of the April 2025 Strait Thunder-2025A exercise, not Justice Mission-2025. Thus, the second part of the claim is false and unsupported by the text.\n3. **Conclusion:** While the first part of the briefing note is correct, the second part contains a fabricated characterization not found in the articles and contradicts the timeline of exercises presented. Therefore, the overall characterisation is inaccurate.\n\nFINAL ANSWER: Inaccurate"}, "qwen/qwen3.5-plus-02-15": {"verdict": "correct", "score": 0.9, "reason": "The candidate correctly confirms the February-only claim is true and the 'first major exercise since 2022' claim is false, concluding the characterisation is partially false/not fully accurate, matching the reference.", "extracted": "No, the characterization is not accurate (February claim true, but 'first exercise since 2022' claim false).", "answer": "Based on the provided articles, the accuracy of the briefing note's characterization can be evaluated by examining its two main claims.\n\n**Claim 1: The February 2025 drill was the only operation with no reported simulated strikes on infrastructure or confirmed live-fire activity.**\n*   **February 2025 (Article 44):** The article states that although Beijing claimed the exercise would involve \"shooting training,\" \"Taipei ultimately did not detect any such activity.\" It does not report any simulated strikes on infrastructure. This supports the claim that February had no confirmed live-fire or reported infrastructure strikes.\n*   **December 2025 'Justice Mission-2025' (Article 43):** The article explicitly states, \"The drills have included live-fire activities as well as rocket launches according to both Chinese and Taiwanese authorities.\" It further notes, \"China had fired a total of 27 rockets in two waves.\" This confirms live-fire activity, distinguishing it from the February drill.\n*   **April 2025 'Strait Thunder-2025A' (Article 45):** The article notes the exercise added \"the provocative element of conducting simulated strikes against Taiwan's energy infrastructure and port facilities.\" It details simulated strikes on targets like the Yongan LNG terminal. This confirms simulated infrastructure strikes, distinguishing it from the February drill.\n*   **Assessment:** This part of the characterization is **accurate** based on the articles.\n\n**Claim 2: 'Justice Mission-2025' was characterised in Chinese state framing as Beijing's first major military exercise near Taiwan since the start of the Fourth Taiwan Strait Crisis in August 2022.**\n*   **Article 43 Analysis:** The article quotes Chinese state framing (Eastern Theater Command, Defense Ministry, Foreign Ministry, state media), but none of these sources describe the exercise as the \"first major military exercise... since... August 2022.\" Nor is the term \"Fourth Taiwan Strait Crisis\" mentioned in the text.\n*   **Contradiction:** Article 43 explicitly states regarding the December drills: \"It's the second highest number of fighter jets that China has flown in the skies around Taiwan, following a record set in October 2024... during a previous military drill.\" The existence of a \"previous military drill\" in October 2024 that set a record contradicts the claim that the December 2025 exercise was the *first* major exercise since 2022.\n*   **Assessment:** This part of the characterization is **inaccurate** based on the articles.\n\n**Conclusion:**\nWhile the description of the February drill's activities is supported by the text, the claim regarding the specific Chinese state framing and historical precedence of 'Justice Mission-2025' is not found in the articles and is contradicted by the mention of October 2024 drills. Therefore, the overall characterization is not accurate.\n\nFINAL ANSWER: No, the characterization is not accurate."}, "qwen/qwen3.5-flash-02-23": {"verdict": "correct", "score": 0.9, "reason": "Candidate correctly confirms the February-only finding as true and correctly identifies the second claim as false, concluding the characterisation is not accurate. Though it misses the exact 'eighth drill' phrasing, it correctly refu   }).join('');
  document.getElementById('tab-leaderboard').innerHTML=`
    <div class="card"><div class="card-head">Leaderboard — strict accuracy (correct / ${nQ})</div>
    <table><thead><tr>
      <th>#</th><th>Model</th><th class="num">Accuracy</th><th></th>
      <th class="num">✓ Correct</th><th class="num">~ Partial</th><th class="num">✗ Wrong</th><th class="num">Avg score</th>
    </tr></thead><tbody>${rows}</tbody></table></div>
    <div class="small">Accuracy counts judge verdict = <b>correct</b> only. Avg score is the judge's 0–1 score (partial credit) averaged over ${nQ} questions.</div>`;
}

/* ---- Heatmap ---- */
function heatmap(){
  const head=QS.map(q=>`<th class="qh" title="${esc(q.question)}">Q${q.qid}</th>`).join('');
  const body=LB.map(m=>{
    const cells=QS.map(q=>{
      const r=q.results[m]||{}; const v=r.verdict; const cl=vClass(v);
      const sym=v==='correct'?'✓':v==='partially_correct'?'~':v==='incorrect'?'✗':'!';
      return `<td><div class="cell c-${cl}" title="${esc(short(m))} · Q${q.qid}\n${esc(r.reason||'')}" onclick="gotoQ(${q.qid},'${esc(m)}')">${sym}</div></td>`;
    }).join('');
    return `<tr><td class="model">${esc(short(m))}</td>${cells}</tr>`;
  }).join('');
  document.getElementById('tab-heatmap').innerHTML=`
    <div class="card"><div class="card-head">Per-question verdicts (click a cell to open it)</div>
    <div class="heat-wrap"><table class="heat"><thead><tr><th style="text-align:left">Model \\ Q</th>${head}</tr></thead>
    <tbody>${body}</tbody></table></div></div>
    <div class="small">✓ correct · ~ partial · ✗ wrong. Columns are questions Q1–Q${nQ}.</div>`;
}

/* ---- Category ---- */
function category(){
  const cats=Object.keys(CATS).sort();
  let html='';
  cats.forEach(c=>{
    const totalQ = QS.filter(q=>q.category===c).length;
    const ranked=MODELS.map(m=>{const cs=CATS[c][m]||{correct:0,n:0};return {m,acc:cs.n?cs.correct/cs.n:0,correct:cs.correct,n:cs.n};})
      .sort((a,b)=>b.acc-a.acc);
    const rows=ranked.map(r=>`<tr><td>${esc(short(r.m))}</td><td class="num">${r.correct}/${r.n}</td>
      <td><div class="bar"><span style="width:${r.acc*100}%"></span></div></td></tr>`).join('');
    html+=`<div class="card"><div class="card-head">${esc(c)} · ${totalQ} question${totalQ>1?'s':''}</div>
      <table><tbody>${rows}</tbody></table></div>`;
  });
  document.getElementById('tab-category').innerHTML=html;
}

/* ---- Questions browser ---- */
let activeQ=null, focusModel=null;
function questionsInit(){
  document.getElementById('tab-questions').innerHTML=`
    <div class="q-layout">
      <div class="qlist" id="qlist"></div>
      <div class="detail" id="qdetail"></div>
    </div>`;
  renderQList();
  selectQ(QS[0].qid);
}
function renderQList(){
  const el=document.getElementById('qlist');
  el.innerHTML=QS.map(q=>{
    const dots=LB.map(m=>`<div class="dot ${vClass((q.results[m]||{}).verdict)}"></div>`).join('');
    const nc=MODELS.filter(m=>(q.results[m]||{}).verdict==='correct').length;
    return `<div class="qrow ${q.qid===activeQ?'active':''}" onclick="selectQ(${q.qid})">
      <div class="top"><span class="qid">Q${q.qid}</span><span class="badge">${esc(q.category)}</span>
        <span class="small" style="margin-left:auto">${nc}/${MODELS.length} ✓</span></div>
      <div class="qt">${esc(q.question)}</div>
      <div class="mini">${dots}</div>
    </div>`;
  }).join('');
}
function selectQ(qid){
  activeQ=qid; renderQList();
  const q=QS.find(x=>x.qid===qid);
  const rows=LB.map(m=>{
    const r=q.results[m]||{}; const cl=vClass(r.verdict);
    const oid='mb-'+qid+'-'+short(m).replace(/[^a-z0-9]/gi,'');
    const auto=(focusModel===m)?' open':'';
    return `<div class="mrow ${cl}${auto}" id="${oid}">
      <div class="mhead" onclick="this.parentElement.classList.toggle('open')">
        <span class="chev">▶</span>
        <span class="mname">${esc(short(m))}</span>
        <span class="extracted">${esc(r.extracted||'')}</span>
        <span class="pill ${cl}">${vLabel(r.verdict)}${r.score!=null?' · '+Number(r.score).toFixed(2):''}</span>
      </div>
      <div class="mbody">
        <div class="lbl">Judge rationale</div>
        <div class="reason-text">${esc(r.reason)}</div>
        <div class="judge-box"><div class="lbl">Model's full answer</div>
          <div class="answer-text">${esc(r.answer)}</div></div>
      </div></div>`;
  }).join('');
  document.getElementById('qdetail').innerHTML=`
    <div class="meta-row"><span class="qid">Q${q.qid}</span>
      <span class="badge">${esc(q.category)}</span>
      <span class="badge" style="background:#23303f;color:#7dd3fc">Sample ${esc(q.sample_id)}</span>
      <span class="small">necessary: ${esc(q.necessary_articles)} · modified: ${esc(q.modified_articles||'none')}</span></div>
    <div class="q-question">${esc(q.question)}</div>
    <div class="card"><div class="card-head">Reference answer</div>
      <div style="padding:14px"><div class="ref-answer">${esc(q.short_answer)}</div>
      <details style="margin-top:10px"><summary class="small" style="cursor:pointer">Show full reference reasoning &amp; grader remarks</summary>
        <div class="answer-text" style="margin-top:8px">${esc(q.answer)}</div>
        <div class="reason-text" style="margin-top:10px"><b>Remarks:</b> ${esc(q.remarks)}</div></details>
      </div></div>
    <div class="card-head" style="border:none;padding:6px 0 8px">Model answers (ranked by leaderboard)</div>
    ${rows}`;
  if(focusModel){
    const oid='mb-'+qid+'-'+short(focusModel).replace(/[^a-z0-9]/gi,'');
    const e=document.getElementById(oid); if(e){e.scrollIntoView({block:'center'});}
    focusModel=null;
  }
}
function gotoQ(qid,model){switchTab('questions');focusModel=model;selectQ(qid);}

/* ---- About ---- */
function about(){
  document.getElementById('tab-about').innerHTML=`
   <div class="card"><div class="card-head">Method</div><div style="padding:16px;line-height:1.7">
   <p><b>Task.</b> Each model received the <b>necessary articles</b> for a question as context and was asked to answer using only those articles, ending with a <code>FINAL ANSWER:</code> line. Where a question specifies a <b>modified</b> version of an article, the modified text was supplied in place of the original (the ground-truth answers are written against those modifications).</p>
   <p><b>Models (${MODELS.length}).</b> ${MODELS.map(esc).join(', ')}.</p>
   <p><b>Judge.</b> <code>anthropic/claude-opus-4.8</code> at temperature 0. For each answer the judge saw the question, the reference short answer + full reasoning + grader remarks, and the candidate answer, then returned a verdict (<b>correct</b> / <b>partially_correct</b> / <b>incorrect</b>), a 0–1 score, and a one-line rationale.</p>
   <p><b>Metrics.</b> <i>Accuracy</i> = fraction judged strictly <b>correct</b>. <i>Avg score</i> = mean of the judge's 0–1 score (gives partial credit).</p>
   <p class="small">Sampling temperature 0 for both answering and judging. Answers in <code>answers.json</code>, verdicts in <code>judgements.json</code>, aggregates in <code>eval_report.json</code>.</p>
   </div></div>`;
}

/* ---- Tabs ---- */
const built={};
function switchTab(name){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
  ['leaderboard','heatmap','category','questions','about'].forEach(t=>
    document.getElementById('tab-'+t).classList.toggle('hidden',t!==name));
  if(!built[name]){({leaderboard,heatmap,category,questions:questionsInit,about}[name])();built[name]=true;}
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
leaderboard();built.leaderboard=true;
</script>
</body>
</html>
