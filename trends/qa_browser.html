 biggest nuclear power plant.\n\nIn a briefing to the U.N. Security Council, Grossi said the principles included that there should be no attack on or from the plant and that it not be used as a base for heavy weapons and military equipment. He called for off-site power to the plant to remain available and secure.\n\n\"The nuclear safety and security situation at the Zaporizhzhia nuclear power plant ... continues to be extremely fragile and dangerous,\" Grossi said. \"Military activities continue in the region and may well increase very considerably in the near future.\"\n\nRussia's U.N. Ambassador Vassily Nebenzia said: \"Mr. Grossi's proposals to ensure the security of the Zaporizhzhia nuclear power plant are in line with the measures that we've already been implementing for a long time.\"\n\nUkraine's Ambassador to the U.N. Sergiy Kyslytsya said the principles \"must be complemented with the demand of full demilitarization and deoccupation of the station.\"\n\nINJURIES AND EVACUATIONS IN MOSCOW\nCommenting on the early Tuesday morning air attacks in Moscow, the defence ministry said eight drones sent by Ukraine and targeting civilians were shot down or diverted with electronic jammers, though Baza, a Telegram channel with links to the security services, said there were more than 25.\n\nMykhailo Podolyak, a Ukrainian presidential aide, denied Kyiv was directly involved but said \"we are pleased to watch events\" and forecast more such strikes.\nTwo people were injured while some apartment blocks were briefly evacuated, according to Moscow's mayor. Residents said they heard loud bangs followed by the smell of petrol. Some filmed a drone being shot down and a plume of smoke.\n\nThe drones targeted some of Moscow's most prestigious districts including where Russian President Vladimir Putin and the elite have residences. He was later in the Kremlin and received a briefing on the attack, a spokesman said.\n\nPutin later said Ukraine's biggest drone strike on Moscow was an attempt to frighten and provoke Russia, and that air defences around the capital would be strengthened.\n\nCivilian targets in Kyiv and other Ukrainian cities have since the earliest days of the war been struck repeatedly by Russian drones and missiles.\nBut Tuesday marked only the second time Moscow had come under direct fire.\n\nIn Washington, the White House said it was still gathering information on the reports of drones striking in Moscow.\n\n\"We do not support attacks inside of Russia. That's it. Period,\" White House press secretary Karine Jean-Pierre said at a briefing. Washington is a major supplier of weaponry to Ukraine on the condition it uses it to defend itself and to retake Ukrainian territory occupied by Russian forces.\nRussian lawmaker Maxim Ivanov called it the most serious assault on Moscow since Nazi Germany's invasion in World War Two, saying no Russian could now avoid \"the new reality\".\n\nRussian state television gave the attacks calm coverage, and many Muscovites shrugged them off. Olga, who said she lived near to the site of one of the drone collisions on Profsoyuznaya Street, called the strikes \"logical, to be expected ... what else were we waiting for-\"\n\nMeanwhile, Russia put Ukraine's top generals on a \"wanted list\", RIA news agency said.\n\nKYIV CITY HIT 17 TIMES BY AIR STRIKES IN MAY\nUkraine said four people died around the country in Russia's latest attacks, with 34 wounded including two children.\n\nUkrainian air defence shot down 29 of 31 Iranian-made Shahed drones in Kyiv, the armed forces general staff said.\n\nA 33-year-old woman died on her balcony when debris from a destroyed Russian projectile hit a Kyiv highrise, officials said.\nRussia has assaulted Kyiv 17 times in May with drones or missiles, mostly at night.\n\nIn a Tuesday evening video address, Ukrainian President Volodymyr Zelenskiy appeared to suggest some authorities were not doing enough to protect citizens during air raids.\n\n\"Shelters in cities have to be accessible. People should understand when and how the number and availability of shelters will increase,\" he said, but did not elaborate.", "keywords": "Ukrainian drones struck wealthy districts of Moscow on Tuesday,\neight drones sent by Ukraine\nTelegram channel with links to the security services, said there were more than 25.\nThe drones targeted some of Moscow's most prestigious districts including where Russian President Vladimir Putin and the elite have residences.", "remarks": null}, {"sample_id": 6, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare", "article_id": 22, "article_title": "Ukraine launches tens of drones on Russia's Bryansk region, Russian official says", "publication_date": "2023-06-23T00:00:00", "source": "Reuters", "url": "https://www.reuters.com/world/europe/ukraine-launches-tens-drones-russian-territory-russian-officials-say-2024-06-23/", "full_text": "Ukraine launches tens of drones on Russia's Bryansk region, Russian official says\nBy Reuters\n\nJune 23 (Reuters) - Ukraine launched tens of drones overnight targeting Russia's western region of Bryansk and other regions but with no reported damage, Russian officials said on Sunday.\n\nAt least 30 drones were destroyed over Bryansk, which borders Ukraine, the governor of the region, Alexander Bogomaz, said on the Telegram messaging app.\n\nRussia's air defence systems also destroyed drones over the Smolensk region, Vasily Anokhin, governor of the region in Russia's west, said on Telegram. It was not immediately clear how many drones were downed.\n\nAccording to preliminary information, there were no casualties or destruction in either region, the governors said. Russian officials often do not disclose the full extent of damage inflicted by Ukrainian attacks.\n\nAn air raid alert was announced for the Lipetsk region several hundred kilometres south of Moscow, the region's governor said on Telegram.\nReuters could not independently verify the reports. There was no immediate comment from Ukraine.\n\nKyiv has often said its strikes inside Russia territory are meant to undermine Moscow's war effort and are in response to Russia's relentless air attacks on Ukraine's energy, military and transport infrastructure.", "keywords": "At least 30 drones were destroyed over Bryansk", "remarks": null}, {"sample_id": 6, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare", "article_id": 23, "article_title": null, "publication_date": null, "source": null, "url": "https://www.theguardian.com/world/2023/may/30/moscow-drone-attack-mayor-reports-minor-damage-to-buildings", "full_text": "Large-scale drone attack hits Moscow for first time in Ukraine war\n\nRare strike on Russian capital unnerves Muscovites who had been told conflict would not threaten them\n\nMoscow has been targeted with a large-scale drone attack for the first time in its 15-month-old war in Ukraine, marking a new inflection point in the conflict, with the Kremlin threatening to take the “harshest possible measures” in response to the strikes.\n\nRussia continues to pummel Ukraine with deadly missile and drone strikes on a near-daily basis. Ukraine’s capital, Kyiv, faced its third air raid in 24 hours on Tuesday morning.\n\nVideo posted on social media early on Tuesday showed one low-flying drone exploding in a field outside Moscow, and others flying over houses in the city’s expensive Rublyovka district or tower flats in south-west neighbourhoods. Another video from Moscow’s outskirts showed a Pantsir surface-to-air missile system firing at a target nearby.\n\nThe Russian defence ministry said eight drones targeted the city overnight but Russian media close to the security services wrote that the number was many times higher, with more than 30 drones participating in the attack.\n\n“I woke up at 6.15 from a loud explosion, and then for the next 45 minutes there were around six other booms every 10 minutes or so,” a security guard told the Guardian. He was based in the elite gated community in Zhukovka, near where the strikes took place.\n\nAlexander Khinshtein, a prominent member of Russia’s parliament, wrote on his Telegram channel that drones were shot down in five different areas in the Moscow region, including at least two that were flying over Rublyovka, a wealthy suburb that is home to much of Russia’s political elite including Vladimir Putin’s Novo-Ogaryovo state residence.\n\n“It was fucked up, everyone came out on their balconies or went outside, no one understood what was happening,” said the security guard.\n\nIn a television appearance on Tuesday, Putin praised Moscow’s air defences and said Kyiv was trying to scare Russians by striking civilian targets. Putin also claimed Russian forces were only striking military facilities in Ukraine using “high-precision weapons”.\n\nAt least one of the drones appears to have been a Ukrainian-manufactured UJ 22, produced by the Ukrjet company. Footage appears to match images of the unmanned aerial vehicle, which Russia has claimed has been used in other attempted attacks. Looking like a scaled-down light aircraft, the UJ22 has a claimed range of 800km and is able to fly for six hours.\n\nThree of the drones hit residential buildings in the south-west of the city but no explosions were reported. Two people were injured in the attack, said Sergei Sobyanin, the Moscow mayor, and the buildings sustained minor damage. Video showed broken windows and a blackened facade at one address hit by a drone early on Tuesday morning.\n\nRussia blamed the drone attack on Ukraine – which denied responsibility – and threatened retaliation.\n\nThe Russian foreign ministry said it reserved the right to take the most “severe measures” in response. “Assurances by Nat officials that the Kyiv regime will not launch strikes deep into Russian territory prove to be completely hypocritical,” the ministry said. “Russia reserves the right to take the harshest possible measures in response to the terrorist attacks by the Kyiv regime.\n\n“This morning, the Kyiv regime launched a terrorist drone attack on targets in the city of Moscow,” the Russian defence ministry said. “Three of them were suppressed by electronic warfare, lost control and deviated from their intended targets. Another five drones were shot down by the Pantsir-S surface-to-air missile system in the Moscow region.”\n\nDmitry Peskov, the Kremlin spokesperson, said Vladimir Putin had no immediate plans to address the country and claimed there was “no imminent threat to residents of Moscow and the Moscow region either”.\n\nA Ukrainian presidential aide denied Kyiv was directly involved but said Ukraine was enjoying watching the events and predicted an increase in such attacks.\n\n“Regarding the attacks: of course we are pleased to watch and predict an increase in the number of attacks. But of course we have nothing directly to do with this,” Mykhailo Podolyak told the Breakfast Show YouTube channel.\n\nThe White House said on Tuesday that it was still gathering information about what happened in Moscow, repeating its earlier statements that it “does not support attacks inside of Russia”.\n\nSimilar attacks against Ukrainian cities are a weekly and sometimes daily occurrence, with local people regularly forced to evacuate or shelter in metro tunnels. The worst strikes have hit large residential buildings or crowded business centres and killed dozens.\n\nAt least one person died in Kyiv and three were injured when falling debris reportedly from a destroyed Russian drone hit a high-rise apartment building early on Tuesday and started a fire, officials said.\n\nSobyanin said there had been minor damage to two residential buildings in Moscow and that people could return home once an investigation had concluded.\n\nAndrei Vorobyov, the governor of the Moscow region, said several drones were shot down on their approach to the city.\n\nMoscow, located more than 620 miles from Ukraine, has only rarely been targeted by drone attacks since the start of the conflict, even though such attacks have become more common elsewhere in Russia. In early May, two drones were shot down over the Kremlin in an attack blamed on Ukraine.\n\nSeveral prominent officials and politicians attacked the defence ministry for allowing the drones to penetrate Moscow’s airspace. They included prominent war hawks who have called for more aggressive strikes and broader mobilisation for the war in Ukraine.\n\n“To stop the shelling of Moscow, it is necessary to occupy Kyiv. We need to mobilise all forces and means,” said Petr Tolstoy, the vice-speaker of Russia’s State Duma.\n\n“You are the ministry of defence. You haven’t done anything to advance. Why the fuck do you allow these drones to hit Moscow-” yelled Yevgeny Prigozhin, who heads the Wagner mercenary group, in a voice memo. “Let your houses burn. And what should ordinary people do when drones with explosives crash into their windows-”\n\nSome Muscovites played down the effects of the strikes, trying to project an image of calm.\n\n“At 6am it started happening, our house was shaking. There were five to seven explosions, and that was it,” said Dmitry, who lives in the pine-forested Odintsovo district, just west of Moscow. “And that’s it. Then we went back to sleep.”\n\nOthers noted that previous strikes had hit higher-value targets, including a drone attack targeting the Kremlin earlier this month.\n\n“Some people are shocked, but nothing can surprise me any more,” said the security guard. “I mean Ukraine already hit the Kremlin before.”\n\nVorobyov attempted to calm Muscovites unnerved by the first attack in a war that has largely played out on television for them. The Kremlin has largely sought to divert Russians from the war, calling it a small-scale military action even as it has stretched into its second year and become the deadliest conflict in Europe since the second world war.\n\n“This morning, residents of some districts of the Moscow region could hear the sounds of explosions – those were our air defences at work,” he wrote on social media.\n\nObservers also noted the careful response by the Kremlin and top officials that sought to spin the effectiveness of Russia’s air defences rather than the fact that Russian cities are now vulnerable.\n\n“It is striking, of course, how much the Russian authorities … unanimously play down the significance of drone attacks on Russian cities,” wrote Tatiana Stanovaya, the founder of the R Politik political analysis firm. “They are already hitting Moscow, and in the statements there is widespread pride in how well everything worked.”\n\nOther videos posted by Russians to social media showed their shock, even as they had been told that Russian air defences would prevent any attacks from reaching the capital.\n\n“It’s flying right over our house!” yelled one man as he filmed a video of a drone gliding over suburban Moscow.\n\n“If the purpose of the raid was to stress out the population, then the very fact of the appearance of Ukrainian drones in the sky over Moscow has already contributed to this,” wrote Rybar, a popular Russian military blogger close to the defence ministry.\n\nObservers expect Ukraine to launch its counteroffensive in the coming weeks. One goal of the drone strikes against Moscow may be as a “shaping” operation to pull Russian air defences away from the frontlines in order to protect large population centres.", "keywords": "Moscow has been targeted with a large-scale drone attack for the first time in its 15-month-old war in Ukraine\neight drones targeted the city overnight but Russian media close to the security services wrote that the number was many times higher, with more than 30 drones participating in the attack.\nThree of the drones hit residential buildings in the south-west of the city\nThree of them were suppressed by electronic warfare, lost control and deviated from their intended targets. Another five drones were shot down", "remarks": "Diagram image in original article shows:\n\nRange of Ukraine’s UJ-22 airborne drone: 800km\n\nAnother image shows 455km distance of Ukraine border to Moscow"}, {"sample_id": 6, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare", "article_id": 24, "article_title": "Russia talks of retaliation after 'Ukrainian drone strike' near Moscow army HQ", "publication_date": "2023-07-24T00:00:00", "source": "Reuters", "url": "https://www.reuters.com/world/europe/drone-fragments-found-near-russias-defence-ministry-building-central-moscow-2023-07-24/", "full_text": "Russia talks of retaliation after 'Ukrainian drone strike' near Moscow army HQ\nBy Andrew Osborn\n\nRussia says 2 Ukrainian drones strike Moscow\nNobody reported hurt; damage not serious\nOne strikes close to Defence Ministry HQ\nUkraine says there will be more such attacks\n\nMOSCOW, July 24 (Reuters) - Russia spoke of taking harsh retaliatory measures against Ukraine after two drones damaged buildings in Moscow early on Monday, including one close to the Defence Ministry's headquarters, in what it called a brazen act of terror.\n\nNobody was hurt in the attack, of which a senior Ukrainian official said there would be more, but one drone struck close to the Moscow building where the Russian military holds briefings on what it calls its \"special military operation\", a symbolic blow which underscored the reach of such drones.\n\nRoads nearby were temporarily closed, windows on the top two floors of an office building struck by a second drone in another Moscow district were blown out, and debris was scattered on the ground, a Reuters reporter who saw the aftermath of the incident said.\n\n\"I was asleep and was woken up by a blast, everything started shaking,\" Polina, a young woman who lives near the high-rise building, told Reuters.\n\nA third \"helicopter-type drone\" which was not carrying explosives fell on a cemetery in a town outside Moscow, the Russian Foreign Ministry said in a statement in which it vowed that all those responsible would be found and punished.\n\nThe Kremlin said it would press on with its campaign in Ukraine and meet all the aims of an operation which Kyiv and much of the West say is a brutal war of conquest.\n\nThe Moscow drone attack, though not serious in terms of its human cost or damage, was the most high-profile of its kind since two drones reached the Kremlin in May.\n\nA swarm of 17 drones also launched attacks overnight on Crimea, which Russia annexed from Ukraine in 2014, the Russian Defence Ministry said, adding it had used anti-drone equipment and air defences to bring them down. The Russian-installed head of Crimea said an ammunition warehouse had been struck and a residential building damaged.\n\n\"We regard what happened as yet another use of terrorist methods and intimidation of the civilian population by the military and political leadership of Ukraine,\" the foreign ministry said of the Moscow and Crimea drone attacks.\n\n\"The Russian Federation reserves the right to take harsh retaliatory measures.\"\n\nFormer Russian President Dmitry Medvedev, now deputy chairman of Russia's Security Council, said Moscow needed to broaden the range of targets it struck in Ukraine, adding what he called high-impact unexpected and unconventional ones.\n\nUkrainian President Volodymyr Zelenskiy, whose government rarely comments on attacks inside Russia or on Russian-controlled territory, had on Sunday promised what he called \"a retaliation to Russian terrorists for Odesa\".\n\nThat was a reference to days of deadly Russian missile strikes against targets in the port city which Moscow says are payback for a Ukrainian attack last week on the Crimean Bridge which killed the parents of a 14-year-old girl.\n\nKyiv said on Monday that a Russian drone attack had destroyed Ukrainian grain warehouses on the Danube River and wounded seven people.\n\n'ACT OF TERRORISM'\n\n\"Today at night drones attacked the capital of 'the orcs' and Crimea,\" said Ukrainian Deputy Prime Minister Mykhailo Fedorov, using a derogatory term some Ukrainians use for Russians. \"Electronic warfare and air defence are already less able to defend the skies of the occupiers.\"\n\nWriting on the Telegram messaging app, Fedorov, one of the officials spearheading Ukrainian efforts to create an \"army of drones\", added: \"No matter what happens there will be more of this.\"\n\nRussia's defence ministry said its forces had used radio-electronic equipment to take out the two Ukrainian drones, forcing them to crash, thereby foiling what it called an attempted \"terrorist attack\".\n\nRussian Foreign Ministry spokeswoman Maria Zakharova told the RTVI TV channel Ukraine was guilty of what she called \"an act of international terrorism\".\n\nMoscow Mayor Sergei Sobyanin said on his Telegram messaging app that two non-residential buildings were struck at around 4 a.m. (0100 GMT), adding there was no serious damage or casualties.\n\nCiting emergency services, Russian state news agencies reported that drone fragments had been found near a building on Komsomolsky Avenue, which runs through Moscow. The site is close to various defence ministry buildings, including some reported to be affiliated to Russia's GRU military intelligence service.\n\nTraffic was temporarily closed on the street as well as on Likhachev Avenue, where a high-rise office building had been damaged, Russian news agencies reported.\n\nAttention is now likely to turn to where the drones were launched from and whether pro-Ukrainian saboteurs inside Russia had a role. After May's drone attack on the Kremlin, U.S. drone experts concluded they might have been launched from inside Russia.\n\nReporting by Andrew Osborn in Moscow ; Additional reporting by Lidia Kelly in Melbourne; Editing by Simon Cameron-Moore, David Holmes, Bernadette Baum and Nick Macfie", "keywords": "two drones damaged buildings in Moscow early on Monday, including one close to the Defence Ministry's headquarters, in what it called a brazen act of terror.\n\ntwo drones reached the Kremlin in May.\n\nswarm of 17 drones also launched attacks overnight on Crimea=", "remarks": "Moscow is about 450-500km from the closest Ukranian border"}, {"sample_id": 6, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare", "article_id": 25, "article_title": null, "publication_date": "2023-08-30T00:00:00", "source": null, "url": "https://www.aljazeera.com/news/2023/8/30/airport-in-western-russia-attacked-by-drones-aircraft-damaged-reports", "full_text": "Ukrainian drones attack Russian airport in large-scale raids on six regions\nRaids come as Russia launches largest missile and drone attack on Ukraine capital in months, killing two people.\n\nRussia said that Ukraine launched drones against targets in six Russian regions, including an attack on an airport in the western city of Pskov – located near the borders of Latvia and Estonia – where military transport aircraft were reported damaged amid explosions and a huge fire.\n\nIn what could be the biggest drone attack on Russian territory since Moscow’s full-scale invasion of Ukraine last year, Russia’s defence ministry said on Wednesday morning that drones were also shot down over the regions of Orlov, Bryansk, Ryazan, Kaluga and the Moscow region surrounding the Russian capital.\n\nMeanwhile, Russia also launched a missile and drone attack against Kyiv on Wednesday morning that was described as the “most powerful strike” on the Ukrainian capital in months, leaving two people dead and one wounded, the city’s Mayor Vitali Klitschko wrote on the Telegram messaging app.\n\nUkrainian air defences destroyed more than 20 missiles and drones involved in the attack and two security guards were killed by falling debris, according to authorities.\n\n“Kyiv had not experienced such a powerful attack since spring … In total, more than 20 enemy targets were destroyed by air defence forces,” the Kyiv city military administration wrote on Telegram.\n\nRussian state news agency TASS, quoting emergency services, said earlier on Wednesday that four Il-76 heavy transport aircraft, which have long been the workhorse of the Russian military, were damaged at an airfield in Russia’s western Pskov region, located roughly 660km (some 411 miles) north of Ukrainian border.\n“The defence ministry is repelling a drone attack in Pskov’s airport,” the regional Governor Mikhail Vedernikov said on the Telegram messaging app, posting a video of a large fire, with sounds of explosions and sirens in the background.\n\nVedernikov, who was at the scene of the attack, said that “according to preliminary information, there are no victims”.\n\nThe scale of the damage to the airport was being assessed, he said.\n\nVideo footage posted on social media, reportedly from the airport, showed thick black smoke rising over the building with residents reporting hearing loud explosions and gunfire.\n\nReports on Telegram channels said anti-aircraft systems were in action around the Russian city, which is located close to European Union member countries Latvia and Estonia.\n\nMoscow’s Vnukovo airport was also closed briefly early on Wednesday, TASS reported, citing Russian aviation officials. The airport was ordered closed amid reports that Russia’s military was repelling a drone attack on Pskov airport, the news agency reported.\n\n‘Accidents happening on Russian territory’\nMeduza, one of Russia’s most widely read independent news sites, said sources reported that between 10 and 20 drones attacked Pskov airfield and that Russian troops stationed on the ground tried to repel the drone raid using small-arms fire. One of the drones reportedly hit a refuelling complex, according to the news site, causing a large fire.\n\nRussia’s 334th Transport Aviation Regiment, which operates Il-76 transport planes, is based at the Pskov airport, according to Meduza.\n\nAll flights from the airport are cancelled, the Pskov Governor Vedernikov wrote on Telegram, “until the nature of the possible damage to the runway is clarified”.\n\nThe extent of any damage or casualties from the other Russian regions where drones were reportedly shot down was not immediately known.\n\nAl Jazeera’s Dorsa Jabbari, reporting from Saint Petersburg in Russia, said the Russian foreign ministry has branded the drone raids on Wednesday a “terrorist act” by Kyiv.\n\n“The feeling here is that this is one of the most brazen attacks on Russian territory since the start of the so-called ‘special military operation’,” Jabbari said.\n\nReporting from Kyiv, Al Jazeera’s Rob McBride said that authorities in Ukraine do not comment directly on attacks inside Russia, which they have described as “accidents happening on Russian territory”.\n\n“But the administration here, including Volodymyr Zelenskyy, the president, have said that Russian airbases do present legitimate targets, and it does follow a pattern now, a surge, an uptick in attacks on Russian airbases. Not only airbases in occupied Crimea but also in Russia itself,” McBride said.\n\nThe Pskov region last came under attack in late May when two armed drones caused an explosion that left an oil pipeline’s administrative building damaged, the regional governor said at the time.\n\nRussia’s capital Moscow and regional areas in the country have come under near-daily raids by Ukrainian drones in recent weeks amid a warning by Kyiv that the war on Ukraine would “return” to Russia.", "keywords": "an airfield in Russia’s western Pskov region, located roughly 660km (some 411 miles) north of Ukrainian border.\nbetween 10 and 20 drones attacked Pskov airfield", "remarks": null}, {"sample_id": 7, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare", "article_id": 26, "article_title": null, "publication_date": "2024-01-18T00:00:00", "source": "CBS News", "url": "https://www.cbsnews.com/news/russia-ukraine-war-russian-oil-depot-ukrainian-drone-attack-klintsy/", "full_text": "A Ukrainian drone struck an oil storage depot in western Russia on Friday, causing a massive blaze, officials said, as Kyiv's forces apparently extended their attacks on Russian soil ahead of the war's two-year anniversary. Four oil reservoirs with a total capacity of 1.6 million gallons were set on fire when the drone reached Klintsy, a city of some 70,000 people located about 40 miles from the Ukrainian border, according to the local governor and state news agency Tass.\n\nThe strike apparently was the latest in a recently intensified effort by Ukraine to unnerve Russians and undermine President Vladimir Putin's claim that life in Russia is going on as normal before its March 17 presidential election.\n\nWoman convicted of killing Russian pro-war blogger faces 28 year sentence\nUkrainian President Volodymyr Zelenskyy has vowed to hit more targets inside Russian border regions this year. Russia's air defenses are concentrated in occupied regions of Ukraine, Kyiv officials say, leaving more distant targets inside Russia more vulnerable as Ukrainian forces develop longer-range drones.\n\nThe Russian city of Belgorod, also near the Ukrainian border, canceled its traditional Orthodox Epiphany festivities on Friday due to the threat of Ukrainian drone strikes. It was the first time major public events were known to have been called off in Russia due to the drone threat.\n\nUkrainian national media, quoting an official in Ukraine's Intelligence Service, said Ukrainian drones on Friday also attacked a gunpowder mill in Tambov, about 370 miles south of Moscow.\n\nBut Tambov Gov. Maxim Yegorov said the plant was working normally, according to Russia's RBC news outlet. The Mash news outlet had earlier reported that a Ukrainian drone fell on the plant's premises Thursday but caused no damage.\n\nU.S. veteran wounded in Ukraine war urges Congress to back funding\nIn another strike fitting the pattern, the Russian Defense Ministry said a Ukrainian drone was downed on the outskirts of St. Petersburg on Thursday.\n\nThe drone wreckage fell on the premises of the St. Petersburg Oil Terminal on the city's southern edge, according to Vladimir Rogov, who is in charge of coordination of the Russian-annexed regions of Ukraine. Mikhail Skigin, the terminal co-owner, confirmed that the drone was targeting the terminal.St. Petersburg, Russia's second-largest city, is about 560 miles north of the border with Ukraine.\n\nIn Klintsy, air defenses electronically jammed the drone but it dropped its explosive payload on the facility, Bryansk regional Gov. Alexander Bogomaz said. There were no casualties, he added.\n\nRussian telegram channels shared videos of what they said was the blaze at the depot, which sent thick black plumes of smoke into the air. The fire is hard to put out and requires specialist equipment, Bogomaz said, adding that 32 people were evacuated from homes near the depot.\n\nThe same depot was struck by a Ukrainian drone in May last year, but the damage apparently was less significant.\n\nMeanwhile, Russian shelling in Ukraine's northeastern Kharkiv region killed a 57-year-old woman and a land mine there killed a man, the Ukrainian president's office reported Friday.", "keywords": "Ukrainian drone was downed on the outskirts of St. Petersburg\ndrone wreckage fell on the premises of the St. Petersburg Oil Terminal\nthe drone was targeting the terminal.\nSt. Petersburg, Russia's second-largest city, is about 560 miles north of the border with Ukraine.", "remarks": "About 900km"}, {"sample_id": 7, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare", "article_id": 27, "article_title": "Ukraine knocks out Russian refinery in major attack", "publication_date": "2024-03-12T00:00:00", "source": "Reuters", "url": "https://www.reuters.com/world/europe/ukraine-launches-drones-oryol-fuel-facility-other-regions-russia-says-2024-03-12/", "full_text": "Ukraine knocks out Russian refinery in major attack\nBy Guy Faulconbridge and Lidia Kelly\n\nUkraine launches mass drone attack\nFire at NORSI refinery, drone downed near Kirishi\nNORSI is badly damaged - sources\nRussia says it repels cross-border attack by Ukrainian proxies\n\nMOSCOW, March 12 (Reuters) - Ukraine pounded targets in Russia on Tuesday with dozens of drones and rockets in an attack that inflicted serious damage on a major oil refinery and sought to pierce the land borders of the world's biggest nuclear power with armed proxies.\n\nRussia and Ukraine have both used drones to strike critical infrastructure, military installations and troop concentrations in their more than two-year war, with Kyiv hitting Russian refineries and energy facilities in recent months.\nRussia said Ukrainian proxies had sought to cross the Russian border in at least seven attacks that Russian forces had repelled.\n\nThe Russian-speaking Ukrainian proxies said they had breached the border, a claim denied by Russia.\n\nIn one of the biggest Ukrainian drone attacks on Russia to date, Moscow said it downed 25 Ukrainian drones over regions including Moscow, Leningrad, Belgorod, Kursk, Bryansk, Tula and Oryol. Waves of drone attacks continued through the day, the defence ministry said.\n\nRussian officials reported attacks on energy facilities, including a fire at Lukoil's (LKOH.MM), opens new tab NORSI refinery and a drone destroyed on the outskirts of the town of Kirishi, home to Russia's second-largest oil refinery.\n\nGleb Nikitin, governor of the Nizhny Novgorod region, said emergency services were working to put out a blaze at the NORSI refinery.\n\"A fuel and energy complex facility was attacked by unmanned aerial vehicles,\" Nikitin said on Telegram.\n\nIndustry sources told Reuters on condition of anonymity that the main crude distillation unit (AVT-6) at NORSI was damaged in the attack, which means that at least half of the refinery's production is halted. Lukoil declined to comment.\n\nNORSI refines about 15.8 million tonnes of Russian crude a year, or 5.8% of total refined crude, according to industry sources.\n\nIt also refines about 4.9 million tonnes of gasoline, 11% of Russia's total, 6.4% of diesel fuel, 5.6% of fuel oil and 7.4% of the country's aviation fuel, according to industry sources.\n\nHITTING RUSSIAN ENERGY\n\nStriking Russian oil facilities is a problem for President Vladimir Putin as he faces off against the West over Ukraine, with domestic gasoline prices sensitive ahead of a March 15-17 presidential election.\n\nRussia imposed a six-month ban on gasoline exports on March 1.\n\nAlong with Iran, Saudi Arabia and the U.S., Russia has vast energy reserves but has, since oil was discovered in the wilds of Western Siberia in the 1960s, often relied on Western technology to exploit and refine its crude.\n\nThe Kremlin said the Russian military was doing everything necessary and that what it calls its military operation in Ukraine would continue.\n\nRussia says it has destroyed more than 15,000 Ukrainian-launched drones since the start of the war.\n\nBORDER ATTACK\nRussia said its forces prevented incursions from Ukraine in the western Belgorod and Kursk regions and inflicted heavy losses on the attackers, after Ukraine-based armed groups said they had launched cross-border raids.\n\n\"Ukrainian terrorist formations, supported by tanks and armoured combat vehicles, attempted to invade the territory of the Russian Federation simultaneously,\" the Russian defence ministry said.\n\nAt least two Ukraine-based armed groups purporting to be made up of Russians opposed to the Kremlin said they had launched an incursion across Russia's western border on Tuesday.\n\nRussia denied that the groups, which Moscow casts as puppets of the Ukrainian military and U.S. Central Intelligence Agency, had penetrated its territory, but said the border had come under attack in several places.\n\nThe governor of Belgorod, Vyacheslav Gladkov, said one member of the region's territorial self-defence unit had been killed, although he gave no details on what had happened.\n\nThe TASS news agency cited the Federal Security Service (FSB) as saying Russian forces had killed 100 people and destroyed multiple armoured vehicles when fighting off attempted incursions.\n\nRussia's defence ministry said Ukraine had fired eight RM-70 rockets and one Tochka-U missile at the Belgorod region.", "keywords": "dozens of drones and rockets in an attack that inflicted serious damage on a major oil refinery\n\nRussia and Ukraine have both used drones to strike critical infrastructure, military installations and troop concentrations in their more than two-year war, with Kyiv hitting Russian refineries and energy facilities in recent months.\n\nMoscow said it downed 25 Ukrainian drones over regions including Moscow, Leningrad, Belgorod, Kursk, Bryansk, Tula and Oryol.", "remarks": "Systematic refinery campaign, Norsi refinery"}, {"sample_id": 7, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare", "article_id": 28, "article_title": "Ukrainian drone hits Russia's third-biggest refinery, damage not critical", "publication_date": "2024-04-02T00:00:00", "source": "Reuters", "url": "https://www.reuters.com/world/europe/several-people-injured-drone-attack-industrial-sites-russias-tatarstan-agencies-2024-04-02/", "full_text": "Ukrainian drone hits Russia's third-biggest refinery, damage not critical\nBy Guy Faulconbridge and Vladimir Soldatkin\n\nTaneco refinery has capacity of 340,000 barrels per day\nPictures show primary refining unit was hit\nIndustry source: Damage not significant\nUkraine claims responsibility for drone strike\nAttack 1,300 km (800 miles) from front lines of war\n\nMOSCOW, April 2 (Reuters) - A Ukrainian drone struck Russia's third-largest oil refinery on Tuesday about 1,300 km (800 miles) from the front lines, hitting a unit that processes about 155,000 barrels of crude per day, though an industry source said strike caused no critical damage.\n\nA Ukrainian intelligence source said Ukraine hit the primary refining unit at the oil refinery in Russia's highly industrialised Tatarstan region and caused a fire.\nSuch attacks are intended to reduce Russia's oil revenue, the source said.\n\nRussian officials said jamming devices locked onto a Ukrainian drone near Tatneft's (TATN.MM), opens new tab Taneco refinery, which has an annual production capacity of more than 17 million tons (340,000 barrels per day).\n\nPictures from the scene showed the drone hit the primary refining unit, CDU-7, though it did not appear to have caused serious damage.\n\nThe industry source, who spoke to Reuters on condition of anonymity, said personnel was returning to the plant.\n\nA fire was extinguished within 20 minutes, the state news agency RIA said, adding that output had not been disrupted.\n\nThe affected unit accounts for around a half of the plant's total annual production capacity. The refinery represents about 6.2% of Russia's refining capacity.\n\nBrent briefly rose above $89 a barrel for the first time since October amid concern over the Ukrainian drone attacks and the escalating conflict in the Middle East.\n\nUkrainian President Volodymyr Zelenskiy made no direct reference to the Tatarstan attack, but said Kyiv's long-distance military action against Russia was important.\"Equally important is that the Russian terrorists are receiving responses to their strikes,\" he said in his nightly video address. \"Each time, longer-range responses.\"\n\nTARGETING OIL REVENUE\nAnother Ukrainian intelligence source said Ukrainian-made drones had also hit a Russian plant producing long-range Shahed attack drones, causing \"significant damage\".\n\nThe Washington Post reported last year that Russia was mass-producing drones, opens new tab at a plant in Tatarstan.\n\nUkraine has in recent months begun attacking the oil refineries of Russia, the world's second-largest oil exporter, impacting Moscow's highly lucrative trade in refined products, amid extensive Russian missile strikes on Ukraine's energy grid.\n\nAccording to Reuters calculations, around 14% of Russia's refining capacity has been shut down by drone attacks. There is more demand for refined oil products than for Russian crude.\n\nThe attacks on Russian refineries have raised concern in Washington about the potential for escalation with Russia.\n\nUkraine says its drone attacks on Russia are justified because it is fighting for survival and has suffered damage to its infrastructure from Russian air strikes.\n\nUkraine, which says it has been attacked by more than 4,630 Russian long-range Shahed drones during the 25-month-old war, regards its own drone production push as a way to hit back at a much better armed and larger enemy.\n\nSince President Vladimir Putin sent Russian forces into Ukraine in 2022, drones have played a big part in the war - either as \"kamikaze\" attackers or as eyes in the sky that guide other weaponry to kill soldiers or destroy equipment.\n\nUkraine has carried out a series of high-profile attacks deep inside Russia meant to either undermine Russia's war machine or, as with a 2023 drone strike on the Kremlin, bring the reality of war to the very heart of Russia.\n\nA powerful ally of Putin said on Tuesday that NATO was essentially fighting Russia in Ukraine and that the U.S.-led alliance had helped organise strikes on Russian territory.\n\nWhen asked if Russia thought the United States was involved in the attacks on Russian refineries, Kremlin spokesman Dmitry Peskov said on Tuesday the question was better addressed to the defence ministry and security services.\n\n\"The Kyiv regime continues its terrorist activity,\" Peskov said. \"We and our military are primarily working to minimise this threat, and subsequently to eliminate it.\"\n\nUkrainian sources say Kyiv alone is responsible for the planning and execution of drone attacks in Russia. The United States says it does not support Ukrainian strikes inside Russia.\n\nTuesday's attacks also hit enterprises in Yelabuga and Nizhnekamsk and some people were injured, Tatarstan's regional governor Rustam Minnikhanov said.\n\nTwo drones struck a dormitory on the territory of the Alabuga Special Economic Zone and at least seven people were injured, Russian media reported.", "keywords": "A Ukrainian drone struck Russia's third-largest oil refinery\non Tuesday about\n1,300 km (800 miles) from the front lines\nUkraine hit the primary refining unit at the oil refinery in Russia's highly industrialised Tatarstan region and caused a fire.\na Ukrainian drone near Tatneft's (TATN.MM), opens new tab Taneco refinery\nKyiv's long-distance military action against Russia was important.\n\"Equally important is that the Russian terrorists are receiving responses to their strikes,\" he said in his nightly video address. \"Each time, longer-range responses.\"\nUkrainian-made drones had also hit a Russian plant producing long-range Shahed attack drones, causing \"significant damage\".\nUkraine has in recent months begun attacking the oil refineries of Russia\naround 14% of Russia's refining capacity has been shut down by drone attacks.\nUkraine, which says it has been attacked by more than 4,630 Russian long-range Shahed drones during the 25-month-old war,", "remarks": "Systematic refinery campaign, Taneco refinery"}, {"sample_id": 7, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare", "article_id": 29, "article_title": "Ukraine drone hits Russian oil facility a 'record' 1,500 km away, source says", "publication_date": "2024-05-09T00:00:00", "source": "Reuters", "url": "https://www.reuters.com/world/europe/ukraine-drone-hits-russian-oil-facility-record-1500-km-away-source-says-2024-05-09/", "full_text": "Ukraine drone hits Russian oil facility a 'record' 1,500 km away, source says\nBy Tom Balmforth\n\nUkrainian drones strike Russian oil facilities\nBashkiria strike signals increasing range of Kyiv's drones\nUkraine says it reached drone production parity with Russia\n\nLONDON, May 9 (Reuters) - A Ukrainian drone struck a major oil processing plant in Russia's Bashkiria region on Thursday from some 1,500 km (932 miles) away, a Kyiv intelligence source said, its longest-range such attack since the start of the war.\n\nUkraine also hit two oil depots in southern Russia, as Kyiv tries to undermine Russian forces pressing along front lines on its territory by attacking energy facilities that are crucial to funding the economy and the war.\n\nRussia's emergency service said a drone attack damaged a pumping station building at Gazprom's Neftekhim Salavat oil processing, petrochemical and fertiliser complex in Bashkiria, Russia's largest such plant, state RIA news agency reported.\n\nThe governor of the region said the plant was functioning as usual despite the attack. Reuters could not establish where the drone was launched and what kind of device it was. The nearest government-held part of Ukraine is about 1,400 km away.\n\nThe Kyiv source said the drone flew 1,500 km, calling it a record, and hit a catalytic cracking unit in an attack that showed \"Russian refineries and oil depots serving the military complex cannot feel safe even in the deep rear\".\n\nMoscow says such attacks amount to terrorism and has launched what it says are revenge strikes that have pounded Ukraine's energy infrastructure since mid-March, raising fears about the resilience of the Ukrainian power system.\n\nKyiv has stepped up its drone attacks on oil processing facilities in Russia since the start of the year, disrupting 15% of Russia's oil refining capacity according to an estimate by a NATO official at the beginning of April.\n\nReuters calculations on April 15 showed that Russia had been able to repair some key oil refineries hit by drones, reducing capacity idled by the attacks to about 10% from almost 14% at the end of March.\n\nREACHING PARITY\nUnable to rapidly match Russia's vast arsenal of cruise and ballistic missiles, Kyiv has focused on developing and producing long-range dronesso it can hit back at Russia, which has bombed Ukraine throughout the 26-month-old invasion.\n\nThe head of the state arms manufacturer said on Wednesday that Ukraine was producing the same number of deep strike drones as Russia, claiming to have reached parity on a key type of weapon Moscow has used for long-range attacks.\n\nThe Ukrainian source said that Kyiv's drones also struck two oil depots near the town of Anapa in Russia's southern Krasnodar region causing large-scale fires overnight. Both attacks were conducted by the Security Service of Ukraine (SBU), the source said.\n\nThe depots were used as transshipment points to supply fuel to Russian troops in the nearby occupied peninsula of Crimea, the source said.\n\nRussian authorities said a Ukrainian drone attack caused a fire and damaged several oil tanks at a refinery in Krasnodar region. About six drones were destroyed, but debris fell on a facility near the village of Yurovka, sparking a fire, they wrote on the Telegram messaging app.\n\n\"The SBU will continue to reduce Russia's economic and logistics potential for waging war,\" the source said.", "keywords": "A Ukrainian drone struck\na major oil processing plant in Russia's Bashkiria region\non Thursday from some\n1,500 km (932 miles) away\n, a Kyiv intelligence source said, its\nlongest-range such attack since the start of the war.\nThe Kyiv source said the drone flew\n1,500 km, calling it a record\n, and hit a catalytic cracking unit in an attack that showed \"Russian refineries and oil depots serving the military complex cannot feel safe even in the deep rear\".\nKyiv has stepped up its drone attacks on oil processing facilities\nin Russia since the start of the year, disrupting 15% of Russia's oil refining capacity\nKyiv has focused on developing and producing long-range drones", "remarks": "Systematic refinery campaign, Neftekhim Salavat refinery"}, {"sample_id": 8, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare, Weaponry Development", "article_id": 30, "article_title": "Ukroboronprom is developing weapons with a range of 1,000 km\n", "publication_date": "2022-10-17T00:00:00", "source": "Militarnyi", "url": "https://militarnyi.com/en/news/ukroboronprom-is-developing-weapons-with-a-range-of-1-000-km/", "full_text": "Against the background of Russian air attacks, the Ukroboronprom State Concern announced the development of Ukrainian weapons with a target range of up to a thousand kilometers.\n\nThis was reported on the official page of the concern on Facebook.\n\nThe specifications of the new weapon system announced by the company:\n\nRange - 1000 km,\nThe weight of the warhead - 75 kg.\nAccording to the concern, the development of its own system is already at the final stage.\n\n“Ukroboronprom has been operating in an intensified mode since the full-scale invasion. We tell you almost nothing (we have to, believe me), but this “nothing” operates successfully on the battlefield, and another “nothing” is repeatedly successfully tested. You will say, this is not enough. And we agree, that’s why we prefer to work 24/7 rather than flood the media space with loud statements,” Ukroboronprom reports.\n\nSimultaneously with the publication of Ukroboronprom, the Come Back Alive Foundation made its own statement, in which it announced the launch of a new project with the Defence Intelligence of the Ministry of Defense of Ukraine.\n\nAccording to the representatives of the Come Back Alive Foundation, the initiative, which appeared on the social networks of the Foundation under the pilot name “cotton in Moscow”, is related to long-distance work. The foundation’s team has been working on the project for about two months and has recently contracted it.\n\nThe Come Back Alive Foundation team promises to provide detailed information about the project and its cost later on.\n\nAs previously reported, on the morning of Monday, October 17, Russia massively attacked the capital and other regions with Iranian-made Shahed-136 kamikaze drones.\n\nA series of loud explosions took place in Kyiv. They attacked the capital after an air alert was announced at 06:15 throughout the Kyiv region and a number of regions of Ukraine.\n\nAccording to eyewitnesses, the first explosion in the capital was heard around 06:35 a.m., and several more followed.\n\nAccording to the intelligence services of Ukraine, Russia ordered 2,400 Shahed-136 loitering munitions.\n\nThis is contained in a statement on the website of the President of Ukraine.\n\nThe first reports of Russia’s use of Shahed-136 loitering munition in the war against Ukraine appeared in early Sept. 2022. In Russia, the drone is designated by the name “Geran-2.”", "keywords": "specifications of the new weapon system announced by the company:\n\nRange - 1000 km,\nthe development of its own system is already at the final stage.", "remarks": "Specification announcement of the now known Liutyi drone\n\nUkrainian Defense Industry - Ukroboronprom "}, {"sample_id": 8, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare, Weaponry Development", "article_id": 31, "article_title": null, "publication_date": "2022-10-18T00:00:00", "source": null, "url": "https://english.nv.ua/business/ukroboronprom-announces-final-stage-of-design-for-drone-ukraine-war-50277372.html", "full_text": "Ukrainian arms company announces final design stages for Ukrainian-made drone\nOctober 18, 2022, 12:48 AM\n\nUkraine’s state-owned Ukroboronprom arms manufacturing concern has announced that it is in the final stages of design for a Ukrainian-made strike drone, which will have a range of up to 1,000 km, the company revealed on Facebook on Oct. 17.\n\n\"Range: 1000 km. It can carry payloads weighing up to 75 kg. The final stage of designing,” the company wrote.\n\nRead also: Iran’s denial of supplying Russia with drones is a lie\n\"We can say almost nothing (it is really necessary), but this 'nothing' has succeeded on the frontline, and another 'nothing' has been tested successfully time and again. You'd say it's not enough. We agree but prefer to work 24/7 rather than fill the media space with loud statements.”\n\nRussia conducted a mass suicide drone attack against Ukraine on Oct. 17, utilizing Iranian-made Shahed-136 drones. Out of 28 launched against the capital, only five made it through – killing at least four and wounding another four.", "keywords": "final stages of design for a Ukrainian-made strike drone, which will have a range of up to 1,000 km", "remarks": "Design anouncement"}, {"sample_id": 8, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare, Weaponry Development", "article_id": 32, "article_title": null, "publication_date": "2022-11-02T00:00:00", "source": null, "url": "https://en.thepage.ua/news/a-new-ukrainian-drone-to-be-commissioned-by-years-end", "full_text": "Ukroboronprom has successfully tested a drone with a 1,000-km flight range. Before the end of the year, it will be \"released into the sky\"\nAuthor\nIryna Maryniuk\nIn Ukraine, work on a multi-purpose drone with a 1,000-km flight range will be completed by the end of the year. According to Speka, by that time it will be available for use in combat.\n\nThe new Ukrainian drone is currently undergoing the final step of development.\n\nAccording to Oleh Boldyriev, a representative of Ukroboronprom, the UAV successfully passed the first tests.\n\nQuote\n\"It took off and it landed… It’s a heavy vehicle - its take-off weight is over 200 kg. It was developed to the specifications General Valerii Zaluzhnyi gave us in early August,\" Boldyriev said.\nHe affirmed that the newly developed UAV will be presented to the public and even to the Armed Forces by the end of the year.\n\nAs was stated earlier, the new long-range drone developed by Ukroboronprom is a multifunctional UAV capable of operating as an attack drone, carrying out aerial reconnaissance, and adjusting artillery fire.\n\nContext. Ukroboronprom announced a new development in October. Then, the state-owned concern didn’t disclose any details. Presumably, the development was the aforementioned multi-purpose drone.", "keywords": "Ukroboronprom has successfully tested a drone with a 1,000-km flight range.\nThe new Ukrainian drone is currently undergoing the final step of development.", "remarks": "Prototyping"}, {"sample_id": 8, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare, Weaponry Development", "article_id": 33, "article_title": "Ukrainian 1000-km range suicide drone passes number of tests", "publication_date": "2022-12-06T00:00:00", "source": "Euromaidan Press", "url": "https://euromaidanpress.com/2022/12/06/ukrainian-1000-range-suicide-drone-passes-number-of-tests/", "full_text": "Ukraine's state defense concern Ukroboronprom said on 4 December that a combat drone it is developing has passed \"a number of stages of successful testing\" and is moving to the stage of testing under electronic warfare.\n\nAfterwards, the Ukrainian weapons concern hoped to be able to test it in combat. We promised it before the end of this year, and we are trying to fulfil this promise,\" Ukroboronprom spokeswoman Nataliia Sad said.\n\nThe announcement came one day before Russia reported explosions on airfields hosting strategic bombers.\n\nOn 17 October, Ukroboronprom reported it was finishing the production of new Ukraine's UAV capable of carrying 75 kg of explosives at distance of 1000 km after a string of Russian attacks on Kyiv and Mykolaiv using Iranian-made Shahed-136 drones.", "keywords": "combat drone it is developing has passed \"a number of stages of successful testing\" and is moving to the stage of testing under electronic warfare.", "remarks": "Successful test"}, {"sample_id": 8, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare, Weaponry Development", "article_id": 34, "article_title": null, "publication_date": "2024-09-01T00:00:00", "source": null, "url": "https://www.aljazeera.com/news/2024/9/1/russia-says-it-intercepted-more-than-150-ukrainian-drones-in-massive-raid", "full_text": "Ukrainian drones in ‘massive’ raid\nUkraine launches one of the biggest aerial attacks on Russia since the full-scale war began, including on the capital Moscow.\n\nRussia says it has stopped a “massive” Ukrainian air attack by downing at least 158 drones in 15 regions, including two over Russia’s capital Moscow.\nThe Russian defence ministry on Sunday said 46 of the drones were shot over the Kursk region, where Ukraine has sent its forces in recent weeks in the largest incursion on Russian soil since World War II.\n\nA further 34 drones were shot down over the Bryansk region, 28 over the Voronezh region, and 14 over the Belgorod region – all of which border Ukraine, the ministry said, adding that a total of 15 Russian regions were hit.\n\nMoscow’s Mayor Sergei Sobyanin on Sunday said falling debris from one of the two drones shot down over the city caused a fire at an oil refinery.\n\nNo casualties were reported.\n\nAlso in Russia, Belgorod Governor Vyacheslav Gladkov said nine people were wounded in Ukrainian aerial missile attacks in the Russian border region. These included eight in the regional capital, also called Belgorod.\n\nHours after the barrage of Ukrainian drone attacks, Russian forces on Sunday carried out another wave of strikes on Ukraine’s second-biggest city, Kharkiv.\n\nUkrainian officials on Sunday said at least 10 Russian missiles hit several locations in Kharkiv, including a shopping mall, injuring at least 44 people, including five children.\n\nRescue workers and volunteers carried injured civilians to ambulances in the city after missiles struck the mall and an events hall.\n\nShattered glass and debris were strewn across the ground and people fled to a metro station for safety.\n\n‘Ukraine uses its own equipment’\nUkrainian drone strikes have brought the fight far from the front line into the heart of Russia.\n\n“It is entirely justified for Ukrainians to respond to Russian terror by any means necessary to stop it,” President Volodymyr Zelenskyy wrote on Facebook.\n\nSince the beginning of the year, Ukraine has stepped up aerial assaults on Russian soil, targeting refineries and oil terminals to slow down the Kremlin’s assault.\n\nSolomiya Khoma of the Ukrainian Security and Cooperation Center said Kyiv’s recent extended attacks on Russian territory can be linked to the fact that it has used its own unmanned aerial equipment since the beginning of the year.\n“Ukraine will continue to use its own capabilities as well as all its missiles and drones to continue to do that,” she told Al Jazeera from Kyiv.\n\n“Until the end of this year, we will also see a build-up of such strikes on Russian territories,” she said, adding that the strikes seem to be hitting targets and impacting Russian capabilities.\n\nThe Russian Defence Ministry said on Sunday that it had taken control of the towns of Pivnichne and Vyimka in Ukraine’s Donetsk region as sides keep militarily pushing each other.\n\nThe claim could not be independently verified.\n\nThe intensity in fighting comes at a critical juncture in the two-and-a-half-year conflict, with Russia pressing an offensive in eastern Ukraine while trying to expel Ukrainian forces that broke through its western border in a surprise incursion on August 6.\n\nRussia last week pounded Ukraine with its heaviest air strikes of the war, hitting energy facilities, part of a campaign of drone and missile barrages that have killed thousands of civilians and troops since the conflict began in February 2022.\n\nUkraine has been pressing the United States and other allies for permission to use more powerful Western-supplied weapons to inflict greater damage inside Russia and impair Moscow’s abilities to attack Ukraine.", "keywords": "Russia says it has stopped a “massive” Ukrainian air attack by downing at least 158 drones in 15 regions, including two over Russia’s capital Moscow.\n\nSolomiya Khoma of the Ukrainian Security and Cooperation Center said Kyiv’s recent extended attacks on Russian territory can be linked to the fact that it has used its own unmanned aerial equipment since the beginning of the year.", "remarks": "Confnirmation of own drone production"}, {"sample_id": 8, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare, Weaponry Development", "article_id": 35, "article_title": "Meet “Liutyi,” Ukraine’s homegrown drone behind strikes on Russian oil refineries", "publication_date": "2024-03-23T00:00:00", "source": "Euromaidan Press", "url": "https://euromaidanpress.com/2024/03/23/meet-liutyi-ukraines-homegrown-drone-behind-strikes-on-russian-oil-refineries/", "full_text": "Meet “Liutyi,” Ukraine’s homegrown drone behind strikes on Russian oil refineries\n\nUkraine’s domestically produced Liutyi unmanned aircraft has been behind precise strikes on Russian oil refineries up to 800km inside Russia.\n\nSince the start of 2024, Ukraine has operationally mass-deployed its new indigenous \"Liutyi\" one-way attack long-range unmanned aircraft, conducting precise strikes deep inside Russia, crippling more than a dozen of Russia's high-value industrial assets, including refineries, oil depots, and factories across an 800km radius of Ukraine's borders.\n\nLiutyi is just one among multiple long-range suicide drones developed or repurposed by Ukraine, but its performance has distinguished it from other models. The ongoing three-month campaign to undermine Moscow's fuel production capacity has been successful, with about 7% of Russia's refining capacity idling in the first quarter of 2024.\n\nThe Ukrainian military news portal Militarnyi compiled detailed information on the Liutyi drone, a key asset for Ukrainian intelligence agencies in their latest deep rear bombing campaign against Russia. Here is what we know about the Liutyi, based on Militarnyi's report and several other sources.\n\nDevelopment and price tag\nUkrainian defense conglomerate Ukroboronprom publicly announced the development of the Liutyi in October 2022. The firm said it intended to create an attack drone weighing over 200 kg, capable of carrying a 75 kg warhead at a distance of more than 1,000 km. It is the first Ukrainian system analogous to Iran's Shahed-136 suicide drones in terms of payload, range, and autonomous attack ability.\n\nThe new drone was a response to the requirements laid out in early August by then-Commander-in-Chief of the Ukrainian Armed Forces, Valerii Zaluzhnyi. When unveiling an element of the Liutyi's fuselage, Ukroboronprom included the biblical inscription \"Az Vozdam\" (Old Slavonic for \"I will repay,\" referring to the Bible's Romans 12:19) – a sign indicating forthcoming retaliatory strikes against Russian assets. The name Lityi, in turn, means fierce/furious or February in Ukrainian.\n\nIn December 2022, Ukroboronprom said a combat drone it was developing had passed “a number of stages of successful testing” and was moving to the stage of testing under electronic warfare.\n\nA year later, on 16 November 2023, the Minister of Strategic Industries Oleksandr Kamyshin stated that Ukraine had entered into mass production of strike drones analogous to Iran's Shahed-136 loitering munitions. Referring to what was known as the \"Ukrainian Shahed,\" Kamyshin said Ukraine was now manufacturing \"tens per month\" but did not disclose the name. The Ukroboronprom CEO confirmed the beginning of the drone's mass production.\n\nIn June 2023, Ukroboronprom announced the successful completion of a 1,000 km trial for the drone. Ukrainska Pravda speculated, referring to its sources, that the effective employment of the Ukroboronprom’s UAV occurred on 3 May 2023, when an attack caused a fire at a Russian oil depot in Volna settlement on Russia’s Taman peninsula next to Crimea, some 250 kilometers from the frontline.\n\nMilitarnyi has learned from its own sources that the Liutyi's approximate cost is twice as much as the previous Bober (\"Beaver\") attack drone. The latter is known to have been purchased by Serhii Prytula's Foundation for 4 million UAH per unit (about $100,000).\n\nLiutyi's design and specifications\nThe Liutyi represents a step up in Ukrainian drone technology and offensive reach. It is an unmanned low-wing monoplane powered by a gasoline engine and equipped with an advanced satellite-aided inertial guidance system for autonomous navigation over long distances.\n\nIn the initial stages of the Liutiy drone project, there were claims that the drone would serve as a versatile platform, but it's unclear from publicly available information whether this goal was achieved, or if the Liutiy was solely deployed as a one-time kamikaze drone, Defense Express says.\n\nBased on open information and multiple photos of the wreckage shared by Russians from the first three months of the Liutyi's deployment in 2024, its design and capabilities can be analyzed in depth. The unmanned low-wing monoplane has a 6.7-meter wingspan and 4.4-meter length, with a maximum takeoff weight between 250-300 kg. The drone boasts aerodynamics optimized for extended range.\n\nIts pusher configuration sees a gasoline piston engine with a three-blade propeller installed in the rear fuselage. This weight distribution likely allows for a heavy explosive warhead in the nose. The drone has a fixed undercarriage for takeoffs and landings from roads or runways.\n\nThe sleek aerodynamic fuselage with winglets aids in maximizing range. It mounts a pitot tube under the nose for measuring airspeed and altitude. The composite fuselage uses fiberglass, epoxy resin, metal mesh, and wood for stiffness.\n\nTo ease logistics, the Liutyi breaks down into major components - the nose section with the warhead, fuel tank, and engine; removable wings; and empennage attaching near the engine nacelles.\n\nThe wreckage of the Ukrainian drone's engine shares design similarities with the German Hirth F-23 50hp aviation engine, estimated to cost around $5,000. Militarnyi notes that distinctive cylinder heads, mounts, and electrical features match this commercial piston engine model.\n\nWarhead and guidance\nThe Liutyi's thick-walled steel warhead casing weighs approximately 50 kg, according to Russian sources, down from Ukroboronprom's initial 75 kg claim, but this precision-guided munition has proved more than adequate to wreak havoc on Russian infrastructure. Its bladed exterior suggests enhanced forced fragmentation over a penetrating shaped charge.\n\nOther features like attachment rings point to it being crane-loaded into the drone's nose section right before launch, implying a modular design. However, the initiation system seems deficient based on the number of intact unexploded warheads found.\n\nThe most significant advancement is Liutyi's improved inertial guidance aided by satellite signals. All previous Ukrainian strike drones relied solely on this traditional system susceptible to jamming and navigation drift.\n\nBy enhancing the satellite antenna's shielding and likely adding backup data links, the Liutyi displayed pinpoint accuracy in striking exact components from over 1000 km away during night bombardment runs into Russia.\n\nThe drone platform's modular design allows it to be broken down for easier transportation and logistics. Its fairly compact size, when disassembled, permits launch from improvised sites like roads, rather than requiring dedicated airstrips. This operational flexibility enhances survivability and complicates Russian countermeasures.\n\nDrone strikes crippled the Yakovlev Explosives Plant in Dzerzhinsk, Nizhny Novgorod Oblast, – a producer of explosive materials for Russian munitions. Other drones hit the Lipetsk Metallurgical Combine, disrupting some steel supplies.\n\nMilitarnyi believes the warhead's bladed casing design, rather than a penetrating shaped charge, indicates an intent to inflict widespread fragmentation damage ideal for wrecking machinery and inflicting casualties in the open.\n\nStrategic bombing campaign with Liutyis\nSince early 2024, flights of 2-6 Liutyis executed over a dozen strikes on strategic Russian sites up to 800 km inside Russia's territory. Nine oil refineries had specific refining units accurately struck, while the Novolipetsk Steel Plant and Nizhny Novgorod explosives factory were also hit.\n\nTwo Ukrainian agencies – the Defense Intelligence Directorate (HUR) and the SBU security service – are coordinating these drone operations, according to Ukrainska Pravda sources. SBU markings on one warhead indicate its special operations personnel have access to the drones.\n\nThe long reach has given Ukraine the ability to degrade Russia's strategic depth and industrial potential, while Liutyi's ongoing mass production will only sustain and intensify the bombardment.\n\nBelow are several drone attacks on Russia in the first three months of this year. While not all assaults necessarily utilized the Liutyi, video evidence from some daytime attacks clearly shows the Liutyi in action:\n\nOn 23 March, a fire broke out at the Novokuibyshevsk oil refinery in Russia’s Samara Oblast following a suspected drone strike.\nFT claimed that the US warned Ukraine against continuing drone strikes on Russia’s energy infrastructure, but Ukraine denied the claim, with the next attack taking place the next day.\nOn 17 March, drones struck the Slavyansk oil refinery in Russia’s Krasnodar Krai.\nOn 16 March, drones hit three oil refineries in Russia’s Samara Oblast.\nOn 15 March, suicide drones attacked an oil refinery in Russia’s Kaluga oblast.\nOn 13 March, drones hit an oil refinery in Ryazan.\nOn 12 March, Ukraine carried out a coordinated drone offensive, hitting and damaging at least two Russian oil assets – a refinery in Nizhny Novgorod Oblast and a fuel depot in Oryol.\nOn 6 March, an oil depot in Kursk came under drone attack.\nOn 14 February, a Kursk oil depot was ablaze after a drone strike.\nOn 9 February, kamikaze drones targeted oil facilities in two Russian regions, hitting the Ilsky and Afipsky oil refineries in the Krasnodar region and an oil depot in the Oryol region, causing a severe fire at the Ilsky refinery and damaging a primary processing unit valued.\nOn 3 February, residents of Volgograd, Russia, reported two explosions, with the Governor stating that Russian air defense units allegedly intercepted drones targeting an oil refinery.\nA vacuum distillation column at an oil refinery caught fire in Russia’s Tuapse City overnight on 25 January.\nOn 18 January, Ukrainian drones attacked an oil depot in the Russian city of Saint Petersburg.\nOn 31 January, a drone hit an oil refinery in St. Petersburg.\nOn 18 January, Ukrainian drones attacked an oil depot in the Russian city of Saint Petersburg.", "keywords": "precise strikes on Russian oil refineries up to 800km inside Russia.\nUkraine has operationally mass-deployed its new indigenous \"Liutyi\" one-way attack long-range unmanned aircraft\n\nLiutyi is just one among multiple long-range suicide drones developed or repurposed by Ukraine\nabout 7% of Russia's refining capacity idling in the first quarter of 2024.\n\nThe firm said it intended to create an attack drone weighing over 200 kg, capable of carrying a 75 kg warhead at a distance of more than 1,000 km.\nIn June 2023, Ukroboronprom announced the successful completion of a 1,000 km trial for the drone.", "remarks": null}, {"sample_id": 9, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare", "article_id": 36, "article_title": null, "publication_date": "2024-05-09T00:00:00", "source": "\nDefense Express", "url": "https://en.defence-ua.com/news/ukraines_drones_reach_1400_km_strike_on_oil_refinery_in_bashkiria-10448.html", "full_text": "The Gazprom Neftekhim Salavat LLC attacked today is one of russia's biggest oil refining facilities processing 10 mln tons of crude oil yearly\nThe geography of Ukrainian strikes has drastically expanded its horizons today, on May 9th morning. An explosive unmanned aerial vehicle has crossed 1,400 km into the territory of the russian federation to strike one of the biggest oil processing plants in the country, the Gazprom Neftekhim Salavat located in the federal subject of Bashkiria.\n\nThe success of this strike is evidenced by videos from the site appearing online. Local media report damage inflicted to the catalytic cracking unit at the plant.\n\nLocal authorities also confirm the fact of the strike, stating that the facility continues to operate in standard mode.\n\n\"An unmanned aerial vehicle appeared in the area over the Gazprom Neftekhim Salavat in the city of Salavat, our enterprise. After its appearance, a source of smoke appeared on the territory of the enterprise,\" said Radiy Khabirov, governor of Bashkortostan.\n\nAt least two drones reached the oil refinery. Most likely, it was a UAV different from Liutyi, considered the most long-range of the publicly known suicide UAV in Ukraine's arsenal, but a more powerful uncrewed aerial vehicle made out of a remodeled light aircraft.\n\nFor a reminder, such unpiloted attack planes were spotted for the first time on April 2nd, 2024 during the simultaneous strike on Shahed-136 production factories in the Alabuga industrial zone and the TANECO Oil Refining Complex in Tatarstan, over 1,200 km from Ukrainian frontlines.\n\nBack then, Defense Express concluded that such strikes would only grow in scale and range onward because drone-converted aircraft have the capacity to reach as far as 1,300 km behind the enemy lines with over 300 kg of explosive on board or even further if the payload is reduced. Moreover, that strike has shown that russia has no air defenses in the deep rear.\n\nNow this time the attack on Gazprom Neftekhim Salavat once again reaffirms those theses. Ukrainian drones flew over 1,400 kilometers if we measure in a straight line, however, the routes for a mission like this one are usually more complex than linear. And it managed to hit an oil refinery occupying a position in the top-10 in terms of annual oil processing capacity.\n\nTherefore, we can update Ukraine's zone of fire control provided by truly long-range kamikaze drones, so it looks like this:", "keywords": "At least two drones reached the oil refinery.\nMost likely, it was a UAV different from Liutyi,\nconsidered the most long-range of the publicly known suicide UAV in Ukraine's arsenal, but a more powerful uncrewed aerial vehicle made out of a remodeled light aircraft.\nMoreover, that strike has shown that russia has no air defenses in the deep rear.\nUkrainian drones flew over 1,400 kilometers if we measure in a straight line, however, the routes for a mission like this one are usually more complex than linear. And it managed to hit an oil refinery occupying a position in the top-10 in terms of annual oil processing capacity.", "remarks": null}, {"sample_id": 9, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare, Weaponry Development", "article_id": 37, "article_title": null, "publication_date": "2024-05-13T00:00:00", "source": "\nDefense Express", "url": "https://en.defence-ua.com/weapon_and_tech/meet_the_ninja_name_of_ukraines_largest_reaching_drone_of_1500_km_revealed-10494.html", "full_text": "It was this drone that traveled the record-breaking distance to attack the Gazprom Neftekhim Salavat oil refinery in Bashkiria\nOne of the most famous long-range kamikaze drones in Ukraine's arsenal is the Liutyi which is actively used for attacks on oil refineries within the russian federation. Dedicated to the history of this drone is the recent article by Ukrainska Pravda. However, besides Liutyi, there are other drones famed for strikes on russian military bases and infrastructure.\n\nFor example, drones with an attack range of 800 km, namely, the Bober UAV developed thanks to the crowdfunded Black Box project and known for its strikes on Moscow City, or the Morok operated by the Security Service of Ukraine. But the most capable of these developments responsible for the record-breaking 1,400+ km strike has been shrouded in mystery. That is, until now.\n\n\"There are also other UAVs such as Ninja, which recently set a record for the range - 1,500 kilometers to the Gazprom Neftekhim Salavat plant, there is the Bober, there is the Brama based on the A-22 aircraft, and other developments. However, in terms of the price/quality/range/accuracy ratio, Liutyi still holds a confident leadership,\" notes the author of the article.\n\nBased on the name alone, it's quite difficult to guess what kind of drone this Ninja might be. The video showing the attack on the oil refinery in Bashkiria features a UAV that looks more like a small civil aviation aircraft rather than conventional drone. At the same time, that's not the A-22 which is listed as part of a separate project and obviously points to a drone made of the A-22 Foxbat ultralight aircraft from the Ukrainian Aeroprakt company.\n\nOne possible option is that it's based on the Skyranger Nynja, another single-engine ultralight aircraft that can be acquired as a Do-It-Yourself kit.\n\nDefense Express notes that one of the drones based on the Skyranger aircraft family has already been seen in use by the Ukrainian Defense Forces. In late April 2024, russian sources published a photo depicting such a drone after it fell into the field, it was equipped with an OFAB-100-120 aerial bomb. But despite some sources having identified it as Skyranger Nynja, it actually was a very similar aircraft of the same series, the Skyranger Swift.\n\nAlthough the difference between the aircraft used as aerial vehicles for explosives is minimal, we must take note that the Swift-based drone was, most likely, a reusable bomber drone, similar to the U-2 actively used during World War II. Meanwhile, the drone that attacked Gazprom Neftekhim Salavat did not carry any bombs under its belly, as evidenced by the footage filmed by the locals. Apparently, the Ninja was from the get-go supposed to make a single-in-a-lifetime flight and thus carried explosives inside the hull.\n\nStill, a possibility that the Skyranger Nynja and our Ninja may still be different drones, cannot be ruled out just yet. After all, the declared operational range of Nynja is less than 700 km. Effectively multiplying the flight range would require an impressive amount of work on the part of Ukrainian engineers.", "keywords": "There are also other UAVs such as Ninja, which recently set a record for the range - 1,500 kilometers to the Gazprom Neftekhim Salavat plant", "remarks": null}, {"sample_id": 9, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare, Weaponry Development", "article_id": 38, "article_title": "Meet “Liutyi,” Ukraine’s homegrown drone behind strikes on Russian oil refineries", "publication_date": "2024-07-27T00:00:00", "source": "\nDefense Express", "url": "https://en.defence-ua.com/events/defying_expectations_ukrainian_drones_successfully_reach_olenya_air_base_1800_km_away-11316.html", "full_text": "The strategic importance of this long-range strike by Ukrainian explosive unmanned aerial vehicles\n\nUkrainian kamikaze UAVs have brought a new wave of strikes on strategically important facilities across the russian Federation. On the night of July 27, 2024, the drones targeted the oil refinery in Ryazan and multiple airfields hosting russian strategic aviation, namely the Engels, Dyagilevo, and Olenya military air bases, sources in the Defense Intelligence of Ukraine told Ukrainska Pravda.\n\nAccording to preliminary information, the drones damaged at least one Tu-22M3 at the Olenya airfield, investigation is still underway. Unofficial sources also cite locals who had heard explosions in the vicinity of the Engels airfield, although the local administration denied and claimed that all the UAVs were shot down by air defenses.\n\nClash Report\n@clashreport\n·\nFollow\nUkrainian strikes hit Tu-22M3 long-range strategic bomber aircraft at Olenya Air Base in Murmansk region, Pravda claims, citing GUR.\n\nOlenya Air Base is 1,800 kil
