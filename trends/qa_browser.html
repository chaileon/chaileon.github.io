ansfer between China, Russia, and Iran-and the associated supply chains-are the result of geography as well as significant Western economic pressure. Due to restrictive export controls and sanctions, these states cannot easily access Western technology and components directly from the United States and other Western countries. Because trade among the Axis of Evasion occurs outside of the Western financial system and, therefore, the reach of Western economic restrictions, these integrated supply chains are more resistant to sanctions and export controls enforcement.\n\nIran has been subject to extensive and comprehensive US sanctions and Western restrictive economic measures for decades. In October 2021, the United States announced the first export controls specifically targeting unmanned aerial vehicle (UAV) production. Since then, the Department of Commerce, Department of State, and the Treasury have also restricted third-party countries from exporting US-origin technologies to Iran. Despite the intensity of these restrictions, Western components continue to feature in Iranian drone designs. Often, these components come from China. \n\nChina has supplied Iran with drones, anti-ship cruise missiles, surface-to-air missiles, and the components thereof, to aid in its aerial and maritime defense capabilities. In other instances, China directly supplies Iran with Western or Chinese technology components that are found in Iranian drones used against US military installations and economic interests in the Gulf, as well as on Russia’s battlefield in Ukraine. Treasury and Commerce actions targeting Iranian sanctions evasion schemes frequently identify and designate Chinese individuals, entities, and addresses that are used as shell or front companies and transshipment hubs. This cooperation extends beyond trading goods, but helps partners to develop and improve their own technological capabilities.\n\nDrones\nIran’s drone program offers the clearest example of how the Axis of Evasion uses localized supply chains to circumvent restrictive economic measures and enhance military production. Iranian UAVs, such as the Shahed series, rely on an ecosystem of imported electronics, engines, navigation components, batteries, and semiconductors. While many of these parts originate in the United States, Europe, and Japan, procurement networks frequently route them through Chinese distributors or trading companies before they reach Iranian manufacturers. Chinese dual-use exports to Iran spiked in January 2024 when the two states formalized a strategic partnership emphasizing defense and security cooperation. Likewise, Chinese exports rose after Trump signed a memorandum restoring maximum pressure on Iran and again in June 2025 after the US attack on Iranian nuclear facilities.\n\nRussia further reinforces this system through wartime cooperation with Iran. Since 2022, Moscow and Tehran have exchanged drone technology and production know-how, allowing both countries to expand manufacturing capacity. In February 2023, Russia established a drone production facility supported by Iranian technology and expertise at the Alabuga Special Economic Zone in Russia. As part of a deal, Iran transferred 600 disassembled Shahed-16 drones, components for 1,300 drones, training, and technical expertise to Russia to assist in its war in Ukraine. By 2025, Moscow had moved roughly 90 percent of Shahed assembly to Russia. Meanwhile, Russia developed the Garpiya-3, a modified and improved version of the Shahed, with the help of Chinese specialists and a reported Russian drone factory in China. \n\nThis partnership now appears to be coming full circle. Recent comments by Ukrainian President Volodymyr Zelenskyy reveal that Russia is now supplying Iran with Russian-made Shahed drones to use in attacks against the United States and Israel. What began as a sanctions-driven workaround has evolved into a self-reinforcing production network, fueled by Western components, Chinese procurement channels, and Russian manufacturing capacity.\n\nNavigation systems\nIn another example of these integrated supply chain networks, China facilitates the transfer of both Chinese- and Western-made navigation technology to Iran. Meanwhile, Russia is reportedly sharing satellite imagery and modified Shahed drone technology to improve navigation and targeting based on Russia’s experience of using drones in Ukraine.\n\nChinese electronics markets and distributors play a critical role in this process. Components originally manufactured for civilian applications-such as inertial sensors or satellite navigation modules-can be purchased through Chinese intermediaries and integrated into Iranian weapons systems. Russia’s experience adapting commercial electronics also feeds into this innovation ecosystem.\n\nSome experts believe that Iranian drones and missiles incorporate Chinese satellite navigation systems to target US and Israeli military assets. In February 2025, the US Treasury Department sanctioned Chinese front companies that were supplying gyro navigation devices to enhance Iranian-made UAVs. In November 2025, a separate network connected to Iran’s Aircraft Manufacturing Industrial Company was accused of using shell firms to acquire Chinese sensors and navigation equipment.\n\nIn 2021, China gave Iran access to BeiDou, the global positioning satellite system owned and operated by the China National Space Administration. Since the start of the war with the United States and Israel, Iran has used BeiDou to produce decoy signals to confuse threat analysis and conceal actual Iranian military movements.\n\nChemical precursors\nIran’s ability to sustain missile and explosives production depends on access to chemical precursors and industrial materials. Although these substances are subject to Western export controls, and the US Treasury has sanctioned individuals and entities in Iran and China for procuring ballistic missile propellant ingredients, enforcement is more difficult when production is distributed across multiple jurisdictions. Chinese chemical companies-many of which operate in sprawling industrial clusters-have repeatedly been linked to shipments of dual-use materials to Iran as well as Russia. Another recent report suggests that Iranian shadow fleet vessels sailing from China contain precursors for rocket fuel.\n\nFor Iran, these imports provide critical inputs for solid rocket fuels, propellants, and explosives used in missile systems and other weapons systems. By purchasing precursor materials through intermediaries or reexport hubs, Iranian procurement networks obscure the destination of shipments and exploit gaps in global export-control and sanctions enforcement. The scale and diversity of China’s chemical industry make it particularly difficult for regulators to monitor the end use of every exported compound. \n\nWhat to do now\nChina, Russia, and Iran continue to work together to circumvent and evade Western sanctions and export controls. Meanwhile, the United States has been inconsistent in implementing economic restrictions. After the last Trump-Xi summit in October 2025, Washington suspended the Bureau of Industry and Security Affiliate Rule in exchange for China’s lifting of export controls on critical minerals, effectively revealing how much leverage Beijing retains through its dominance in rare-earth supply chains. Additionally, Washington is easing oil sanctions on Moscow and Tehran in response to rising energy prices and the crisis in the Strait of Hormuz, exposing the precise issues on which the US is willing to compromise.\n\nAs the White House diverts its attention toward the Middle East, the Trump-Xi summit, originally scheduled for next week, was postponed until May. However, a productive push on China could also advance the US position in the Iran conflict. In his meeting with Xi-if not sooner-Trump should confront China’s role in enabling these supply chains, tightening scrutiny of Chinese exports and intermediaries that facilitate sanctions evasion. The White House must make stronger export control enforcement, expanded entity listings, and greater transparency requirements for Chinese distributors involved in dual-use trade central to the agenda. \n\nBut pressure on China alone is not enough. Iran’s procurement networks depend on a web of transshipment hubs and trading companies that move controlled technologies across jurisdictions before they reach their destination in Iran. These networks often rely on distributors and logistics firms in third countries to obscure the origin and destination of sensitive components.\n\nThe United States should therefore expand its focus beyond direct exporters and identify the intermediaries and transshipment hubs that repeatedly appear in Iranian procurement chains. With targeted sanctions, enhanced export control enforcement cooperation, and intelligence sharing with partner governments, the United States can help disrupt the flow of dual-use goods before they reach Iran’s defense sector.\n\nThis increased enforcement should be paired with incentives. Many countries that serve as transshipment hubs are not politically aligned with Iran but lack the regulatory capacity or economic incentives to fully enforce export controls. Such third countries have also been hit hard by US tariffs, pushing them toward US adversaries purely due to economic incentives. In deploying incentives to encourage stronger compliance, the United States can cooperate with countries willing to strengthen export-control enforcement. In addition to incentives, capacity building programs, including customs modernization, export-control training, and industrial diversification could also enable firms in these jurisdictions to comply with Western restrictive economic measures.\n\nDespite the severity and consistency of US sanctions and export controls targeting Iran’s drone acquisition, Iran maintains the technical knowledge, mature production lines, and continued access to dual-use components necessary to rebuild its drone stockpiles. Cooperation with adversarial states-predominantly China and Russia-further reinforces these capabilities by distributing supply chains and insulating production from Western pressure.\n\nA failure to confront this Axis of Evasion across its networks allows it to continue enabling the flow of dual-use technologies among its members, which will allow Iran to rebuild and expand its drone and missile arsenals both during and potentially after the current war.", "keywords": "Chinese supply-chain and navigation support; MANPADS delivery and use tracked separately; Russia supplying Russian-made Shahed drones; Chinese specialists as inputs, not state-level supplier", "remarks": null}, {"sample_id": 3, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare", "article_id": 9, "article_title": "Russia received hundreds of Iranian drones to attack Ukraine, US says", "publication_date": "2023-06-09T00:00:00", "source": "Reuters", "url": "https://www.reuters.com/world/europe/russia-has-received-hundreds-iranian-drones-attack-ukraine-white-house-2023-06-09/", "full_text": "Russia received hundreds of Iranian drones to attack Ukraine, US says\nBy Jeff Mason and Steve Holland\n\nWASHINGTON, June 9 (Reuters) - The White House said on Friday that Russia appeared to be deepening its defense cooperation with Iran and had received hundreds of one-way attack drones that it is using to strike Ukraine.\nCiting newly declassified information, the White House said the drones, or unmanned aerial vehicles, were built in Iran, shipped across the Caspian Sea and then used by Russian forces against Ukraine.\n\nThe Reuters Iran Briefing newsletter keeps you informed with the latest developments and analysis of the Iran war. Sign up here.\n\n\"Russia has been using Iranian UAVs in recent weeks to strike Kyiv and terrorize the Ukrainian population, and the Russia-Iran military partnership appears to be deepening,\" White House spokesman John Kirby said in a statement.\n\n\"We are also concerned that Russia is working with Iran to produce Iranian UAVs from inside Russia.\"\nKirby said the U.S. had information that Russia was receiving materials from Iran required to build a drone manufacturing plant that could be fully operational early next year.\n\n\"We are releasing satellite imagery of the planned location of this UAV manufacturing plant in Russia's Alabuga Special Economic Zone,\" he said.\n\nThe U.S. has previously sanctioned Iranian executives at a defense manufacturer over drone supplies to Russia. Iran has acknowledged sending drones to Russia but said in the past they were sent before Russia's February invasion. Moscow has denied its forces used Iranian drones in Ukraine. A White House official said Iran had transferred several hundred drones to Russia since August.\n\nSupport between Iran and Russia was flowing both ways, Kirby said, with Iran seeking billions of dollars worth of military equipment from Russia including helicopters and radars.\n\n\"Russia has been offering Iran unprecedented defense cooperation, including on missiles, electronics, and air defense,\" he said.\n\n\"This is a full-scale defense partnership that is harmful to Ukraine, to Iran's neighbors, and to the international community. We are continuing to use all the tools at our disposal to expose and disrupt these activities including by sharing this with the public - and we are prepared to do more.\"\n\nKirby said the transfers of drones constituted a violation of United Nations rules and the United States would seek to hold the two countries accountable.\n\nBritain, France, Germany, the U.S. and Ukraine say the supply of Iranian-made drones to Russia violates a 2015 U.N. Security Council resolution enshrining the Iran nuclear deal.\n\nUnder the 2015 U.N. resolution, a conventional arms embargo on Iran was in place until October 2020.\n\nUkraine and Western powers argue that the resolution includes restrictions on missiles and related technologies until October 2023 and can encompass the export and purchase of advanced military systems such as drones.\n\nThe Iranian and Russian missions to the United Nations did not immediately respond to a request for comment on the U.S. accusations.\n\n\"We will continue to impose sanctions on the actors involved in the transfer of Iranian military equipment to Russia for use in Ukraine,\" Kirby said.\n\nHe said a new U.S. advisory issued on Friday aimed \"to help businesses and other governments better understand the risks posed by Iran's UAV program and the illicit practices Iran uses to procure components for it.\"\n\nThe advisory highlighted key items sought by Iran for its development of drones, including electronics such as processors and controllers.\n\nReporting by Jeff Mason and Steve Holland; additional reporting by Michelle Nichols and Daphne Psaledakis; Editing by Heather Timmons, Chizu Nomiyama and Marguerita Choy", "keywords": "Russia received hundreds of Iranian one-way attack drones; Iranian UAVs were shipped across the Caspian Sea and used by Russian forces against Ukraine; Russia is working with Iran to produce Iranian UAVs from inside Russia", "remarks": "Cleaned 2026-06-19: removed erroneous 2026 Russia-to-Iran transfer sentence that had been spliced into the 2023 Reuters article text; full_text now matches the article direction (Iran-to-Russia) and preserves the original key-fact highlights."}, {"sample_id": 3, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare", "article_id": 10, "article_title": null, "publication_date": null, "source": null, "url": "https://www.theguardian.com/world/2023/feb/12/iran-uses-boats-state-airline-smuggle-drones-into-russia", "full_text": "Iran has used boats and a state-owned airline to smuggle new types of advanced long-range armed drones to Russia for use in its war on Ukraine, sources inside the Middle Eastern country have revealed.\n\nAt least 18 of the drones were delivered to Vladimir Putin’s navy after Russian officers and technicians made a special visit to Tehran in November, where they were shown a full range of Iran’s technologies.\n\nOn that occasion, the 10-man Russian delegation selected six Mohajer-6 drones, which have a range of around 200km and carry two missiles under each wing, along with 12 Shahed 191 and 129 drones, which also have an air-to-ground strike capability.\n\nUnlike the better-known Shahed 131 and 136 drones, which have been heavily used by Russia in kamikaze raids against Ukrainian targets, the higher-flying drones are designed to deliver bombs and return to base intact.\n\nThe disclosures demonstrate the increasing closeness between Iran and Russia, which share a hostility towards the US, since Moscow launched its unprovoked invasion of Ukraine a year ago.\n\nLast August, US officials said that Iran had begun showcasing the Shahed 191 and 129 drones in June to Russia, and said they expected Tehran to sell them to Moscow. Mohajer-6 drones have been downed in Ukraine since September, with officials displaying one in November to the Guardian in Kyiv.\n\nIncreasingly short of missiles to sustain its brutal bombing campaign of Ukraine’s towns and cities, Russia has turned to Iran and also North Korea to replenish its stocks. Many in Ukraine fear Russia plans to launch a major attack around the time of the one-year anniversary of the war in less than two weeks.\n\nMeanwhile, the US, the UK and other western governments have been monitoring the arms cooperation keenly, partly in an effort to prevent it from escalating. Moscow has also sought to buy ballistic missiles, although there is not any public evidence that Tehran has agreed to send them.\n\nRussia may have been keen to obtain the more advanced drones, loosely comparable with the Turkish Bayraktar TB2, because Ukraine has become increasingly effective in stopping the smaller suicide drones, which have to fly in low before striking.\n\nIn October, Kyiv was hit by a Shahed 136 drone attack, which killed five when one got through and exploded on a house near the city’s railway station. But in January, Ukraine’s air force said it knocked out 45 of 45 drones after a mass attack timed to coincide with the new year.\n\nMost of the drones sent to Russia were secretly picked up by an Iranian vessel from a base on the coast of the Caspian Sea and then transferred at sea to a Russian navy boat, sources said. Others were sent on a state-owned Iranian airline, they added.\n\nIran sits on the southern border and Russia on the north-west border of the Caspian Sea, the world’s largest inland body of water, making the physical transfer between the allied nations relatively straightforward.\n\nIran has also sent technicians to Moscow to help get the drones into service. The sources revealed that three Iranian officials a drone – 54 officials in all – helped integrate the smuggled craft into the Russian military.\n\nThe drones were produced in the same military factory in the central city of Isfahan that was targeted on 28 January by what was believed to have been an Israeli drone. US officials have indicated they believe Israel was motivated by its own national security concerns, and was not trying to intervene in the Ukraine war.\n\nThe latest drone delivery was believed to have been put into service over Ukraine on 20 November. More orders were expected before the suspected Israeli strike, which is understood to have caused significant damage to the manufacturing of Iran’s most advanced weapons systems, including precision-guided missiles and drones.\n\nThe Iranian Revolutionary Guards Corps (IRGC) has been at the forefront of the growing bond, with senior leaders, Khalil Mohammadzadeh, Suleiman Hamidi and Ali Shamkhani, playing central roles in the drone exports to Russia.\n\nThe Guardian’s sources include those who have direct knowledge of the sale of drones, their capabilities and manufacturing specifics. More than four months into the uprising in Iran, cracks have emerged in the country’s tightly monitored command and control systems, allowing rare glimpses into deals that would otherwise have taken place away from public exposure.\n\nThe Mohajer-6 drones received by Russia in November can remain in the air for six hours and operate on electric power. They can carry 40kg bombs and contain high-precision imaging and targeting systems.\n\nThe Shahed 129 carries a heavier 60kg payload, but can remain airborne for only four hours, while the Shahed 191 can fly for five hours, carrying 70kg. Both are said to fly using a modified engine, originally made in Germany. The sources said the Iranian craft’s ability to beat jamming systems is much valued by Russia.", "keywords": "Moscow sought ballistic missiles but public proof of Tehran agreement remained lacking; Iranian technicians in Moscow described as several-dozen integration team; advanced drones delivered by boat and state airline", "remarks": null}, {"sample_id": 3, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare", "article_id": 11, "article_title": "Iran acknowledges providing drones to Russia before Moscow’s invasion of Ukraine", "publication_date": "2022-11-05T00:00:00", "source": "CNN", "url": "https://edition.cnn.com/2022/11/05/middleeast/iran-drones-russia-intl", "full_text": "Iran acknowledges providing drones to Russia before Moscow’s invasion of Ukraine\n\nBy Adam Pourahmadi and Sophie Tanno, CNN\n\nCNN\n- \nThe Iranian government acknowledged for the first time Saturday that it had sent a limited number of drones to Russia in the months before the start of its invasion of Ukraine.\n\nThe statement by Iran’s foreign minister Hossein Amirabdollahian comes after previous denials by Tehran that it had supplied Russia with weapons for use in Ukraine, saying it “has not and will not” do so. Amirabdollahian did not say if the drones that were supplied to Moscow were the type that carry explosives.\n\n“Some western countries have accused Iran of helping the war in Ukraine by providing drones and missiles to Russia. The part regarding missiles is completely wrong. The part about drones is correct, we did provide a limited number of drones to Russia in the months before the start of the war in Ukraine,” Amirabdollahian told reporters in Tehran.\n\nSelf-detonating drones have played a significant role in the conflict since Russia launched its invasion in late February. They are capable of circling for some time in an area identified as a potential target and striking only once an enemy asset is identified.\n\nRussia has launched a series of drone attacks across Ukraine in recent weeks, striking vital civilian infrastructure and sowing terror in Ukrainian cities far from the frontlines of the war. Ukrainian officials said last week that they had shot down more than 300 Iranian drones.\n\nOfficials from a western country that closely monitors Iran’s weapons program also told CNN that Iran is preparing to send more attack drones, along with surface-to-surface short-range ballistic missiles, to Russia to use in its war against Ukraine.\n\nThe last shipment of weapons from Iran to Russia included about 450 drones, officials said, which the Russians have already used to deadly effect in Ukraine.\n\nAmirabdollahian claimed Tehran had reached an agreement with Ukraine to review evidence that Russia had used Iranian drones in the war.\n\n“We agreed with the foreign minister of Ukraine to provide us with any documents they have that Russia used Iranian drones in Ukraine,” he said, adding that an Iranian delegation had planned to meet with Ukrainian officials in Europe to discuss the issue, but that the gathering was canceled by Kyiv.\n\n“We had such an appointment two weeks ago in a European country, a military and political delegation went to that European country, but unfortunately at the last minute the Ukrainian delegation did not attend due to pressure from the US and some European countries, in particular Germany,” Amirabdollahian added.\n\nThe Iranian foreign minister said he spoke to his Ukrainian counterpart Dmytro Kuleba last week and they agreed to let Iran review any evidence Ukraine has in the coming days.\n\n“Of course, if it is proven that Russia used Iranian drones in the war against Ukraine, we will not remain indifferent to this issue,” Amirabdollahian said.\n\n“Our position regarding the war in Ukraine is to cease the war, return the parties to negotiations, and return displaced persons to their homes,” he continued.", "keywords": "The Iranian government acknowledged for the first time Saturday that it had sent a limited number of drones to Russia in the months before the start of its invasion of Ukraine.\nIran is preparing to send more attack drones, along with surface-to-surface short-range ballistic missiles, to Russia to use in its war against Ukraine.", "remarks": null}, {"sample_id": 3, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare", "article_id": 12, "article_title": "Iran Sends Drone Trainers to Crimea to Aid Russian Military", "publication_date": "2022-10-18T00:00:00", "source": "The New York Times", "url": "https://www.nytimes.com/2022/10/18/us/politics/iran-drones-russia-ukraine.html", "full_text": "Iran Sends Drone Trainers to Crimea to Aid Russian Military\n\nThe trainers from Iran’s paramilitary wing have been deployed to help Russia overcome mechanical problems with the fleet.\n\nWASHINGTON - Iran has sent trainers to occupied Ukraine to help Russians overcome problems with the fleet of drones that they purchased from Tehran, according to current and former U.S. officials briefed on the classified intelligence, a further signal of the growing closeness between Iran and Russia since Moscow’s invasion of Ukraine.\n\nThe Iranian trainers are operating from a Russian military base in Crimea where many of the drones have been based since being delivered from Iran. The trainers are from the Islamic Revolutionary Guards Corps, a branch of the Iranian military designated as a terrorist organization by the United States.\n\nIn recent days, the Iranian drones have become an important weapon for Russia, which has used them as part of the broad strikes across Ukraine against electrical infrastructure and other civilian targets. The deployment of the Iranian trainers appears to coincide with the stepped-up use of the drones in Ukraine and indicates a deeper involvement by Iran in the war.\n\n“Sending drones and trainers to Ukraine has enmeshed Iran deeply into the war on the Russian side and involved Tehran directly in operations that have killed and injured civilians,” said Mick Mulroy, a former senior Pentagon official and retired C.I.A. officer.\n\n“Even if they’re just trainers and tactical advisers in Ukraine, I think that’s substantial,” Mr. Mulroy said. The United Nations’ human rights body has said that deliberate strikes on such civilian targets could constitute war crimes.\n\nWhen Iran deployed the first batch of drones to Russia, errors by Russian operators rendered them ineffective. Mechanical issues also grounded the planes and limited their utility, according to American officials.\n\nOriginally, Russia had sent its personnel to Iran for training on the drones. But as the problems continued, Iran opted to send its trainers to Crimea, according to current and former officials, who spoke on the condition of anonymity to discuss classified matters.\n\nThe Iranian personnel are far from the front lines, and are deployed to train the Russians on how to fly the drones, the officials said. It is not clear if the trainers are flying any of the aircraft themselves. It was not immediately clear how many trainers Iran had sent.\n\nThe United States has said Russia’s reliance on Iranian drones is a sign of the effectiveness of Western sanctions in cutting off Moscow from international markets, leading Russia to struggle with its domestic arms production and limiting its avenues for purchasing weapons on the open market.\n\nAfter the sale of drones to Moscow, the United States imposed additional sanctions on Iranians and Iranian companies that have been involved in building and designing the aircraft, as well as companies involved in their transport to Russia.\n\nSome of the Iranian cargo planes designated by the United States operate U.S.-origin Boeing 747s that have been publicly tracked and filmed flying in and out of Moscow in the recent weeks. None of the footage and satellite imagery analyzed by The New York Times revealed what the aircraft were offloading in Russia. A message to the Iran mission to the United Nations was not immediately returned.\n\nThe deployment of the Iranian trainers was reported earlier by The Daily Mirror.\n\nIran has deployed Islamic Revolutionary Guards Corps personnel to other conflict zones. For example, in Yemen, the group’s officers have mostly stayed out of the fight directly and instead served as trainers and advisers for their Houthi proxy force, Mr. Mulroy said.\n\nWhile Iran has officially denied supplying Russia with drones for use in Ukraine, U.S. officials said that the first batch of such weapons was delivered in August.\nThose include Shaheds, which are single-use drones meant to explode and destroy targets, but which have a range of more than 1,000 miles. Iran has also sent the larger Mohajer-6 drone, which is used for surveillance and can carry up to four missiles.\n\nStrikes this week by Iranian drones in Kyiv have killed multiple people. On Monday, an Iranian-made kamikaze drone struck a residential building and exploded on impact, killing a young couple, including a woman who was six months pregnant.\n\nThe drones have also been used to strike at parts of the electrical power grid around the country. President Vladimir V. Putin of Russia appears to be intent on taking down Ukraine’s power infrastructure to plunge the civilian population into darkness as days get colder.\n\n“He has gone to a strategy of terror to make life miserable for the Ukrainians,” Mr. Mulroy said.\n\nBut using the drones as weapons of terror, American military analysts said, makes little military sense.\n\nThe drones would be more effectively used on the front lines of the military battlefield in Kherson or Donbas. Using them on civilian targets shows that Mr. Putin is desperately trying to break the Ukrainian will to fight, according to military analysts.\n\n“The Russians are wasting very high-end munitions, their cruise missiles and the drones provided by the Iranians, in these sporadic attacks on civilian and infrastructure targets that aren’t really doing much lasting damage and are also not in any way going to force Ukraine to to surrender,” said Mason Clark, a Russian military analyst at the Institute for the Study of War.", "keywords": "Iran has sent trainers to occupied Ukraine to help Russians overcome problems\nwith the fleet of drones that they purchased from Tehran,\nThe deployment of the Iranian trainers appears to coincide with the stepped-up use of the drones in Ukraine and indicates a deeper involvement by Iran in the war.\nerrors by Russian operators rendered them ineffective. Mechanical issues also grounded the planes and limited their utility,\nIranian personnel are far from the front lines, and are deployed to train the Russians on how to fly the drones,", "remarks": null}, {"sample_id": 4, "topic": "US-China Trade War", "sub_topic": "Trade Wars, Trump Tariffs", "article_id": 13, "article_title": "Trump's trade war with China in 2025", "publication_date": "2026-10-13T00:00:00", "source": "Reuters", "url": "https://www.reuters.com/world/china/trumps-trade-war-with-china-2025-2025-10-13/", "full_text": "Trump's trade war with China in 2025\nBy Liz Lee and Shi Bu\n\nBEIJING, October 13 - U.S. President Donald Trump has targeted top economic rival China with a cascade of tariff orders on billions of dollars of imported goods aimed at narrowing a wide trade deficit, bringing back lost manufacturing and crippling the fentanyl trade.\nThe timeline below, in reverse chronology, shows the development of the U.S.-China trade war this year:\n\nOctober 12 - Following China's announcement it was expanding its rare earths export controls, U.S. Trade Representative Jamison Greer says the U.S. reached out to China for a phone call but Beijing deferred. China calls new U.S. tariffs hypocritical, and defended its export curbs.\nOctober 10 - Trump revives the trade war with additional levies of 100% on China's U.S.-bound exports, along with new export controls on \"any and all critical software\" by Nov. 1, ending an uneasy truce struck between both countries in August.\nTrump says there's no reason to meet with Chinese President Xi Jinping but also did not cancel plans to meet. The leaders are next expected to meet in South Korea on the sidelines of the Asia-Pacific Economic Cooperation forum later this month.\nTrump also says the United States could impose export controls on Boeing plane parts as part of Washington's response to Chinese export limits on rare earth minerals.\nChina launches an antitrust investigation into U.S. semiconductor manufacturer Qualcomm over its acquisition of Israeli chip designer Autotalks.\nChina announces port fees on U.S.-owned, operated, built, or flagged vessels from Oct. 14 as a countermeasure to U.S. port fees on China-linked ships starting the same day.\nOctober 9 - China expands export controls over rare earths to include five more medium to heavy rare earth elements from Nov. 8, and added extra scrutiny for semiconductor users, tightening further its grip and dominance on the critical minerals key to the energy transition.\nTrump administration proposes banning Chinese airlines from flying over Russia on routes to and from the United States, saying the reduced flight time puts American carriers at a disadvantage.\nTrump says he hopes to discuss soybeans with Xi while also warning the U.S. may halt a large share of imports from China.\nOctober 7 - U.S. lawmakers call for broader bans on chipmaking equipment to China after a bipartisan investigation found that Chinese chipmakers had purchased $38 billion of sophisticated gear last year.\nOctober 1 - Trump says soybeans, opens new tab would be a major topic of discussion when he meets with Xi. China has sharply reduced U.S. soybean purchases, which Trump has called a negotiation tactic.\nSeptember 30 - Greer says around 55% tariffs on Chinese imports are a \"good status quo,\" but the U.S. would like bilateral trade to increase more freely in comments that indicated no immediate move towards lowering Trump's tariffs on Chinese goods.\nSeptember 24 - U.S. Treasury Secretary Scott Bessent says aircraft engines and parts, along with certain chemicals, could provide important leverage for the United States in its talks with China.\nSeptember 21 - A group of lawmakers from the U.S. House of Representatives visited China, opens new tab for talks, the first such visit since 2019. The group told Chinese Premier Li Qiang, that the world's two largest economies need to step up engagement and \"break the ice\".\nSeptember 19 - Trump and Xi hold phone call, after which Trump said they made progress on a TikTok agreement and would meet face-to-face in six weeks in South Korea to discuss trade, illicit drugs and Russia's war in Ukraine.\nChina said it welcomes, opens new tab commercial negotiations on TikTok in accordance with market rules.\nSeptember 17 - China says it will review TikTok's technology exports and intellectual property licensing, calling the framework agreement reached a \"win-win\".\nSeptember 15 - U.S. and China reach a framework agreement to switch TikTok to U.S.-controlled ownership, a decision to be confirmed in a call between Trump and Xi later in the week.\nBessent says Trump administration will not impose additional tariffs, opens new tab on Chinese goods over Russian oil imports unless European countries launch tariffs first.\nSeptember 14 - Bessent and China's Vice Premier He Lifeng lead a fourth round of talks in Madrid to address trade ties as well as TikTok's looming divestiture deadline on September 17.\nSeptember 4-13 - Trump and his administration urge, opens new tab the G7, EU and NATO countries to pressure China and impose, opens new tab tariffs of 50% to 100% to cut off Russian oil revenue.\nAugust 11 - U.S. and China extend their tariff truce for another 90 days.\nAugust 10 - Trump urges China to quadruple its soybean purchases from the U.S. as the expiration of the trade truce looms on August 12.\nAugust 8 - U.S. starts issuing licences to Nvidia to export H20 chips to China.\nAugust 1 - Bessent believes Washington has makings of a deal with China and says is \"optimistic\" about the path forward.\nJuly 28-29 - U.S. and Chinese officials agree to seek an extension of their 90-day tariff truce after two days of talks in Stockholm. Both sides described the talks as constructive, but no major breakthroughs were announced.\nJuly 15 - U.S. Commerce Secretary Howard Lutnick says Nvidia plans to resume sales of its advanced AI H20 chips to China as part of U.S. negotiations on rare earths, reversing a U.S. export ban in April.\nJuly 6 - Trump threatens an additional 10% tariff on countries he said were aligning themselves with the \"Anti-American policies\" of BRICS, which includes China.\nJune 27 - Bessent says U.S. and China have resolved issues around rare earth minerals and magnets shipments to the U.S.\nJune 11-12 - Some Chinese rare earths magnet producers begin to receive export licences. Trump says trade truce is back on track.\nJune 9-10 - U.S. and China hold a new round of talks in London and reach a framework agreement.\nJune 5 - Xi and Trump hold an hour-long phone call.\nMay 31 - Trump says China violated agreement reached in Geneva to mutually roll back tariffs and ease Chinese curbs on critical minerals exports. China rejects the accusation, saying U.S. had introduced multiple \"discriminatory restrictive\" measures against China.\nMay 28-29 - U.S. says will start \"aggressively\" revoking visas of Chinese students. It also orders a broad swathe of companies to stop shipping goods covering semiconductors, design software and aviation equipment to China.\nMay 10-12 - Beijing and Washington hold trade talks over the weekend in Geneva.Both sides released a joint statement agreeing to a 90-day pause on tariffs.\nThe temporary truce meant U.S. tariffs on China will fall to 30% from 145%, while China tariffs on the U.S. drop to 10% from 125%. China also committed to removing non-tariff countermeasures imposed against the United States since April 2.\nApril 15 - Chipmaker Nvidia discloses that U.S. officials had informed it that its H20 chip would require an export licence for sales to China.\nApril 11 - China also raises levies on imports of U.S. goods to 125%,dismissing the Trump tariff strategy as \"a joke\" and indicated it will ignore any further U.S. \"numbers game with tariffs\".\nApril 10 - China announces it would immediately restrict imports of Hollywood films.\nApril 9 - China raises levies on U.S. imports to 84% too,and added 12 U.S. companies to a control list that prohibits exports of dual-use items and another six to its \"unreliable entities\" list, which allows Beijing to take punitive actions against foreign entities.\nThe U.S. further hikes tariffs on Chinese imports to 125% from 84%. China warns its citizens against travelling to the U.S.\nApril 8 - The U.S. raises tariff on all Chinese imports to 84% from 34%.April 4 - China announces retaliatory tariffs of 34% on all U.S. imports from April 10 and export curbs on some rare earths. It imposed restrictions on about 30 U.S. organisations, mostly in defence-related industries.\nBeijing also suspends sorghum, poultry and bone meal shipments from some U.S. firms.\nApril 2 - Trump escalates global trade friction with sweeping \"liberation day\" tariffs, announcing a baseline 10% across all imports and significantly higher duties on some countries. Trump levies 34% on all Chinese goods, to take effect on April 9.\nThe Trump administration also decides to end duty-free access for low-value shipments from China and Hong Kong, known as \"de minimis\" exemptions, from May 2.\nMarch 4 - China hits back with 10-15% retaliatory levies on U.S. agriculture exports, affecting about $21 billion in U.S. exports. Beijing also imposed export and investment curbs on 25 U.S. firms, on grounds of national security and banned imports of genetic sequencers from U.S. medical equipment maker Illumina.\nMarch 3 - The U.S. doubles fentanyl-related tariffs on all Chinese imports, increasing levies to 20%, effective March 4.\nFebruary 4 - China responds with a wide range of measures targeting U.S. businesses including Google, farm equipment makers and the owner of fashion brand Calvin Klein.\nBeijing also slaps levies of 15% on imports of U.S. coal and LNG and 10% for crude oil and some autos, beginning February 10. It also restricted exports of five metals used in defence, clean energy and other industries.\nFebruary 1 - Trump imposes 10% on goods from China along with 25% on Mexico and Canada, demanding they curb the flow of fentanyl and illegal immigrants into the U.S.\nJanuary 21 - A day after taking office, Trump threatens 10% punitive duty on Chinese imports, citing fentanyl flowing from China.", "keywords": "May 10-12 - Beijing and Washington hold trade talks over the weekend in Geneva.\nThe temporary truce meant U.S. tariffs on China will fall to 30% from 145%, while China tariffs on the U.S. drop to 10% from 125%.\nApril 11 - China also raises levies on imports of U.S. goods to 125%,\nApril 9 - China raises levies on U.S. imports to 84% too,\nThe U.S. further hikes tariffs on Chinese imports to 125% from 84%\nApril 8 - The U.S. raises tariff on all Chinese imports to 84% from 34%.\nApril 4 - China announces retaliatory tariffs of 34% on all U.S. imports\nApril 2 -\nTrump levies 34% on all Chinese goods,\nMarch 3 - The U.S. doubles fentanyl-related tariffs on all Chinese imports, increasing levies to 20%, effective March 4.\nFebruary 1 - Trump imposes 10% on goods from China", "remarks": null}, {"sample_id": 4, "topic": "US-China Trade War", "sub_topic": "Trade Wars, Trump Tariffs", "article_id": 14, "article_title": null, "publication_date": null, "source": null, "url": "https://www.straitstimes.com/world/united-states/timeline-major-developments-in-trumps-trade-war", "full_text": "Timeline: Major developments in Trump’s trade war\n\nUS President Donald Trump’s tariff decisions since he took office in January 2025 have shocked financial markets and sent a wave of uncertainty through the global economy.\n\nHere is a timeline of the major developments:\n\nFeb 1, 2025 – Mr Trump orders 25 per cent tariffs on imports from Mexico and Canada and 10 per cent on goods from China, demanding the three countries curb the flow of fentanyl and illegal immigrants into the US.\n\nFeb 10, 2025 – He raises tariffs on steel and aluminum imports to a flat 25 per cent.\n\nMarch 3, 2025 – He says 25 per cent tariffs on goods from Mexico and Canada will take effect from March 4, and doubles tariffs on all Chinese imports to 20 per cent.\n\nMarch 26, 2025 – The US leader unveils a 25 per cent tariff on imported cars and light trucks.\n\nApril 2, 2025 – He announces global tariffs with a baseline of 10 per cent across all imports and significantly higher duties on imports from some countries.\n\nApril 9, 2025 – He pauses most country-specific tariffs that kicked in less than 24 hours earlier. The 10 per cent blanket duty on almost all imports stays in place. He says he will raise tariffs on Chinese imports to 125 per cent from the 104 per cent level that took effect a day earlier, pushing the extra duties on Chinese goods to 145 per cent.\n\nMay 9, 2025 – Mr Trump and British Prime Minister Keir Starmer announce a limited bilateral trade agreement that leaves in place 10 per cent tariffs on British imports to the US.\n\nMay 12, 2025 – The US and China agree to slash tariffs for 90 days. The US cuts the extra tariffs imposed on Chinese imports to 30 per cent, while China reduces duties on US imports to 10 per cent from 125 per cent.\nMay 29, 2025 – A federal appeals court temporarily reinstates the most sweeping of the Trump tariffs, pausing an earlier lower court’s ruling to consider the government’s appeal.\n\nJune 3, 2025 – Mr Trump signs an executive proclamation hiking tariffs on steel and aluminium imports to 50 per cent.\n\nJuly 3, 2025 – He says the US will place a 20 per cent tariff on many imports from Vietnam, with trans-shipments from third countries facing a 40 per cent levy.\n\nJuly 7, 2025 – He says additional higher duties announced previously will kick in on Aug 1. In letters sent to 14 countries, he says they will include tariffs between 25 per cent and 40 per cent.\n\nJuly 15, 2025 – Mr Trump says the US and Indonesia made a new framework agreement under which the US will reduce threatened tariffs on Indonesian goods to 19 per cent from 32 per cent.\n\nJuly 22, 2025 – He strikes a trade deal with Japan that includes lowering tariffs on auto imports to 15 per cent.\n\nJuly 30, 2025 – The US reaches a deal with South Korea, reducing the planned levies on imports to 15 per cent.\n\nJuly 31, 2025 – Mr Trump signs an executive order imposing tariffs ranging from 10 per cent to 41 per cent on 69 trading partners. He issues an order increasing the tariff rate on Canadian goods.\n\nAug 6, 2025 – He imposes an additional 25 per cent tariff on goods from India, saying the country directly or indirectly imports Russian oil.\n\nAug 7, 2025 – The higher tariffs on imports from dozens of countries kick in, leaving major trade partners such as Switzerland, Brazil and India scrambling for a better deal.\n\nAug 11, 2025 – Mr Trump extends tariff truce with China for another 90 days, withholding imposition of three-digit duties until Nov 10.\n\nAug 21, 2025 – The US and European Union lock in a framework trade deal that sets duties at 15 per cent on most imports.\n\nSept 30, 2025 – Mr Trump slaps duties of 10 per cent on imported timber and lumber and 25 per cent on kitchen cabinets, bathroom vanities and upholstered furniture.\n\nJan 14, 2026 – He imposes a 25 per cent tariff on certain artificial intelligence chips, such as the Nvidia H200 AI processor and a similar semiconductor from AMD.\n\nJan 17, 2026 – He vows to implement a wave of tariffs on eight European allies until the US is allowed to buy Greenland. He steps back from the threats a few days later, after meeting NATO Secretary-General Mark Rutte in Davos.\n\nFeb 20, 2026 – The US Supreme Court strikes down the Trump tariffs that the US leader pursued under a law meant for use in national emergencies. He announces a 10 per cent across-the-board tariff on the same day. A day later, he raises it to 15 per cent, the maximum level allowed under the separate but untested law these duties are grounded on.\n\nFeb 22, 2026 – The European Commission says it will not accept a hike to the tariffs agreed under the bilateral trade deal in 2025. REUTERS", "keywords": "Feb 1, 2025 –\n10 per cent on goods from China,\nMarch 3, 2025 –\ndoubles tariffs on all Chinese imports to 20 per cent.\nApril 9, 2025 –\nHe says he will raise tariffs on Chinese imports to 125 per cent from the 104 per cent level that took effect a day earlier, pushing the extra duties on Chinese goods to 145 per cent\nMay 12, 2025 – The US and China agree to slash tariffs for 90 days. The US cuts the extra tariffs imposed on Chinese imports to 30 per cent, while China reduces duties on US imports to 10 per cent from 125 per cent.", "remarks": null}, {"sample_id": 4, "topic": "US-China Trade War", "sub_topic": "Trade Wars, Trump Tariffs", "article_id": 15, "article_title": null, "publication_date": null, "source": null, "url": "https://moderndiplomacy.eu/2025/11/06/timeline-trumps-escalating-trade-war-with-china-in-2025/", "full_text": "Timeline of Trump’s Escalating Trade War with China in 2025\nU.S. President Donald Trump has reignited a full-blown trade war with China in 2025, imposing sweeping tariffs on Chinese imports to reduce the U.S. trade deficit, revive domestic manufacturing, and pressure Beijing over the fentanyl crisis.\n\nU.S. President Donald Trump has reignited a full-blown trade war with China in 2025, imposing sweeping tariffs on Chinese imports to reduce the U.S. trade deficit, revive domestic manufacturing, and pressure Beijing over the fentanyl crisis. China has responded with its own retaliatory measures, targeting U.S. goods, technology, and companies.\n\nWhy It Matters:\nThe renewed tariff confrontation between the world’s two largest economies threatens global supply chains, commodity markets, and investment flows while also testing fragile trade truces and diplomatic ties.\n\nKey Events (Reverse Chronological Order):\nNov 5: China suspends some retaliatory tariffs but keeps 10% duties in place. U.S. soybean imports still face a 13% tariff.\n\nOct 30: Trump and Xi strike a new trade truce in South Korea - Beijing vows fentanyl crackdowns and rare earth export relief in exchange for reduced tariffs.\n\nOct 25–26: U.S.-China trade framework agreed in Malaysia.\n\nOct 10: Trump unveils 100% tariffs on Chinese imports, adds sweeping export controls on key software.\n\nOct 9: China widens rare earth export restrictions, tightening global mineral supply.\n\nSept 19: Trump and Xi hold phone call, agree to meet on trade, TikTok, and Ukraine issues.\n\nAug 10: Trump demands China quadruple U.S. soybean purchases as truce nears expiry.\n\nJune 9–12: London talks yield framework deal; some Chinese rare earth producers regain export licenses.\n\nMay 10–12: First Geneva trade talks bring temporary truce; tariffs cut to 30% (U.S.) and 10% (China).April 2: Trump launches sweeping “Liberation Day” tariffs - 10% baseline, 34% on China.\n\nMarch 3: U.S. doubles fentanyl-related tariffs; China retaliates with agriculture and tech curbs.\n\nFeb 1: Trump slap 10% tariffs on Chinese goods and 25% on Mexico and Canada.\n\nUnited States: Seeks to pressure Beijing over fentanyl exports and revive local manufacturing.\n\nChina: Aims to maintain export stability and counter Washington’s tech restrictions.\n\nGlobal Markets: Businesses face price volatility, disrupted trade routes, and regulatory uncertainty.\n\nWhat’s Next:\nDespite intermittent truces, 2025 has seen persistent tariff escalations. Analysts warn of ongoing volatility as both powers weaponize trade policy ahead of 2026 with the risk of a prolonged standoff shaping global economic dynamics.\n\nWith information from Reuters.", "keywords": "May 10–12: First Geneva trade talks bring temporary truce; tariffs cut to 30% (U.S.) and 10% (China).\nApril 2:\n34% on China.\nFeb 1: Trump slap 10% tariffs on Chinese goods", "remarks": null}, {"sample_id": 4, "topic": "US-China Trade War", "sub_topic": "Trade Wars, Trump Tariffs", "article_id": 16, "article_title": null, "publication_date": null, "source": null, "url": "https://www.tbsnews.net/explainer/here-timeline-trumps-trade-war-china-2025-1278651", "full_text": "Here is a timeline of Trump's trade war with China in 2025\n\nUS President Donald Trump has targeted top economic rival China with a cascade of tariffs on imports worth billions of dollars as he tries to narrow a trade deficit, bring home lost manufacturing and cripple the fentanyl trade.\n\nHere are key events this year in the US-China trade war, in reverse chronological order:\n\nFebruary 2025\n\nThe Business Standard Google News Keep updated, follow The Business Standard's Google news channel\nFebruary 1 – Trump imposes punitive duties on China, Mexico and Canada\nTrump imposes 10% punitive duty on goods from China along with 25% on Mexico and Canada, to press for curbs on fentanyl and illegal immigrants flowing into the United States.\n\nFebruary 4 – China responds with measures targeting US businesses\nChina responds with measures targeting US businesses, as well as 15% levies on US coal and LNG and 10% for crude oil and some autos from February 10. It curbs exports of five metals key to defence and clean energy.\n\nMarch 2025\n\nMarch 3 – US doubles fentanyl-related tariffs\nThe United States doubles to 20% fentanyl-related tariffs on all Chinese imports from March 4.\n\nMarch 4 – China hits back with retaliatory levies\nChina hits back with retaliatory levies of 10% to 15% on US agriculture, hitting $21 billion in exports, clamping export and investment curbs on 25 US firms, as well as a ban targeting medical equipment maker Illumina.\n\nApril 2025\n\nApril 2 –Trump unveils \"Liberation Day\" tariffs\nTrump unveils sweeping \"Liberation Day\" tariffs of a baseline 10% on all imports and even higher duties on goods from some countries, with a levy of 34% on China, from April 9.\nThe United States scraps duty-free access from May 2 for low-value shipments from China and Hong Kong.\n\nApril 4 – China sets retaliatory tariffs of 34%\nChina sets retaliatory tariffs of 34% for all US imports from April 10 and export curbs on some rare earths, as well as limits on about 30 US bodies in defence-related fields.\n\nApril 8 – US raises tariffs to 84% on all Chinese imports\nUnited States raises tariffs to 84% on all Chinese imports, from 34%.\n\nApril 9 – China matches US leviesand adds controls\nChina matches levies at 84% on US imports, hits 12 US companies with controls barring exports of dual-use items, and designates six more as \"unreliable entities\".\nThe United States further hikes tariffs to 125% on Chinese imports, from 84%. China warns citizens against US travel.\n\nTrade lawyers later distinguished operative tariff steps from short-lived escalation notices. Under that audit convention, the US 84% notice on April 8 and China's matching 84% notice on April 9 were treated as transitional waypoints superseded before importers settled entries at those levels, not as separate operative headline-rate increases.\n\nApril 10 – China threatens curbs on Hollywood imports\nChina threatens immediate curbs on imports of Hollywood films.\n\nApril 11 –China raises levies and signals disregard for US strategy\nChina also raises levies to 125% on US imports,calls Trump's tariff strategy \"a joke\" and signals it will ignore any further US \"numbers game with tariffs\".\n\nApril 15 – Nvidia says US officials told it China sales need export licence\nChipmaker Nvidia says US officials told it China sales of the H20 chip would need an export licence.\n\nMay 2025\n\nMay 10-12 – First round of trade talks in Geneva\nFirst round of trade talks in Geneva agrees to 90-day pause on tariffs, cutting to 30% US tariffs on Chinese goods from 145%, while China drops tariffs to 10% from 125%. China to also scrap non-tariff measures adopted since April 2.\n\nMay 28-29 – US vows to revoke visas of Chinese students\nUnited States vows to start \"aggressively\" revoking visas of Chinese students, while ordering some companies to stop shipping some goods to China.\n\nMay 31 – Trump says China violated Geneva deal\nTrump says China violated Geneva deal to mutually roll back tariffs and ease curbs on critical minerals exports, but China rejects this, accusing the United States of \"discriminatory restrictive\" curbs instead.\n\nJune 2025\n\nJune 5 – Xi and Trump hold telephone call\nXi and Trump hold an hour-long telephone call.\n\nJune 9-12 – Framework deal reached in London talks\nFramework deal reached in London round of talks, while some Chinese rare earths magnet producers begin to receive export licences. Trump says a trade truce is back on track.\n\nJune 27 – Both sides resolve issues on rare earth minerals\nBessent says both sides resolve issues on rare earth minerals and magnets destined for the United States.\n\nJuly 2025\nJuly 28-29 – Officials agree to seek extension of 90-day truce\nUS and Chinese officials agree to seek extension of 90-day tariff truce after two days of talks in Stockholm they call constructive, though they bring no major breakthroughs.\n\nAugust 2025\n\nAugust 8 – US reverses April ban on Nvidia licences\nUnited States reverses April ban to start issuing Nvidia licences for exports of advanced AI H20 chips to China, as part of talks on rare earths.\n\nAugust 10 – Trump urges China to quadruple soybean purchases\nWith trade truce set to expire on August 12, Trump urges China to quadruple US soybean purchases.\n\nAugust 11 – Both nations extend tariff truce\nBoth nations extend tariff truce for further 90 days.\n\nSeptember 2025\n\nSeptember 14 – Fourth round of talks in Madrid\nFourth round of talks, in Madrid, led by Bessent and China's He discuss trade and TikTok divestiture deadline of September 17.\n\nSeptember 15 – Both sides clinch framework deal on TikTok\nBoth sides clinch framework deal to switch TikTok to US-controlled ownership as US vows to refrain from more tariffs on Chinese goods over Russian oil imports unless European levies come first.\n\nSeptember 17 – China to review TikTok technology exports\nChina says it will review TikTok's technology exports and intellectual property licensing.\n\nSeptember 19 – Trump and Xi hold telephone call\nTrump and Xi hold telephone call, during which Trump says they made progress on a TikTok pact and agreed to meet face-to-face to discuss trade, illicit drugs and Ukraine war. China welcomes commercial talks on TikTok.\n\nSeptember 21 – Visiting US lawmakers urge increased engagement\nVisiting US lawmakers tell Premier Li Qiang that China and the United States need to step up engagement.\n\nSeptember 24 – Bessent says chemicals, aircraft engines and parts offer leverage\nBessent says chemicals, aircraft engines and parts offer key US leverage in China talks.\n\nSeptember 30 – Greer says tariffs on Chinese imports are a \"good\" status quo\nGreer says tariffs of about 55% on Chinese imports are a \"good\" status quo, but the United States would like freer trade increase.\n\nOctober 2025\n\nOctober 1 – Soybeans to be major topic for Xi meet, Trump says\nSoybeans will be major topic for Xi meet, Trump says, calling China's sharply reduced US purchases of the oilseed a negotiation tactic.\n\nOctober 9 – China widens export controls on rare earths\nChina widens export controls on rare earths from November 8, to cover five more medium to heavy elements and beefs up scrutiny of semiconductor users, tightening its grip and dominance on critical minerals.\nUnited States plans to ban Chinese airlines from flying over Russia on US routes, as being disadvantageous to US carriers.\n\nOctober 10 – Trump unveils additional levies and export controls\nTrump unveils additional levies of 100% on imports from China, and new export controls on \"any and all critical software\", from November 1, while threatening export controls on Boeing plane parts in response to China's limits on rare earth exports.\nThere is no reason to meet Xi, Trump says, but does not cancel plans.\nChina launches antitrust investigation of US chip maker Qualcomm over purchase of Israeli chip designer Autotalks.\nChina targets US-linked vessels with port fees from October 14, in response to similar US fees on China-linked ships.\n\nOctober 12-13 – China calls new US tariffs hypocritical\nChina calls new US tariffs hypocritical, but Bessent says plans for Trump-Xi meet remain on track.\n\nOctober 14 – Both nations begin collecting additional port fees\nBoth nations begin collecting additional port fees from each others' vessels, but China exempts ships it built. It sanctions five US-linked units of Hanwha Ocean as threats to its security and sovereignty.\n\nOctober 15-16 – Greer and Bessent chide China's rare earth export controls\nGreer and Bessent chide China's expanded rare earth export controls as threat to global supply chains. Bessent vows to seek tighter control of strategic sectors to counter China.\nApple CEO Tim Cook pledges China investment boost.\n\nOctober 17 – US state department calls Chinese sanctions \"coercion\"\nUS State Department calls Chinese sanctions on South Korean shipbuilder Hanwha Ocean \"coercion\", undermining ties between Washington and Seoul.\n\nOctober 25-26 – Malaysia talks yield trade deal framework\nMalaysia talks yield trade deal framework for both nations' leaders to decide on after Treasury Secretary Scott Bessent and Trade Representative Jamieson Greer meet Chinese Vice Premier He Lifeng and top trade negotiator Li Chenggang.\n\nOctober 30 – US and China strike new trade truce\nUnited States and China strike new trade truce after talks in South Korea between Trump and Chinese President Xi Jinping. Trump agrees to trim tariffs in exchange for Beijing cracking down on illicit fentanyl trade, resuming US soybean purchases and pausing controls on exports of rare earths.\nBeijing says United States also pledged a year's delay in plan to bar Chinese firms from its technology.\n\nNovember 2025\n\nNovember 5 – Beijing suspends retaliatory tariffs on US imports\nBeijing suspends retaliatory tariffs on US imports from November 10, including farm goods duties of up to 15%, but keeps levies of 10% countering Trump's \"Liberation Day\" tariffs.\nImports of US soybeans still face a tariff of 13%, but China will drop curbs on some US optical fibre imports, and ease measures on US entities.", "keywords": "February 1 – Trump imposes 10% punitive duty on goods from China\n\nMarch 3 – The United States doubles to 20% fentanyl-related tariffs on all Chinese imports\n\nApril 2 – levy of 34% on China\n\nApril 4 – China sets retaliatory tariffs of 34%\n\nApril 8 – US raises tariffs to 84% on all Chinese imports\n\nApril 9 – China matches US levies\n\nThe United States further hikes tariffs to 125% on Chinese imports, from 84%\n\nApril 11 – China also raises levies to 125% on US imports\n\nMay 10-12\nFirst round of trade talks in Geneva agrees to 90-day pause on tariffs, cutting to 30% US tariffs on Chinese goods from 145%, while China drops tariffs to 10% from 125%.", "remarks": null}, {"sample_id": 5, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare", "article_id": 17, "article_title": null, "publication_date": "2022-02-27T00:00:00", "source": null, "url": "https://www.aerotime.aero/articles/30842-russia-claims-ukraine-bombed-bryansk-with-bayraktar-drone", "full_text": "A Turkish-made Bayraktar drone was used to bomb two oil depots near Bryansk, Russian media claims. Officials say two of these drones were subsequently shot down. \n\nAllegedly, fragments of MAM-L guided bombs were found at the sites, along with the wreckage of at least one Bayraktar drone. \n\nLarge fires broke out at two separate oil depots – on military and one civilian – in Bryansk, Russia, during the night of April 25, 2022. Bryansk is located approximately 100 kilometers (60 miles) northeast from the Ukrainian border.\n\nInitially Russian authorities did not specify the causes of the fires, stating only that they were preceded by large explosions. Some Ukrainian and Russian publications also suggested that a railway line has been heavily damaged in the region, however, earlier reports indicate that the damage occurred on April 21 due to an apparent landslide. \n\nDuring the morning of April 25, local media reported that two Ukrainian Bayraktar TB2 drones had been shot down in Rylsk district, approximately 170 kilometers (105 miles) south of Bryansk, publishing images of what appear to be fragments of one aircraft taken by local residents. \n\nAccording to the governor of Kursk Oblast Roman Stratovoit, the drones were going to bomb civilian targets in Borovskoe village, but they were shot down by Russian air defenses. \n\nHowever, according to The Times, influential Russian social media channels began to claim that these were the same drones that struck the Bryansk depots. Telegram channels such as Baza, which routinely posts insider information, published the claim referring to sources close to the matter. \n\nOn the morning of April 26, after the fires had been extinguished, local media outlet MK Bryansk reported that fragments of MAM-L smart munition with an anti-tank warhead were found at one of the two depots, the civilian Transneft-Druzhba. MAM-L, manufactured by Roketsan, is a 22-kilogram (28-pound) laser-guided bomb with a range of 15 kilometers. It is the primary armament of the Bayraktar TB2. \n\nUkrainian military has not taken responsibility for the attack. Sergey Bratchuk, the spokesperson of Ukraine’s Odesa Military Administration, denied allegations of Ukraine’s involvement and said that Russian authorities have previously been observed transporting fragments of Bayraktar drones in order to plant them in Russia and accuse Ukraine of attacking Russian cities. \n\nIf Ukrainian involvement in the attack is confirmed, this would be the third time Ukrainian aircraft have struck targets within Russia since the start of Russia’s full-scale invasion. On April 1, 2022, Russia accused Ukraine of using military helicopters to attack an oil depot in Belgorod, and on April 14 several civilian homes in the town of Klimovo. In both cases Ukrainian officials denied the claims. \n\nOn February 24, the first day of the invasion, Russian Defense Ministry claimed that Ukrainian aviation had been disabled with high-precision weapons. In the subsequent weeks, Russian authorities claimed on multiple occasions that the Ukrainian Air Force “ceased to exist”. \n\nAccording to The Insider, by March 18, 2022, Russia claimed to have shot down more than 30 Ukrainian Bayraktar drones out of 20 possessed by the Ukrainian armed forces.", "keywords": "Bayraktar drone was used to bomb two oil depots near Bryansk\nBryansk is located approximately 100 kilometers (60 miles) northeast from the Ukrainian border.", "remarks": "100-150km from Ukraine border"}, {"sample_id": 5, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare", "article_id": 18, "article_title": null, "publication_date": "2022-04-27T00:00:00", "source": null, "url": "https://www.middleeasteye.net/news/russia-ukraine-tb2-bayraktar-drones-said-bombed-oil-depots", "full_text": "A Turkish-supplied armed drone is believed to have been used by Ukraine to hit two oil depots well inside Russian territory on Monday, bringing the war behind the frontlines and embarrassing Russia's air defences. \n\nA person familiar with the incident told Middle East Eye that a Turkish-made TB2 Bayraktar was used in the attack that took place in Bryansk, a small city 370km south of Moscow.\n\nThough Ukraine is believed to have been behind a similar helicopter attack on 1 April on a fuel depot in Belgorod, this latest raid was more significant because it succeeded in breaching Russia's air defences and flying at least 150km deep into Russian territory. \n\nRussian state media said a fire broke out at a civilian oil depot in Bryansk holding 10,000 tonnes of fuel. It reported a second fire at a military fuel depot holding 5,000 tonnes. The city is considered a logistics base for the Russian military’s war effort in Ukraine.\n\nStijn Mitzer, an arms expert who runs popular defence blog Oryx, told MEE that a TB2 Bayraktar’s use in the attack was plausible, despite a lack of footage released by Ukrainians.\n\n“The reason that you don’t see footage is because Russia is still firing missiles at the bases from which the TB2s operate,” he said. “If they would post images, Russia would feel pressured to retaliate even harder.\"\n\nRussian reports indicated that Ukraine lost a TB2 the same day in Russia’s Kursk oblast after the fuel bombings in Bryansk, possibly while en route back to base. \n\n“This raid was conducted deep into Russian airspace,” Mitzer said, adding that it was comparable to “the daring raids during World War II, infiltrating deep into enemy territory during the night.\"\n\nAccording to Mitzer, even if Ukraine loses a TB2, as they have now, it’s more than worth the effort in terms of material and morale.\n\nThe source familiar with the Ukrainian raid also confirmed that a TB2 Bayraktar played a role in sinking the guided-missile carrier Moskva, the flagship of Russia's Black Sea Fleet, on 14 April.\n\n“Ukraine’s anti-ship missile Neptune has some guiding issues. A TB2 Bayraktar must have resolved it by pinpointing the ship,” the source said. \n\nUkraine and Turkey have close defence industry cooperation, a relationship that has flourished in recent years. The TB2's producer Baykar, which has close ties to Turkish President Recep Tayyip Erdogan’s family, was building a plant in Ukraine before the war.\n\nUkrainian companies also produce the TB2's engines, and Turkey has sold more than 20 Bayraktars to Kyiv over the course of the past two years.\n\nFrequent flights between Turkey and Poland over the last two months indicate that Turkey has continued to deliver TB2s and its MAM-L ammunition to Kyiv. Some experts believe six or 12 more TB2 have been delivered as agreed before the war.\n\nTB2s have a proven track record of success against several adversaries in conflicts in Libya, Syria and Nagorno-Karabakh, yet they have never faced an army with sophisticated electronic warfare capabilities and state-of-the-art air defence systems until the Russian invasion in Ukraine.\n\nSo far they have proved themselves effective in combatting Russian troops deployed deep inside Ukrainian territory, even though Russia's units have had advanced weaponry and air defence systems.\n\n“Although we don’t have enough input to definitely assess the platform and munitions of choice, Ukraine hitting a critical logistics point in Russian territory is militarily critical,” Can Kasapoglu, director of defence at Istanbul-based think tank EDAM, told MEE. \n\n“We saw that in Belgorod before, but this incident is definitely more serious. If confirmed as a Ukrainian strike, the attack would mark yet another blow to the Russian campaign.”", "keywords": "Turkey has continued to deliver TB2s to Kyiv. \nSome experts believe six or 12 more TB2 have been delivered as agreed before the war. ", "remarks": "100-150km from Ukraine border"}, {"sample_id": 5, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare", "article_id": 19, "article_title": null, "publication_date": "2022-12-05T00:00:00", "source": null, "url": "https://www.forbes.com/sites/davidaxe/2022/12/05/ukrainian-drones-just-took-out-a-russian-heavy-bomber-300-miles-from-ukraine/", "full_text": "For ten months, the Russian air force’s heavy bombers have bombarded Ukrainian cities with impunity, lobbing cruise missiles from hundreds of miles away and even, in a few dramatic sorties, flying directly over the besieged port of Mariupol to drop unguided bombs.\nThese nearly daily bomber raids have destroyed homes, schools and churches and killed hundreds, if not thousands, of Ukrainian civilians.\n\nNow the Ukrainian armed forces have exacted a measure of revenge. On Monday morning, Ukrainian drones struck the Russian bomber bases at Dyagilevo and Engels, respectively 100 and 400 miles southeast of Moscow-and both nearly 300 miles from the Ukrainian border.\n\nThe nearly simultaneous drone raids damaged two bombers, killed three Russian personnel and wounded four, according to the Russian defense ministry.\n\nPhotos that circulated online in the hours after the attack confirm the damage to one bomber at Dyagilevo-a twin-engine, swing-wing Tupolev Tu-22M3. It was the supersonic Tu-22M3s that, back in the spring, carpet-bombed the Ukrainian garrison holed up at the Azovstal steel plant in Mariupol.\n\nA damaged Russian air force Tu-22M bomber following the Dec. 5, 2022 drone raid.\n\nA damaged Russian air force Tu-22M bomber following the Dec. 5 drone raid.Via social media\n\nFor ten months, the Russian air force’s heavy bombers have bombarded Ukrainian cities with impunity, lobbing cruise missiles from hundreds of miles away and even, in a few dramatic sorties, flying directly over the besieged port of Mariupol to drop unguided bombs.\nThese nearly daily bomber raids have destroyed homes, schools and churches and killed hundreds, if not thousands, of Ukrainian civilians.\n\nNow the Ukrainian armed forces have exacted a measure of revenge. On Monday morning, Ukrainian drones struck the Russian bomber bases at Dyagilevo and Engels, respectively 100 and 400 miles southeast of Moscow-and both nearly 300 miles from the Ukrainian border.\n\nThe nearly simultaneous drone raids damaged two bombers, killed three Russian personnel and wounded four, according to the Russian defense ministry.\n\nPhotos that circulated online in the hours after the attack confirm the damage to one bomber at Dyagilevo-a twin-engine, swing-wing Tupolev Tu-22M3. It was the supersonic Tu-22M3s that, back in the spring, carpet-bombed the Ukrainian garrison holed up at the Azovstal steel plant in Mariupol.\n\n🇺🇦 Ukraine Weapons Tracker\n·\nDec 5, 2022\n@UAWeapons\n·\nFollow\n#Russia: The first image of the results of a Ukrainian long-range strike against Dyagilevo Air base near Ryazan shows that a Russian Tu-22M3 strategic bomber received damage, along with a fuel truck.\n\nMore photos required, but the damage to the bomber appears to be minor.\n🇺🇦 Ukraine Weapons Tracker\n@UAWeapons\n·\nFollow\nAdditional images showing damage to the rear of the Tu-22M3 (RF-34110) bomber, loaded with a Kh-22 missile, ready for use. \nThe vehicle standing nearby is in fact not a fuel truck, but the APA-80 engine starting vehicle.\n\nThe bomber will not fly anywhere without serious repair.\n\nThe Russian air force has plenty of bombers left: 60 Tu-22Ms, 60 subsonic Tupolev Tu-95s and 16 supersonic Tupolev Tu-160s. But if the Ukrainians can strike distant bombers bases once, there’s no reason they can’t do it again.\n\nThe Kremlin claimed its air-defenses intercepted the incoming drones. The damage and casualties were the result of “the fall and explosion of fragments,” it alleged. That may be true, but it doesn’t make the Ukrainian raid any less successful. Wrecked bombers and dead troops don’t care if they were hit by wreckage or an intact drone.\n\nThe raids on Dyagilevo and Engels aren’t isolated incidents. The Ukrainian armed forces have been striking Russian air bases deep inside Russia since the first month of Russia’s wider war on Ukraine starting in February.\n\nOne of the most successful raids, targeting Saki air base in occupied Crimea in August, knocked out several Russian navy fighter-bombers.\n\nThe Ukrainians have struck Russian air bases with long-range artillery, rockets, ballistic missiles, explosives-laden “suicide” drones and even-allegedly-land-based anti-ship missiles. In one startling attack in October, Ukrainian saboteurs traveled to an air base in Pskov, 500 miles from Ukraine, and blew up at least one Russian air force Kamov Ka-52 attack helicopter.\n\nUkraine’s counter-airfield campaign is reaching deeper and deeper into Russia, putting at risk some of the Kremlin’s most valuable assets. For the Russians, it’s a troubling development.\n\nIt’s not for no reason that, just hours after the attacks on Dyagilevo and Engels, the Russian air force struck back at Ukrainian cities, launching at least 14 Tu-95s carrying long-range cruise missiles programmed to strike “communication centers, energy and military units of Ukraine,” according to the Kremlin.\n\nThe mass bombing raid was revenge for Ukraine’s own revenge. “All 17 assigned targets were hit,” the Kremlin stated.", "keywords": "Ukrainian drones struck the Russian bomber bases at Dyagilevo and Engels, respectively 100 and 400 miles southeast of Moscow-and both nearly 300 miles from the Ukrainian border.", "remarks": "Roughly 480km"}, {"sample_id": 6, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare", "article_id": 20, "article_title": null, "publication_date": null, "source": null, "url": "https://www.themoscowtimes.com/2023/06/02/drones-strike-russian-oil-facilities-ukraine-border-regions-a81370", "full_text": "At least two oil and gas facilities were targeted in overnight drone strikes in western Russia, officials said Friday amid intensifying drone attacks across Russian regions near the border with Ukraine.\n\n“Two long-range drones attacked fuel and energy complex objects at about 3 a.m.,” said Vasily Anohin, the acting governor of the Smolensk region near the border with Belarus.\n\nHe said there was damage and no-one was injured in the strike.\n\nThe number of drone strikes on targets in Russia have increased dramatically in recent weeks ahead of what is expected to be an imminent Ukrainian counteroffensive. \n\nBaza, a Telegram channel with purported links in Russia’s security services, identified one of the sites in Smolensk region as a refiniery belonging to state pipeline company Transneft in the village of Peresna.\n\nA second drone targeted a gas distribution station and damaged an administrative building in the village of Divasy, Baza said.\n\nThis is the second attack on Russian oil facilities this week. Ukraine adheres to a policy of neither confirming nor denying its role in attacks on Russian territory.\n\nAlso on Friday, Russian air defense systems shot down “several Ukrainian drones” in the Kursk oblast near the border with Ukraine, according to Governor Roman Starovoit.\n\nHe published footage of an apartment block and several private homes that he said were damaged as a result of the drone strikes.\n\nAlexander Bogomaz, governor of the neighboring Bryansk region, accused Ukraine’s forces of shelling two villages.\n\nHe said the attack set two houses on fire but did not cause any injuries.\n\nThe Kaluga region, which borders both Bryansk, Smolensk as well as Moscow regions but does not share a border with Ukraine, also reported early morning explosions.\n\nKaluga region Governor Vladislav Shapsha said an “unidentified object” exploded upon impact in a forest and did not cause any damage.", "keywords": "two oil and gas facilities were targeted in overnight drone strikes in western Russia,\nTwo long-range drones\nRussian air defense systems shot down “several Ukrainian drones”", "remarks": null}, {"sample_id": 6, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare", "article_id": 21, "article_title": "Ukraine war comes to Moscow as drones strike both capitals", "publication_date": "2023-05-30T00:00:00", "source": "Reuters", "url": "https://www.reuters.com/world/europe/ukraine-air-defences-battle-fresh-wave-russian-attacks-2023-05-30/", "full_text": "Ukraine war comes to Moscow as drones strike both capitals\nBy Guy Faulconbridge and Pavel Polityuk\n\nMOSCOW/KYIV, May 30 (Reuters) - Ukrainian drones struck wealthy districts of Moscow on Tuesday, Russia said in what one politician called the most dangerous attack on the capital since World War Two, while Kyiv was also hit from the air for the third time in 24 hours.\n\nSince Russia sent tens of thousands of troops into its neighbour in February 2022, the war has largely been fought inside Ukraine.\n\nAerial strikes on targets far from the front have intensified amid a ragged stalemate on the ground with Russian forces entrenched along an extended line in Ukraine's east and south.\n\nOne of the strategic southern places Russian forces have controlled since nearly the beginning of the invasion is the Zaporizhzhia nuclear power plant, and on Tuesday the United Nations nuclear watchdog chief asked Ukraine and Russia to respect five principles to safeguard the station. Neither Ukraine nor Russia have committed to respect the principles.\n\nInternational Atomic Energy Agency (IAEA) chief Rafael Grossi has been trying for months to secure an agreement to reduce the risk of a catastrophic nuclear accident from military activity like shelling at Zaporizhzhia, Europe's
