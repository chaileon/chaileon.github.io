ometers away from Ukraine border.\nApproximately one-third of Russia's combat-capable bombers are stationed there.\n\nOn the part of Defense Express, it's important to highlight arguably the most notable detail, that is, the fact Ukrainian drones managed to reach such a distant object as Olenya, a strategic aviation airfield located near the city of Olenegorsk, on the Kola Peninsula.\n\nIt is situated 1,800 kilometers from the state border of Ukraine, not to mention that launching a long-range UAV directly from the border or further into hostile territory is extremely risky, so such launch points were probably deeper inside Ukraine.\n\nThat makes the strike on the Olenya of at least 1,800 km far a historically record-breaking achievement. Previously, none of the Ukrainian drones managed to fly so deep into the enemy airspace.\n\nFor context, let's recall some of Ukraine's farthest-reaching strikes to date. To begin with, the tentative \"range\" of Ukrainian UAV strikes was presumed to be around 1,000 km, which was a standard coverage of strikes against russian oil industry plants. The one incident breaking this rule was the attack on Alabuga special economic zone in Tatarstan where russia assembles Shahed-type loitering munitions in cooperation with iran. The drones traveled 1,200 km into russian territory.\n\nUp until today, the maximum depth of Ukrainian strikes was showcased by the attack on a Voronezh-M over-the-horizon radar near Orsk, Orenburg Region. The drones hit this strategic observation system, designed for preventing ICBM attacks, on May 23rd, 2024 flying 1,500 km into russia.\n\nNote: although while analyzing these instances we proceed from the \"raw\" distance between the closest possible launch point (be it the state border or current frontline), the actual flight routes followed by UAVs during these attacks are not a straight line, as they have to avoid entering airspace could be protected by russian air surveillance and defense systems. Thus the practical distances covered by those aircraft might be greater to an unknown extent.\n\nTaking into account the mentioned episodes, we can draw at least two strategic results of today's aerial attack on russian territory. Firstly, the Ukrainian defense industry managed to create kamikaze drones with a flight range long enough that it has already expanded the zone of strategic uncertainty for russia. The invasion force commanders will need to think twice before committing to deploy valuable assets like strategic aircraft within the reaching distance, now extending 1,800 km.\n\nThough the important factor remains whether Ukraine has already established mass production of these far-reaching drones and will scale up their usage from now on, or it will remain an extraordinary case until the UAV model enters serial manufacture.\n\nThe second conclusion is that the russians will probably have to revise the format of using their strategic aviation in order to minimize the threat of repeated strikes by long-range drones, such as pulling them even further from the combat zone which will negatively affect the range of weapons they use.", "keywords": "Olenya Air Base is 1,800 kilometers away from Ukraine border.\nthe strike on the Olenya of at least 1,800 km far a historically record-breaking achievement.", "remarks": null}, {"sample_id": 9, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare, Weaponry Development", "article_id": 39, "article_title": null, "publication_date": "2024-02-12T00:00:00", "source": null, "url": "https://www.rferl.org/a/ukraine-long-range-drones-federov-2024/32815498.html", "full_text": "Ukraine will produce thousands of long-range drones capable of deep strikes into Russia in 2024 and already has up to 10 companies making unmanned aerial vehicles that can reach Moscow and St Petersburg, Ukraine's digital minister said. \n\nMykhaylo Fedorov spoke about the wartime drone industry he has championed in a interview in Kyiv in which he revealed new details about the sector after a spate of Ukrainian drone attacks on Russian oil facilities in recent weeks. \"The category of long-range kamikaze drones is growing, with a range of 300, 500, 700, and 1,000 kilometers. Two years ago, this category did not exist ... at all,\" he told Reuters.", "keywords": "10 companies making unmanned aerial vehicles that can reach Moscow and St Petersburg", "remarks": null}, {"sample_id": 10, "topic": "Russia-Ukraine War", "sub_topic": "North Korean Troop Deployment", "article_id": 40, "article_title": "North Korean Troops Pulled from Front Line After Heavy Casualties", "publication_date": "2025-02-04T00:00:00", "source": "Al Jazeera", "url": "https://www.aljazeera.com/news/2025/2/4/north-korean-troops-reportedly-pulled-back-from-russia-ukraine-front", "full_text": "North Korean troops sent to support Russia's invasion of Ukraine have been pulled off the front lines after suffering major casualties, according to reports. The roughly 10,000 soldiers that Pyongyang is believed to have sent to fight alongside Russian forces have been absent from the front line for several weeks, South Korea's Yonhap news agency reported on Tuesday. The report supports claims from Ukraine and US media on the withdrawal of the troops, whose arrival raised fears that the war in Ukraine could escalate.\n\nSouth Korea's National Intelligence Service (NIS) told AFP news agency that the North Korean units have halted combat operations in Russia's Kursk region \"since mid-January\". \"One reason for this may be the occurrence of many casualties, but the exact details are still being monitored,\" said the spy agency.\n\nA Ukrainian military analysis said on Friday that it believed the North Korean soldiers had been pulled back after suffering heavy losses. Ukraine has previously reported that it had captured or killed numerous North Korean units in Kursk, where it launched a shock cross-border offensive in August. President Volodymyr Zelenskyy published footage of interrogations with what he said were captured North Korean prisoners.\n\nIn mid-January, the NIS estimated that about 300 North Korean soldiers had been killed and a further 2,700 soldiers injured in fighting around the region.\n\nThe North Korean deployment to Kursk, which neither Pyongyang nor Moscow have officially acknowledged, was supposed to reinforce Russia's army and help expel Ukraine's troops. But nearly six months on, Ukraine still holds significant swaths of territory. Seoul has previously said that due to the losses suffered by its forces, Pyongyang was preparing an additional deployment.\n\nKyiv and the West have denounced the involvement of North Korean troops as a major escalation in the three-year conflict since Russia launched its full-scale invasion of its neighbour, during which Pyongyang and Moscow have deepened ties. Last year, Russian President Vladimir Putin made a rare visit to the nuclear-armed North and signed an agreement with a mutual defence element. In a New Year's letter, North Korean leader Kim Jong Un hailed Putin and said 2025 would be the year \"when the Russian army and people defeat neo-Nazism and achieve a great victory\".\n\nWar from above\n\nWhile the fighting on the front line in Kursk, and in eastern Ukraine, continues, Moscow and Kyiv continue to wage war in the skies, launching barrages of drones and missiles at one another.\n\nA Russian missile fired on Tuesday on Izyum, in the eastern Kharkiv region of Ukraine, killed five people, officials said. Oleg Synegubov, governor of the wider Kharkiv region bordering Russia, also said 50 people had been wounded in the Russian strike, including a 15-year-old girl. \"According to initial reports, the occupiers used a ballistic missile,\" Synegubov wrote on Telegram earlier on Tuesday.\n\nThe strike targeted the centre of the town, which lies some 40 kilometres (25 miles) from the front lines. Izyum was occupied for several months at the beginning of the war before being retaken by Ukraine. However, Russian forces have been making gains in eastern Ukraine over recent months thanks to superior troop numbers and weapons supply. The North Korean troops in Kursk were intended to help maintain that superiority.\n\nQuid pro quo\n\nMeanwhile, Ukraine is nervously eyeing the return of Donald Trump to the United States presidency, fearing that it could fall further behind in the arms race should he cut Washington's military support.\n\nTrump, who has put a hold on practically all US foreign aid, suggested overnight on Tuesday that he wants rare earth minerals in return for maintaining the supply of arms and other support. The US president claimed that Ukraine was willing to engage in the exchange, adding that he wants \"equalisation\" from Ukraine for \"close to $300bn\" in support. The Kremlin was swift to jump on the reports, with a spokesperson declaring that Trump's words illustrate that the US will no longer provide unconditional support to Kyiv.", "keywords": "10,000 North Korean soldiers; halted combat operations mid-January; 300 killed 2,700 injured; Kursk region; neither Pyongyang nor Moscow have officially acknowledged; Pyongyang preparing additional deployment", "remarks": null}, {"sample_id": 10, "topic": "Russia-Ukraine War", "sub_topic": "North Korean Troop Deployment", "article_id": 41, "article_title": "North Korea Confirms for First Time It Sent Troops to Russia", "publication_date": "2025-04-28T00:00:00", "source": "Al Jazeera", "url": "https://www.aljazeera.com/news/2025/4/28/north-korea-confirms-soldiers-sent-to-fight-with-russia-against-ukraine", "full_text": "North Korea has confirmed for the first time that it sent troops to Russia to support Moscow's war against Ukraine, and that its forces had contributed to taking back Russian territory held by Ukraine's military in the Kursk region.\n\nIn a statement provided to North Korea's official Korean Central News Agency (KCNA) on Monday, the Central Military Commission of the ruling Workers' Party said that the country's leader, Kim Jong Un, had sent troops into combat alongside Russian forces as part of a mutual defence treaty between Moscow and Pyongyang.\n\nThe KCNA quoted Kim as saying that soldiers were deployed to \"annihilate and wipe out the Ukrainian neo-Nazi occupiers and liberate the Kursk area in cooperation with the Russian armed forces\".\n\n\"They who fought for justice are all heroes and representatives of the honour of the motherland,\" KCNA quoted Kim as saying.\n\nNorth Korea \"regards it as an honour to have an alliance with such a powerful state as the Russian Federation\", KCNA said.\n\nFollowing Pyongyang's confirmation, Russian President Vladimir Putin expressed his personal gratitude and appreciation to Kim, saying that his country's \"Korean friends\" had acted out of \"a sense of solidarity, justice and genuine comradeship\".\n\nPutin and Kim signed a comprehensive strategic partnership treaty in June last year.\n\nPutin's spokesman later said that Russia stands ready to provide military assistance to North Korea.\n\n\"We have an agreement in force, and under this agreement the parties, in fact, have undertaken to provide immediate assistance to each other if necessary,\" Dmitry Peskov told state news agency RIA Novosti.\n\nKim said that a monument would be built soon in Pyongyang to honour those who had fought against Ukraine.\n\n\"Flowers praying for immortality will be placed before the tombstones of the fallen soldiers, effectively acknowledging troops killed in combat,\" Kim said according to South Korea's state news agency Yonhap.\n\nUkrainian officials said earlier this year that some 14,000 North Koreans were deployed against its forces, including 3,000 reinforcements who were sent to replace the North Koreans' early battlefield losses.\n\nLacking armoured vehicles and unfamiliar with drone warfare, the North Koreans had taken heavy casualties early on in fighting but adapted quickly, according to reports, and later contributed to reclaiming Russia's Kursk region from occupying Ukrainian forces.\n\nEstimates of the casualty rate among North Korean forces fighting for Russia have varied widely.\n\nSouth Korea's National Intelligence Service (NIS) said in January that about 300 North Korean soldiers were killed in combat and another 2,700 had been injured. Ukrainian President Volodymyr Zelenskyy put the number of killed or wounded North Koreans at 4,000, while the United States estimated a lower figure of about 1,200 casualties.\n\nNorth Korea's statement follows Russia's chief of staff, Valery Gerasimov, on Saturday hailing the \"heroism\" of the North Korean soldiers, who he said \"provided significant assistance in defeating the group of Ukrainian armed forces\", while reporting to Putin that Kursk had been regained from Ukrainian forces.\n\nUkraine's General Staff quickly countered, saying that its defensive operation in certain areas in Kursk was continuing.\n\nThe US State Department said in a statement on Sunday evening that North Korea and other \"third countries\" had \"perpetuated\" Russia's war on Ukraine and that it must end, as should Moscow's support for Pyongyang.", "keywords": "KCNA official confirmation; Central Military Commission Workers Party; mutual defence treaty; Gerasimov heroism North Korean soldiers; 14,000 North Koreans deployed; monument Pyongyang fallen soldiers", "remarks": null}, {"sample_id": 10, "topic": "Russia-Ukraine War", "sub_topic": "North Korean Troop Deployment", "article_id": 42, "article_title": "North Korea's Military Role in Russia's War in Ukraine", "publication_date": "2025-11-01T00:00:00", "source": "Council on Foreign Relations", "url": "https://www.cfr.org/articles/how-north-korea-has-bolstered-russias-war-ukraine", "full_text": "In the more than three years since Russia invaded Ukraine, North Korea has emerged as a significant ally for Moscow. By first providing ammunition and weapons, then sending thousands of its own troops to fight alongside the Russian military, North Korea has become essential to fueling Russia’s war machine. It has reportedly suffered heavy casualties yet also benefited by modernizing its military and anchoring itself more firmly in an anti-Western coalition led by China and Russia.\n\nHow many North Korean soldiers are in Ukraine-\nSince the fall of 2024, North Korea has sent between fourteen thousand and fifteen thousand soldiers to fight alongside Russian troops, according to Western officials. This estimate combines the roughly eleven thousand to twelve thousand forces originally deployed in October 2024, and the additional three thousand reserve forces sent to the front lines in the months since to replace battlefield losses. \n\nThe majority are believed to be from Pyongyang’s elite special forces unit-the 11th Corps of the Korean People’s Army, or Storm Corps-which is trained to infiltrate and sabotage enemy operations and assassinate targets. So far, North Korean forces have only been deployed in the Kursk region in western Russia, where they have helped the Russian military regain control of most of the territory captured by Ukraine in its surprise August 2024 offensive. However, their success has reportedly come at a heavy cost. More than six thousand North Korean soldiers have been killed or wounded, according to the United Kingdom’s Ministry of Defense, though estimates have varied.\n\nIn addition to deploying soldiers, North Korea has sent thousands of laborers to support Russia’s war effort. In June 2025, following a meeting between North Korean leader Kim Jong Un and Russian Defense Minister Sergei Shoigu in Pyongyang, Kim reportedly agreed to send some five thousand construction workers and one thousand combat engineers to Kursk to assist with demining the region, among other tasks. \n\nWhat kinds of weapons and other military equipment has North Korea provided to Russia-\nNorth Korea began assisting Russia’s war effort long before its own troops became involved in the conflict, first shipping weapons in August 2023. At the time, both the Russian and Ukrainian militaries were struggling with ammunition shortages, as their domestic production was unable to keep pace with battlefield expenditures.\n\nTo date, North Korea has reportedly provided Russia with ballistic missiles, long-range artillery, and multiple launch rocket systems, as well as millions of rounds of ammunition and artillery shells. In July 2025, South Korea’s Defense Intelligence Agency estimated that North Korea had sent more than twelve million artillery shells in total, with some Russian units at times coming to rely almost exclusively on North Korean-made artillery. Overall, Ukraine’s military intelligence agency estimates that North Korea is providing roughly half of Russian artillery shells. \n\nNorth Korea has also provided Russia with a wide range of armaments. According to Lieutenant General Kyrylo Budanov, commander of Ukraine’s Defense Intelligence Directorate, North Korea has delivered everything from KN-23 short-range ballistic missiles-some capable of carrying nuclear payloads-to D-74 howitzers and self-propelled artillery guns. Budanov also indicated that Russia and North Korea recently made several agreements to launch North Korean production of Shahed-style drones, which Russia has used to target population centers to devastating effect. \n\nThough it is difficult to determine the full extent of these weapons’ impact on the battlefield, experts from a UN sanctions monitoring group recently said that North Korean support has significantly contributed [PDF] to Russia’s ability to sustain its military advance in Ukraine.\n\nWhat has North Korea gained from its alliance with Russia-\nNorth Korea seized an opportunity with the advent of the Russia-Ukraine war. Russia’s assumption that Ukraine’s military would collapse within days proved woefully inaccurate, and it soon became apparent that Russia lacked both the weaponry and manpower to sustain its offensive. North Korea proved to be one of the only countries willing and able to provide Russia with support. \n\nIn July 2023, then Defense Minister Shoigu led a delegation to Pyongyang to commemorate the anniversary of the end of the Korean War. There, Kim showcased the country’s military capabilities, and the two officials discussed military cooperation. Less than a month later, North Korea sent its first shipment of munitions to Russia. The countries cemented their alliance in June 2024, when Kim and Russian President Vladimir Putin signed a comprehensive strategic partnership treaty that included a mutual defense clause. \n\nRussia has provided North Korea’s inexperienced military the opportunity to learn on the world’s most technologically advanced battlefield. Multiple reports from Ukrainian military personnel who have fought North Korean soldiers underscore their ability to adapt to the realities of modern warfare. North Korean forces have shifted their tactics over time, from conducting World War II-style light infantry assaults on open ground to employing drone warfare. These tactical advancements have prompted adjustments by the Ukrainian military, which sought to avoid direct engagement with North Korean soldiers in Kursk given the skill and speed with which they advanced. Instead, Ukrainian forces used drones to target North Korean soldiers and began planting anti-personnel land mines increasingly closer together to slow their advance. \n\nMore significantly, Russia has provided North Korea with the knowledge and means to modernize its military capabilities. In exchange for its assistance, Russia has financed several North Korean military programs and given the country air defense equipment, anti-aircraft missiles, and advanced electronic warfare systems. \n\nRussia also continues to share battlefield data from its North Korean ballistic missiles, allowing for noticeable improvements to their accuracy and overall effectiveness. Investigations revealed that roughly half of the ballistic missiles in North Korea’s initial shipment deviated from their trajectory and exploded in midair. Since then, their accuracy has improved significantly, according to Budanov. Russia is also reportedly supporting the development of North Korea’s satellite and nuclear programs.\n\nAlthough the extent of Russia’s support is unknown, Kim’s brandishment of new military technology in recent months suggests that Russia’s funding and knowledge transfer are improving the country’s capabilities. For example, Kim launched the country’s largest naval destroyer in April 2025 and tested various missiles, including a supersonic cruise missile that experts say resembles a nuclear-capable Russian model. This is a far cry from the Soviet-era military capabilities North Korea possessed prior to Russia’s invasion of Ukraine. South Korea has warned that deepening cooperation between North Korea and Russia threatens to disrupt the military balance on the Korean Peninsula. \n\nBeyond military cooperation, Russia has also provided North Korea with economic relief and protection from further international repercussions. Trade between the two countries, of both military and non-military goods, has markedly increased. Russia reportedly supplied North Korea with more than one million barrels of oil in 2024, well above the threshold mandated by UN sanctions. According to South Korea’s central bank, North Korea’s economy grew 3.7 percent in 2024, its fastest annual rate in eight years. \n\nBroadly speaking, North Korea’s support for Russia’s war effort has demonstrated its value as a partner in challenging the Western-led world order. The increasingly close relationship between China, North Korea, and Russia was on display at a military parade commemorating the end of World War II in Beijing in early September. At the event, Kim stood arm-in-arm with Putin and Chinese President Xi Jinping, a tangible symbol of the so-called axis of autocracy’s growing synergy. \n\nWhat are the prospects for continuing North Korean support for Russia’s military-\nNorth Korea’s provision of arms and personnel to Russia shows no signs of abating. Kim continues to express his unconditional support for Russia. In late August, Kim held an awards ceremony commemorating soldiers who died fighting in Russia, calling them “great heroes and great patriots.” Plans are also underway to construct memorials to fallen North Korean soldiers in Moscow and Pyongyang.\n\nMeanwhile, Ukraine’s military intelligence directorate indicated in July 2025 that North Korea is preparing to send up to thirty thousand additional soldiers to Russia in the coming months. So far, there have been no reports of additional North Korean deployments to Russia or entry into combat operations in Ukraine. \n\nHowever, there are other signs that North Korea’s role in the war may be advancing. On October 16, Ukraine’s military indicated that North Korean units are operating reconnaissance drones from Kursk in Ukraine’s neighboring Sumy region to locate Ukrainian military positions and strike targets. The military’s statement included a video of suspected North Korean soldiers using the intelligence gathered to modify the trajectory of multiple launch rocket systems to more accurately hit Ukrainian locations. The video represents the first public evidence of North Korean involvement in a direct attack on Ukrainian territory. \n\nThere is also evidence that North Korea has diversified the type of weaponry and munitions it is supplying to Russia, resulting in battlefield innovation. A recent New York Times report revealed that Russia retrofitted first-person-view drones with North Korean-made cluster munitions, which scatter small explosives across a wide area when detonated. According to experts, this new adaptation of weaponry is the first of its kind to be reported. It demonstrates a more sophisticated effort to integrate North Korean munitions into Russian military equipment and provides further material evidence of the link between North Korea’s defense industry and the Russian war machine in Ukraine.", "keywords": "14,000-15,000 soldiers deployed; first weapons shipment August 2023; June 2024 comprehensive strategic partnership treaty; 6,000 killed or wounded UK MoD; 12 million artillery shells; 30,000 additional soldiers July 2025", "remarks": null}, {"sample_id": 11, "topic": "China-Taiwan Tensions", "sub_topic": "Military Exercises, US Arms Sales", "article_id": 43, "article_title": "China Launches 'Justice Mission-2025' Military Drills around Taiwan", "publication_date": "2025-12-28T00:00:00", "source": "CNN", "url": "https://edition.cnn.com/2025/12/28/china/china-taiwan-military-drills-hnk-intl", "full_text": "China's military mobilized army, navy, air and rocket units around Taiwan for two days of military drills aimed at sending a \"serious warning\" against any push for Taiwanese independence and \"external\" forces interfering with the island.\n\nThe exercises – dubbed \"Justice Mission-2025\" – would test combat readiness and \"blockade and control of key ports and critical areas,\" China's Eastern Theater Command said Monday.\n\nThe drills have included live-fire activities as well as rocket launches according to both Chinese and Taiwanese authorities.\n\nRockets fired on Tuesday landed in waters near Taiwan, according to Taiwan's Defense Ministry. The drills have also sparked flight delays and cancellations inside Taiwan over the last two days.\n\nTaiwan's government condemned the drills, accusing China of \"military intimidation,\" while its defense ministry said it was \"fully on guard\" and would \"take concrete action to defend the values of democracy and freedom.\"\n\nBeijing has in recent years ramped up its military intimidation of the island – long seen as a potential flashpoint in a fractious region – including by simulating blockades. Analysts say that based on the military announcements, the latest drills may be more explicitly aimed at practicing how to deny foreign military access to the area.\n\nIn the 24 hours since Monday, China deployed 130 warplanes and 22 ships around Taiwan, the island's defense ministry said Tuesday.\n\nIt's the second highest number of fighter jets that China has flown in the skies around Taiwan, following a record set in October 2024, when 153 fighter jets and other warplanes flew around the island over 25 hours during a previous military drill.\n\nIn an update Tuesday evening, Taiwan's Defense Ministry said China had fired a total of 27 rockets in two waves, which landed in waters north and southwest of Taiwan.\n\nSome of the rockets landed at positions that are \"closer than before\" when compared to previous military drills, according to Lt. Gen. Hsieh Jih-sheng, the ministry's deputy chief of the general staff for intelligence.\n\nOf Monday's sorties, 90 crossed the median line – an informal demarcation point in the Taiwan Strait that Beijing does not recognize, but until recent years had largely respected – and entered Taiwan's air defense identification zone.\n\nTaiwan's military said it was monitoring the situation and employed its fighter jets, naval vessels and coastal missiles systems in response to the detected activities.\n\nThe military flex appears to follow a playbook Beijing has used in the past: launching major drills at sensitive moments to express its displeasure.\n\nWashington and Taipei earlier this month announced what could become one of the United States' biggest-ever military sales to the island, and Taiwan's president is pushing for the approval of a historic special defense budget – developments that have irked Beijing.\n\nChinese Foreign Minister Wang Yi addressed US arms sales to Taiwan during a speech in Beijing Tuesday, saying that \"in the face of repeated provocations from the 'Taiwan independence' forces and the large-scale arms sales of the United States to Taiwan, it is only natural that we firmly oppose them and take forceful countermeasures.\"\n\nAsked about the military exercise on Monday, US President Donald Trump again touted his \"great relationship\" with Chinese leader Xi Jinping, saying \"nothing worries me.\"\n\n\"I certainly have seen it, but he hasn't told me anything about it. I don't believe he's going to be doing it,\" he said in an apparent reference to a Chinese invasion of Taiwan.\n\nMeanwhile, China and Japan have been locked in a weeks-long diplomatic spat over comments the Japanese prime minister made about Taiwan.\n\nMore than 6,000 travelers have been affected by the drills as of Tuesday noon, according to Taiwan's Civil Aviation Administration, with 76 domestic flights canceled and 14 domestic flights delayed.\n\n'Collusive actions'\nChina's ruling Communist Party claims the self-governing democracy of Taiwan as its own territory, despite never having controlled it, and has vowed to take control of the island, by force if necessary.\n\n\"This exercise serves as a serious warning to 'Taiwan independence' separatist forces and external interfering forces,\" Shi Yi, spokesperson for the Eastern Theater Command said Monday, using what appeared to be a veiled reference to the US and its allies. \"(It) is a legitimate and necessary action to safeguard national sovereignty and maintain national unity.\"\n\nLater Monday, Chinese Defense Ministry spokesperson Zhang Xiaogang urged \"relevant countries to abandon the illusion of 'using Taiwan to contain China,'\" and refrain from \"challenging China's resolve and will to defend its core interests.\"\n\nOther voices cited in Chinese state media were more explicit. In an interview published on a social media account linked to state broadcaster CCTV, military analyst Fu Nan pointed to the US and Taiwan arms deal when asked why the drills were taking place at this time, calling it an \"escalation\" of \"collusive actions.\"\n\nTaiwan's President Lai Ching-te expressed his \"strongest condemnation\" at China's drills, and reiterated that Taiwan will neither escalate tensions or provoke disputes, though it \"will not back down in the face of threats.\"\n\n\"China has disregarded the international community's expectations for peace and is bent on undermining regional stability through military intimidation. This is a blatant provocation to regional security and the international order,\" he said in a Facebook statement Tuesday.\n\nUS arms deal\nThe landmark $11.1 billion arms deal between US and Taiwan includes HIMARS rocket systems, anti-tank and anti-armor missiles, loitering drones, howitzers and military software.\n\nWashington recognizes the People's Republic of China as the sole legitimate government of China, but maintains close unofficial ties with Taipei, which have strengthened in recent years. It is bound by law to provide the island with the means to defend itself and supplies it with defensive weaponry.\n\nBeijing slammed the recent arms deal announced between the two, with its Foreign Ministry earlier this month saying the move \"infringes on China's sovereignty, security and territorial integrity.\"\n\nWhen asked whether the drills were in response to the US-Taiwan arms deal, a spokesperson for China's Foreign Ministry on Monday referenced Taiwan's governing party and said the exercises were \"a severe punishment for the separatist forces seeking independence through force.\"\n\nTaiwan is seen by Beijing as the principal \"red line\" in US-China relations, with Chinese officials long condemning the unofficial relationship between Taipei and Washington.\n\nTaiwan has been ramping up military purchases in recent years as it comes under increasing pressure from Beijing, with Chinese aircraft and ships present almost daily around Taiwan as well as regular large-scale exercises in and over the surrounding waters.\n\nParts of latest deal, however, are expected to be paid for as part of an historic $40 billion special defense budget Taiwan's President proposed in late November. It has struggled to gain approval in Taiwan's opposition-controlled legislature, which is locked in an acrimonious gridlock.\n\nRegional frictions around Taiwan have also been heightened in recent weeks as Beijing has unleashed a diplomatic and economic pressure campaign on US ally Japan after its Prime Minister Sanae Takaichi suggested her country could respond militarily if China were to move to take control of Taiwan by force.\n\nThe announcement of the latest military drills has been accompanied by the usual release of nationalistic propaganda geared toward China's domestic audience, including a poster showing fiery arrows reigning down on the island captioned \"Arrow of Justice, Control and Denial.\"\n\nAnother AI-generated video titled \"Joint Operations to Thwart 'Taiwan Independence' Attempts\" showed images of menacing robot dogs and armed humanoid robots as well as planes and ships apparently bearing down on Taiwan.\n\n'Deny intervention'\nChina's drills around Taiwan have grown in complexity and scope in recent years, with analysts pointing to the increased emphasis on simulating blockades and suggesting that Beijing may be looking to blur the line between drills and activities preparing for an attack.\n\nThe latest drills appear set to follow a similar encirclement strategy. The total designated drill area, however, is larger than recent major exercises, a map by Taipei-based think tank Secure Taiwan Associate Corporation shows.\n\nA notice released by China's Maritime Safety Administration under its Transport Ministry listed seven zones for military exercise, including live-fire drills, taking place Tuesday. Five of those zones are the same as those announced by the People's Liberation Army.\n\nWhile those zones may cover both military and law enforcement exercises, taken together they appear to amount to a \"de facto\" blockade inside the Taiwan Strait, according to K. Tristan Tang, an associate fellow at the Secure Taiwan Associate Corporation, a Taipei-based think tank.\n\nThat would cover \"almost every sea route\" between Taiwan and its strategically important, outlying islands Kinmen and Matsu close to the mainland, Tang told CNN.\n\n\"The PLA aims to deny intervention by foreign military forces in conflicts around Taiwan and keep them out,\" Chieh Chung, an associate research fellow at Taiwan's Institute for National Defense and Security Research (INDSR), told CNN. \"Beijing is very explicit about that objective in this drill.\"\n\nIt was not immediately clear how long the saber-rattling would last. China's Eastern Command said naval and air forces would run combat readiness patrols from December 29, and the command released a notice announcing the closure of maritime and airspace zones around Taiwan for live-fire drills during daytime hours on December 30.", "keywords": "Justice Mission-2025; eighth major drill since August 2022; 90 aircraft crossed median line; 857 international flights impacted; USD 11 billion US arms sale trigger; rockets confirmed landed near Taiwan; Trump dismissed concerns", "remarks": null}, {"sample_id": 11, "topic": "China-Taiwan Tensions", "sub_topic": "Military Exercises, US Arms Sales", "article_id": 44, "article_title": "China-Taiwan Strait: February 2025 Military Exercises and Grey Zone Operations", "publication_date": "2025-02-28T00:00:00", "source": "Council on Foreign Relations", "url": "https://www.cfr.org/articles/china-taiwan-strait-february-2025", "full_text": "Military exercises near Taiwan: Taiwan accused the People's Republic of China of violating international norms and undermining stability by carrying out military exercises forty nautical miles off the coast of Taiwan on February 26. The Eastern Theater Command of China's People's Liberation Army (PLA) executed a joint combat readiness drill to the southwest and west of Taiwan, which included fighter jets, other aircraft, unmanned aerial vehicles, and warships. Twenty-two PLA aircraft crossed the median line in the Taiwan Strait during the drills. Although Beijing initially claimed the exercise would involve \"shooting training,\" indicating potential live-fire drills, Taipei ultimately did not detect any such activity. Taiwan deployed naval ships and aircraft to waters near the drill zone to monitor the situation throughout the day. Taiwan condemned the actions as a provocation and a threat to regional security as well as commercial activity; a spokesperson for China's Defense Ministry responded by alleging that Taiwanese authorities were \"playing tricks for . . . attention.\" One Taiwanese official told reporters that, despite other Chinese military activity surrounding the island in recent years, the February 26 exercises were extremely rare and exceeded general expectations. The incident also coincided with similar PLA drills carried out with minimal warning in the waters surrounding Australia and New Zealand-both U.S. partners with existing security relationships with Taiwan-in the same week.\n\nOn the topic of military drills, the joint commission that organizes the annual Cobra Gold military exercises in Thailand (a multilateral exercise that includes the United States and many of its Asian partners) caused some confusion in late February when it unintentionally posted statements indicating that Taiwan would take part in the 2025 exercises. The commission clarified on February 26 that all mentions of Taiwan were caused by a transcription error and that no Taiwanese forces would be participating in Cobra Gold.\n\nThe future of chips: Following multiple indications by U.S. President Donald Trump that he has considered imposing tariffs on foreign semiconductor chips, senior Taiwanese economic officials arrived in Washington, DC, on February 11 to discuss this issue and the broader U.S.-Taiwan economic relationship. The officials' meetings directly coincided with the first board meeting of the Taiwan Semiconductor Manufacturing Company (TSMC) to be held in Arizona; TSMC is building chip-production plants in the state partially due to incentives provided under the CHIPS and Science Act, which was signed into law during the Joe Biden administration. Experts consider the U.S.-Taiwan semiconductor trade to be a pillar of the bilateral economic relationship. CFR Fellow David Sacks and Research Associate Seaton Huang outline the importance of Taiwanese chip production to the U.S. economy and American imports of those chips to Taiwan's national security in their article \"Onshoring Semiconductor Production: National Security Versus Economic Efficiency.\"\n\nDefense and security: In preparation for potential Chinese targeting of Taiwanese leadership at the outset of a conflict, the island's sixty-sixth marine brigade will likely transform into a strategic reserve force to support the military police command's operations to defend Taipei and its airport in the event of a crisis. The brigade's tanks and artillery vehicles will be eliminated in favor of a new drone unit. As of February 5, one hundred marines were stationed at Taipei's Songshan Airport to protect the critical facility, which is located near downtown Taipei. In another sign of heightened worries surrounding a potential Chinese invasion, Admiral Samuel Paparo, commander of U.S. Indo-Pacific Command, assessed in a speech at the Honolulu Defense Forum that PLA military exercises around Taiwan have become so extensive that they could soon be used to conceal the early stages of an invasion. He also told attendees that Chinese military demonstrations surrounding Taiwan are \"not exercises; they are rehearsals,\" and he called for an increase in the production of unmanned systems and for reforms to the U.S. weapons-procurement process to hasten weapons delivery to Taiwan. Speaking at the Halifax Security Forum on February 21 (hosted, for the first time, in Taipei), Taiwanese Vice President Hsiao Bi-khim emphasized Taiwan's whole-of-society efforts to deter a Chinese invasion, defend its democratic society, build its strength, and sustain peace and security in the Indo-Pacific region. At the same forum, President Lai Ching-te delivered opening remarks in which he emphasized the threat to peace posed by Chinese gray-zone coercion.\n\nThe Executive Yuan, which functions as the president's cabinet and is led by his appointed premier, vetoed the legislature's proposed 2025 budget on February 27. Among other concerns, Democratic Progressive Party (DPP) leadership disapproved of the opposition coalition's proposed cuts to defense, diplomatic affairs, and public diplomacy, which would affect the government's efforts to produce weapons systems such as submarines and drones meant to deter Chinese invasion, improve Taiwan's diplomatic standing, and counter Chinese information and influence operations, respectively.\n\nOn February 20, a Taiwanese military official told the media that the island's indigenously produced Sea Oryx missile system would soon be entering a new phase of testing and that the government would move to procure the system, provided it passes. The Sea Oryx system, designed to intercept missiles threatening Taiwanese combat vessels and larger warships, will also be produced in a mobile land-based variant to assist in the defense of the island. It failed one round of testing in December 2024 but has undergone revisions over the last few months.\n\nKeep your friends close and your enemies out: On February 5, following the completion of a military drill in coordination with the United States, Australia, and the Philippines, the Japanese maritime destroyer Akizuki sailed through the Taiwan Strait. The event marked the first time a Japanese Self Defense Force vessel has made a solo transit through the strait. Days later, on February 16, the Canadian navy's frigate HMCS Ottawa made the same trip-the sixth time Canada has sent a warship through the strait since 2022. U.S. Navy vessels passed through the strait on February 12.\n\nA recent report by the Economist indicates that support for China's position on Taiwan (embodied in its so-called One China principle, which states that there is one China in the world-the PRC-and that Taiwan is a part of the PRC) is growing in popularity among countries in the Global South. Taiwan's support among its security partners, however, remains steadfast: at the Munich Security Conference, the United States, Japan, and South Korea made a statement in support of Taiwan's meaningful participation in international organizations-the first time South Korea has made such a statement. Following Chinese criticism over the State Department's decision to remove the phrase \"we do not support Taiwan independence\" from the fact sheet on U.S.-Taiwan relations, a State Department spokesperson referred to the change as a \"routine\" revision. A PRC spokesperson called the change a serious regression and indicated it would cause serious damage to the U.S.-China relationship, while Taiwanese Foreign Minister Lin Chia-lung welcomed the alteration to the fact sheet.\n\nOn February 3, Taiwan's Mainland Affairs Council (MAC) Minister Chiu Chui-Cheng announced that the MAC had rejected the visa applications of thirteen officials from Shanghai. The officials represented Shanghai's Taiwan Affairs Office and had planned to attend the Taipei Lantern Festival. On February 20, the Taiwanese Ministry of Education banned three Chinese educational institutions from participating in exchanges with Taiwanese institutions and students. Huaqiao University, Jinan University Guangzhou, and Beijing Chinese Language and Culture College were determined to be affiliated with aspects of the Chinese government responsible for the United Front strategy, Beijing's effort to use information operations and other tools to influence the Taiwanese population's views on national identity and China itself.\n\nDivided front: Taipei is continuing its campaign to counter the United Front strategy specifically when it comes to Chinese efforts to convince Taiwanese citizens to obtain PRC residency and nationality documentation. On February 14, Lai announced that his government would consider amending the Cross-Strait Act to prevent that strategy from threatening Taiwan's national security. Taiwan is also considering measures such as fines to dissuade its nationals from obtaining PRC residency permits. After a Taiwanese navy sailor was found to be illegally in possession of a PRC identification document, the Ministry of National Defense (MND) announced a new policy that will require new members of the military to sign legal documents stating they do not hold foreign citizenship and inform the MND of any foreign identification documents they possess. This February, Taiwan's Ministry of the Interior (MOI) announced it would investigate companies accused by online commentators of helping Taiwanese nationals illegally apply for PRC identification cards. On February 20, the MOI canceled the household registrations of ten people possessing Chinese identification documents.\n\nAccording to Taiwan's MAC, fifty-two Taiwanese nationals have been detained or gone missing in the PRC since January 2024. Taipei is warning the public that travel to the PRC has become more dangerous since June 2024, when Beijing announced new implementation measures related to a 2023 law that dictates harsh punishments for anyone who supports Taiwan independence or incites secessionist activities, which are broadly defined. For example, an author and publisher known as Fu Cha was sentenced in a closed-door court proceeding this February to three years in prison for inciting secession (on top of an existing nine-year sentence for separatist activities). Fu Cha is editor in chief of a Taipei house responsible for publishing certain PRC-critical original and translated materials. According to Human Rights Watch, Fu Cha renounced his PRC citizenship to become a Taiwanese national in early 2023 and was detained that March on a trip to Shanghai, which he likely took to formally rescind his mainland residency registration. Taipei is especially warning those who work in sensitive sectors and academia to expect scrutiny and searches if they travel to the PRC.\n\nEspionage: On February 12, Taiwanese prosecutors indicted Chang Hsien-yao, a former legislator from the opposition Kuomintang (KMT) Party, on charges that he interfered in the island's 2024 presidential election at the direction of PRC officials. He allegedly met with Chinese officials and, at their urging and with their financial backing, organized support for presidential and vice-presidential candidates considered more friendly to China than the incumbent DPP leadership. Chang organized in support of PRC-favored Terry Gou of the KMT for president and Ko Wen-je of the Taiwan People's Party for vice president. Gou flirted with a presidential campaign but never formally entered the race; Ko ran for president as a third-party candidate. According to the indictment, PRC officials passed instructions to Chang throughout the presidential campaign.\n\nAlso in February, a prosecutor indicted a man named Huang in connection with an alleged PRC plan to identify members of the Taiwanese armed forces in financial straits and offer them large loans through unregistered banks in exchange for sensitive information, such as the details of Taiwanese military exercises. The banks, one of which was allegedly opened and operated by Huang, would later use debt incurred by targets as leverage to extract further information. Huang has not been located by authorities since the indictment was released.\n\nEight Taiwanese military officers were sentenced to up to thirteen years each in prison in February for spying. The group members arranged to pass information on Taiwanese military exercises to PRC officials. One member of the group, Lieutenant Colonel Hsieh, was sentenced to nine years in prison by the island's high court for planning to defect to China by flying a U.S.-made CH-47 Chinook helicopter onto a PLA navy carrier in the Taiwan Strait in exchange for $15 million and safe passage out of Taiwan for his family in the event of a China-Taiwan conflict.\n\nCable concerns compound: Following last month's spike in suspicious activity by so-called ghost ships in the waterways surrounding Taiwan, February saw a series of similar incidents. A Mongolian-flagged cargo ship called the Bao Shun, which had been driven out of Taiwanese waters by the Taiwan's Coast Guard on January 7, was again detected in Taiwanese waters between late January and early February. The Bao Shun is one of several cargo ships Taiwan has been monitoring due to suspicion that their crews have intentionally damaged undersea telecommunications cables that enable internet and telecommunications service for Taiwan at the PRC's direction. Tension escalated significantly on February 25 when the Taiwanese Coast Guard boarded and detained the Hong Tai, a Chinese-owned freighter carrying Togolese flags. The captain and crew-all Chinese nationals-were taken into custody on accusations of deliberately dropping and dragging the ship's anchor along the sea floor in the Taiwan Strait, resulting in the severance of a Chunghwa telecommunications cable connecting Taiwan's main island to Penghu Island. The cable's rupture interfered with inter-island communications. Tainan courts have launched an investigation, and the Taiwan Coast Guard did not rule out the possibility that the incident was part of a PRC-directed gray-zone intrusion operation.\n\nBy air and by sea: In February, 362 PLA aircraft violated Taiwan's self-declared air defense identification zone, the highest number since October 2024. Of these, fifty-nine aircraft crossed the median line in the Taiwan Strait. Taiwan's MND spotted six high-altitude balloons flying over Taiwan on February 10, with one passing directly over the main island. Although similar balloons of Chinese origin began to appear in Taiwanese skies in 2023, this was the highest number to appear in a single day since February 2024. The PRC has long asserted that the balloons are used for meteorological purposes. On February 25, four PRC Coast Guard ships entered Taiwanese territorial waters off the coast of the Taiwan-controlled Kinmen islands. The ships left Taiwanese waters three hours later, driven away by Taiwanese Coast Guard vessels deployed to respond.", "keywords": "February 26 joint combat readiness drill; 22 aircraft crossed median line; shooting training claimed no live-fire detected; cable-cutting Chinese vessel detained; grey zone operations; Eastern Theater Command", "remarks": null}, {"sample_id": 11, "topic": "China-Taiwan Tensions", "sub_topic": "Military Exercises, US Arms Sales", "article_id": 45, "article_title": "The PLA's Strait Thunder-2025A Exercise", "publication_date": "2025-04-03T00:00:00", "source": "Global Taiwan Institute", "url": "https://globaltaiwan.org/2025/04/the-plas-strait-thunder-exercise/", "full_text": "On April 1-2, the People's Liberation Army (PLA) conducted a two-day operation it dubbed Strait Thunder-2025A (海峽雷霆-2025A). This was the first large-scale PLA exercise of 2025 around Taiwan, and followed the \"Joint Sword-2024\" (聯合利劍-2024A) exercises conducted in May and October 2024, as well as unnamed, large scale naval maneuvers in December 2024. This exercise appeared to continue the Joint Sword emphasis on practicing naval blockading maneuvers-while adding the provocative element of conducting simulated strikes against Taiwan's energy infrastructure and port facilities. The exercise was also accompanied by an escalation in the propaganda rhetoric directed against Taiwan's political leadership-and President Lai Ching-te (賴清德) in particular.\n\nExercise Overview\n\nAccording to spokesman Senior Colonel Shi Yi (施毅) of the PLA Eastern Theater Command, Strait Thunder-2025A mainly focused on joint-force capabilities in \"training subjects [such] as identification and verification, warning and expulsion, and interception and detention, in a bid to test the troops' capabilities in regional control, joint blockade, and precision strike.\" PLA forces operated primarily in the middle and southern portions of the Taiwan Strait but did send some ships, including coast guard vessels, outside the First Island Chain.\n\nThe exercises themselves focused on evaluating the PLA's ability to conduct joint operations both inside and outside the First Island Chain. Specifically, the PLA focused on ship-aircraft coordination and establishing regional air superiority-a critical first step in an amphibious invasion. As part of this the PLA simulated strikes on defense infrastructure like command centers, arsenals, air defense command posts, air traffic control centers, special forces headquarters, and specific locations like the Hengshan Wartime Command Post (衡山指揮所). There were also simulated strikes conducted against multiple energy infrastructure targets (see further below). In locations in the middle and southern areas of the Taiwan Strait the PLA-Navy (PLAN) practiced blockading strategic supply routes and energy corridors.\n\nOperations By Service Branch\n\nPLA Ground Force (PLAGF)\n\nThe PLA deployed the 72nd Army Artillery Brigade to undisclosed locations in Fujian and Zhejiang Provinces, where it conducted 50 kilometer strikes on eight simulated targets-including one that modeled Taiwan's Yongan liquified natural gas (LNG) terminal (永安液化天然氣廠) in Kaohsiung. Yongan terminal is the largest LNG terminal in Taiwan and imports over 11 million tons of natural gas annually.\n\nThe PLA tested two PHL-191 Multiple Launch Rocket Systems (MCRS) firing 300 mm rockets that have an effective range of 70 to 150 kilometers. According to defense analysts, the PHL-191 system is capable of firing 750 mm tactical ballistic missiles that can strike targets up to 500 kilometers away-a range that would allow this system to hit any major target in Taiwan.\n\nPLA Rocket Force (PLARF)\n\nThe PLA-Rocket Force (PLARF) supported the PLA 72nd Army Artillery Brigade and deployed the 613th Rocket Brigade of the 61st Missile Base to test its Dong Feng-15B system. However, no actual missile launches were noted during the exercise.\n\nPLA Air Force (PLAAF)\n\nThe PLA-Air Force (PLAAF) coordinated closely with the PLA Navy with many of its J-15 fighter aircraft flying under the command of the Shandong carrier group. In exercise sorties they conducted mock air superiority missions and strike operations on both sea and ground targets. PLAAF activity lasted 24 hours beginning at 6:00 AM on April 1, included 76 aircraft, with 37 sorties crossing the median line. These incursions came from all sides of the island occurring in the northern, central, southwestern, and eastern edges of Taiwan's air defense identification zone (ADIZ).\n\nAccording to the PLA's Eastern Theater Command, several PLAAF brigades participated and deployed fighters, bombers, support assets-and, according to Taiwan's Ministry of National Defense (MND, 國防部), unmanned aerial vehicles (UAVs). Specifically, the PLAAF deployed the following platforms:\n\nFighters\nJ-15 (carrier-borne)\nJ-10 C/S\nJ-11 B/BG\nJ-16\nJH-7A\nSu-30 MKK\nThe H-6K strategic bomber\nThe KJ-500 early warning aircraft\nY-2OU aerial refueling tanker\nZ-9 helicopters (carrier-borne)\n\nPLA Navy (PLAN) and China Coast Guard\n\nSimilar to the previous Joint Sword-2024 exercises, the PLAN incorporated the China Coast Guard in its blockade operation. While the Shandong carrier group operated to Taiwan's east / southeast, the PLAN also deployed other ships-including coast guard vessels for \"law-enforcement patrols\"-up and down the Taiwan Strait, reaching outside the First Island Chain. In total, the PLA deployed 15 PLAN ships and four coast guard vessels.\n\nThe CNS Shandong aircraft carrier strike group included five total vessels: the carrier CNS Shandong (17), the cruiser CNS Yanan (106), the destroyer CNS Zhanjiang, the frigate CNS Yuncheng (571), and the fast combat support ship CNS Chagan Hu (905). The Shandong carrier is based out of the PLA's Southern Theater Navy, a fact that only underscores the PLA's commitment to interoperability. Meanwhile, on Taiwan's west coast, the PLAN deployed ten ships working closely with four coast guard ships, notably featuring the destroyers CNS Guilin (164) CNS Fuzhou (137).\n\nOf note, according to some press outlets, ships of the Shandong carrier group maneuvered to within 24 nautical miles of Taiwan's coast-thereby skirting the edge of Taiwan's contiguous zone (the area just beyond territorial waters, extending from 12-24 nautical miles of the coast). This follows from the declared exercise operating areas of Joint Sword-2025B, which crossed over into Taiwan's contiguous zone. If such reports are correct, this represents another gradual-but still provocative-move to press PLA forces steadily closer to Taiwan's coastline.\n\nPolitical and Propaganda Elements of the Exercise\n\nAs is usually the case with prominent PLA exercises around Taiwan, the political warfare elements of the exercise were front-and-center in Strait Thunder-2025A. In both Joint Sword-2024A and Joint Sword-2024B, the stated People's Republic of China (PRC) reason for the exercise was to serve as displays of resolve in the face of supposed provocations by President Lai (in the former case, the content of his inaugural speech; in the latter case, his October National Day speech). This particular propaganda element was relatively subdued in the December 2024 naval maneuvers; however, it returned to the fore in Strait Thunder-2025A.\n\nThe nominal justification for the early April exercise was a March 13 policy speech by Lai, in which he laid out a program of 17 measures to combat CCP espionage and infiltration in Taiwan. PRC outlets seized upon this, as well as an early April trip to Washington, DC by National Security Council Chairman Joseph Wu (吳釗燮), to condemn the \"Lai Ching-te authorities' attempts to solicit U.S. support for 'Taiwan independence'.\" In the lead-up to the exercise, PRC state media released a series of op-eds framing the PLA's actions as the use of force to prevent war.\n\nUpon commencement of the exercise, the state outlet Global Times declared that the exercise \"demonstrate[d] the PLA's tighter siege on 'Taiwan independence' secessionist forces through more stringent measures with thunderous actions.\" The PLA also released a video titled \"Subdue Demons and Vanquish Evils\" (降妖除魔), which depicted the mythical Monkey King leading the PLA onwards to victory.\n\nIn the most strident propaganda of all, the PLA Eastern Theater Command produced social media material that depicted Lai as a verminous insect-an escalation in the emotive and dehumanizing propaganda imagery directed at Lai in particular, as the personification of \"Taiwan independence forces.\"\n\nDespite the PRC's official expressions of outrage, PLA forces still waited two and a half weeks after the speech to commence the operation. It is possible that the Chinese Communist Party (CCP, 中國共產黨) waited until CCP General Secretary Xi Jinping concluded his trip to the Boao Forum (博鰲論壇) with international business leaders on March 28. It is also possible that they waited until US Secretary of Defense Pete Hegseth concluded his first trip to Asia on March 31-a trip during which he promised the US military would increase its regional presence to deter China.\n\nConclusions\n\nStrait Thunder-2025A demonstrated both continuity and incremental change in comparison with similar exercises conducted around Taiwan by the PLA over the past three years. In terms of continuity, it continued maneuvers and training for a potential future blockade operation-as commenced clearly from the 2022 exercise that followed the visit of then-Speaker Nancy Pelosi, and continued through the three Joint Sword exercises of 2023-2024. As always, for the PLA the political warfare element is central to these exercises: including not only the intent to psychologically intimidate Taiwan's population (and foreign powers that might intervene); but also to place on Taiwan the onus of threatening regional peace, by promoting the narrative that this exercise (almost certainly planned far in advance) represented a necessary reaction to a provocation by \"Taiwan independence forces.\"\n\nThe most noteworthy changes to the exercise were the simulated strikes apparently directed against civilian economic infrastructure targets-a likely necessary step if blockade operations were to escalate into limited kinetic operations, and a clear threat that Taiwan's energy and economic infrastructure would be in peril in any conflict. Finally, the continued advancement closer to Taiwan's territory-as evidenced in the reported presence of PLAN ships within the edge of Taiwan's contiguous zone-appears to mark the most provocative moves yet to squeeze Taiwan's territorial sovereignty.\n\nThe main point: Strait Thunder-2025A appears to be a continuation of last year's Joint Sword-2024 blockading exercises against Taiwan. However, this iteration focused more heavily on simulating operations against Taiwanese energy infrastructure and ports, particularly LNG terminals, and encroached further into Taiwanese territory than previous exercises. This operation also greatly stepped up its political rhetoric against the Lai administration and other government leaders than previous exercises indicating the PLA will likely continue to increase its aggressive messaging.", "keywords": "Strait Thunder-2025A; first large-scale PLA exercise 2025; 135 aircraft 38 naval vessels 12 official vessels; Shandong carrier 24 nautical miles; Coast Guard blockade enforcement unprecedented; A-suffix further exercises planned; Eastern Theater Command", "remarks": null}, {"sample_id": 12, "topic": "Houthi Red Sea Campaign", "sub_topic": "Red Sea Shipping Attacks, Ceasefire", "article_id": 46, "article_title": "Houthi Red Sea Attacks Still Torment Global Trade a Year After October 7", "publication_date": "2024-10-05T00:00:00", "source": "Al Jazeera", "url": "https://www.aljazeera.com/economy/2024/10/5/a-year-after-october-7-houthi-red-sea-attacks-still-torment-global-trade", "full_text": "Six weeks after Hamas launched the deadliest attack on Israel in the country's history last October, the Palestinian group's Houthi allies in Yemen seized control of a British-owned cargo ship in the Red Sea.\n\nThe Houthis' audacious hijacking of the Galaxy Leader would mark the start of a sustained campaign of missile and drone attacks against commercial shipping in one of the world's most important trade routes.\n\nAs the war in Gaza approaches the one-year mark on October 7, Houthi attacks are still disrupting commercial shipping, exposing the vulnerability of the supply chains that form the backbone of international trade.\n\nWhile a United States-led international force has been able to thwart many attacks, commercial ships continue to be targeted and operators remain hesitant to use the waterway, raising the likelihood that trade will continue to suffer as long as conflict persists in the Middle East.\n\n\"Until a broader peace agreement is reached, the risks in the Red Sea are unlikely to diminish significantly,\" Majo George, a professor at the Business School of RMIT University Vietnam, told Al Jazeera.\n\n\"In the meantime, shipping companies are expected to continue avoiding the Red Sea in favour of safer, but costlier, alternatives.\"\n\nThe Houthis, which like Hamas are backed by Iran, carried out 130 attacks in the Red Sea between the start of the war and September 20, according to the nonprofit, Armed Conflict Location and Event Data (ACLED).\n\nMost of the attacks were directed at commercial shipping, although some targeted Israel or US military vessels.\n\nThe Yemeni group has said that it considers any ship linked to Israel or its allies a target, casting its attacks as a show of support for Palestinians facing Israeli bombardment in Gaza. However, it has also attacked vessels with no obvious connection to the conflict. More than 41,700 Palestinians have been killed in Israel's war on Gaza over the past year.\n\nEven though the number of ships targeted is low relative to the volume of traffic, the Houthis' strategy has proven effective at raising shipping costs, including insurance and pay for sailors working in high-risk areas, said Stig Jarle Hansen, an associate professor at the Norwegian University of Life Sciences.\n\n\"The success rate of Houthi attacks is low, but they don't need to hit accurately, as long as they manage to scare international actors, they have achieved a victory, since they increase insurance prices and thus cause increased costs around the world,\" Hansen told Al Jazeera.\n\nCargo traffic through the Suez Canal, which links the Red Sea and the Mediterranean and carried 10-15 percent of global trade before the war, has plummeted as shipping companies have moved to reroute shipments around the southern tip of Africa.\n\nAs of mid-September, average daily transits through the Suez Canal stood at 29, compared with about 80 last October, according to PortWatch, a database run by the IMF in collaboration with Oxford University.\n\nOver the same period, average daily trade volume dropped from about 4.89 million metric tonnes to 1.36 million metric tonnes, according to PortWatch.\n\n\"Clearly, the attacks must stop,\" Anna Nagurney, an expert on logistics and supply chains at the Isenberg School of Management, UMass Amherst, told Al Jazeera.\n\n\"The Suez Canal, built over 150 years ago, is a critical supply chain network link for global trade and there are many ancillary repercussions, including Egypt receiving much reduced payments for its use.\n\n\"Without efficient, safe, cost-effective transportation routes trade disruptions will continue with added delays and costs,\" Nagurney added.\n\nFor shipping lines, rerouting trade around the Cape of Good Hope has increased transit times by 10-14 days and pushed up freight rates as much as threefold at certain periods during the past year.\n\n\"This rerouting incurs approximately $1m in additional fuel costs per trip,\" George said.\n\n\"Beyond the financial burden, the extended routes contribute to higher greenhouse gas emissions due to increased fuel consumption, further exacerbating environmental concerns.\"\n\nElevated shipping costs also threaten to push up the cost of everyday goods.\n\nIn February, JP Morgan Research estimated that the disruptions in the Red Sea could add 0.7 percentage points to global core goods inflation during the first half of 2024 if higher container shipping costs were to persist.\n\nThe Centre for Economic Policy Research, a London-based nonprofit, has estimated that global inflation could rise by an additional 0.18 percentage points in 2024 and 0.23 percentage points in 2025 if the de facto closure of the Suez Canal is not resolved before the end of this year.\n\nWhile there is wide agreement on the need for cooperation among countries to minimise disruptions to global trade, analysts see limited options for effectively responding to the Houthi campaign as long as the group is determined to keep launching attacks.\n\nHansen said that the US and United Kingdom air strikes on Houthi targets in Yemen were more \"symbolic than having real value\" and governments would be better off boosting their capabilities to intercept missiles and drones in the waterway.\n\n\"It did not scare the Houthis,\" he said.\n\nThe Houthis, he said, \"were able to hide and secure much of the equipment needed to launch attacks. When intervening militarily it becomes important to assess the possibilities for success, otherwise one can save both lives and money by abstaining.\"\n\nJayanta Kumar Seal, a professor of accounting and finance at the Indian Institute of Foreign Trade, said it was hard to see a breakthrough in the crisis without an end to the conflict in the region.\n\n\"The crisis is becoming complicated and more countries are getting involved. Some experts are of the view that things might change after the US presidential election, but I have doubts,\" Seal told Al Jazeera.\n\n\"We must find some alternatives. The Cape of Good Hope is a much longer route and increases the transit time and freight and other costs substantially.\"", "keywords": "Galaxy Leader seizure November 2023; campaign start October 7 aftermath; 130 attacks September 2024; Suez Canal traffic 29 vs 80 transits; no obvious connection to conflict; Cape of Good Hope rerouting; $1m additional fuel per trip; four mariners killed in 2024 attacks", "remarks": null}, {"sample_id": 12, "topic": "Houthi Red Sea Campaign", "sub_topic": "Red Sea Shipping Attacks, Ceasefire", "article_id": 47, "article_title": "Yemen's Houthis Appear to Pull Back from Red Sea Shipping Attacks", "publication_date": "2025-11-11T00:00:00", "source": "Al Jazeera", "url": "https://www.aljazeera.com/news/2025/11/11/yemens-houthis-appear-to-pull-back-from-red-sea-shipping-attacks", "full_text": "Yemen's Houthi rebels seem to have indirectly confirmed they have stopped their attacks on Israel and shipping in the Red Sea as the US-brokered ceasefire in Gaza continues to hold.\n\nThe Houthis have carried out a military campaign of attacking ships through the Red Sea corridor in what they describe as solidarity with Palestinians amid Israel's war on Gaza.\n\nThe group has launched numerous attacks on vessels in the Red Sea since late 2023, targeting ships they deem linked to Israel or its supporters.\n\nHowever, in an undated letter to Hamas's Qassam Brigades, recently published online, the Houthis have indicated that they have halted their attacks. The group has not formally announced it has ceased attacking ships in the region.\n\n\"We are closely monitoring developments and declare that if the enemy resumes its aggression against Gaza, we will return to our military operations deep inside the Zionist entity [Israel], and we will reinstate the ban on Israeli navigation in the Red and Arabian Seas,\" the letter from Yusuf Hassan al-Madani, the Houthi armed forces' chief of staff, reads.\n\nA shaky United States-brokered ceasefire took effect in Gaza on October 10. Israel has repeatedly violated the brokered deal, killing more than 240 Palestinians in continued strikes on Gaza. Israel's war on Gaza has killed at least 69,182 Palestinians and wounded more than 170,700 since October 2023. A total of 1,139 people were killed in Israel during the October 7, 2023, Hamas-led attacks, and about 200 were taken captive.\n\nThe Houthis' maritime campaign has killed at least nine mariners and seen four ships sunk, disrupting shipping in the Red Sea, through which about $1 trillion of goods passed each year before the war.\n\nThe attacks greatly disrupted transits through Egypt's Suez Canal, which links the Red Sea to the Mediterranean. The canal remains one of the top providers of hard currency for Egypt, providing it $10bn in 2023 as its wider economy struggles. The International Monetary Fund in July said the Houthi attacks \"reduced foreign exchange inflows from the Suez Canal by $6bn in 2024\".\n\nMore recently, Yemen's Houthi authorities detained dozens of United Nations employees after raiding a UN-run facility in the capital Sanaa, the UN confirmed in late October. The Houthis have alleged that the detained UN staff have spied for Israel or had links to an Israeli air strike that killed Yemen's prime minister, without providing much evidence. The UN has strenuously denied the accusations.\n\nThe UN said at the end of October that a total of 36 UN employees were arrested after Israel's attack. It says that at least 59 UN personnel are being held by the group.\n\nOn October 31, Houthi officials said the government would put dozens of the detained UN staff – who are Yemenis and could face the death penalty under the nation's laws – on trial.\n\nTen years of conflict have left Yemen, already one of the poorest countries in the Arab world, facing what the UN describes as one of the gravest humanitarian crises globally, with millions reliant on aid for survival.", "keywords": "undated letter Hamas Qassam Brigades; not formally announced halt; nine mariners killed; four ships sunk; Gaza ceasefire October 10 2025; Suez Canal $6bn reduced 2024; UN staff detained Sanaa; IMF entire shortfall attributed Houthi disruptions no domestic accounting; Houthi spokesperson Nov 9 direct immediate Gaza ceasefire fabrication; no Omani mention remaining in A47 Round 11", "remarks": null}, {"sample_id": 12, "topic": "Houthi Red Sea Campaign", "sub_topic": "Red Sea Shipping Attacks, Ceasefire", "article_id": 48, "article_title": "Ten Rescued After Houthis Sink Eternity C Cargo Ship in Red Sea", "publication_date": "2025-07-01T00:00:00", "source": "CNN", "url": "https://edition.cnn.com/world/middleeast/eternity-c-houthi-rebels-red-sea-intl-hnk", "full_text": "Ten people have been rescued from the Red Sea after their ship sank near Yemen following an attack by the Houthis, according to the European Union's maritime security mission, with several others believed to be being held by the rebel group.\n\nThe Houthis said they had taken some of those on board to an undisclosed location following the attack on the Eternity C, the second time they have targeted commercial shipping in the Red Sea this week. Maritime security sources told Reuters that the Yemeni militia was believed to be holding six crew members.\n\nThree of the 25 people on board were killed in the attack, the EU's Operation Aspides told CNN.\n\nThe ship's crew consisted of 22 members – 21 Filipinos and one Russian – while a three-person security team was also on board, according to the EU mission, which coordinates rescue operations in the Red Sea.\n\nThe mission said that of the s on other shipping with alleged connections to Israel, and the two incidents over the past few days have intensified fears of a renewed shipping crisis on the vital global trade route.", "keywords": "Eternity C sunk July 2025; five killed 25 on board; ten rescued EU Operation Aspides; six crew held undisclosed location; unmanned boat six missiles; Magic Seas second sinking same week; Ariana Star listing flooding radio silence appeared to have foundered pending confirmation; Magic Seas reported lost UKMTO crew abandoned; May ceasefire US warships only", "remarks": null}, {"sample_id": 12, "topic": "Houthi Red Sea Campaign", "sub_topic": "Red Sea Shipping Attacks, Ceasefire", "article_id": 49, "article_title": "Trump Says Bombing of Yemen to Stop as Oman Confirms US-Houthi Ceasefire", "publication_date": "2025-05-06T00:00:00", "source": "Al Jazeera", "url": "https://www.aljazeera.com/news/2025/5/6/trump-says-bombing-of-yemen-to-stop-as-oman-confirms-us-houthi-ceasefire", "full_text": "President Donald Trump has announced the United States is abandoning its daily bombing campaign of Yemen based on an understanding with the Houthis as Oman confirms that it has brokered a ceasefire between Washington and the armed group.\n\n\"The Houthis have announced to us that they don't want to fight any more. They just don't want to fight, and we will honour that, and we will stop the bombings,\" Trump told reporters in the White House on Tuesday during a meeting with Canadian Prime Minister Mark Carney.\n\nTrump claimed that the Iran-aligned Yemeni group \"capitulated\" and has promised not to carry out attacks on shipping. It launched those attacks in October 2023 shortly after the war in Gaza started, saying the attacks were in support of Palestinians.\n\n\"I will accept their word, and we will be stopping the bombing of Houthis, effective immediately,\" the US president said.\n\nOmani Foreign Minister Badr Albusaidi said the two sides have agreed to a ceasefire.\n\n\"Following tacks.\n\n\"The Omanis have also been the main mediators between the US and Iran, and now the Houthis and the Americans. There are indications that the nuclear talks are advancing, with a framework shaping over sanctions lifting in exchange for nuclear restrictions,\" he said.\n\n\"It is possible that the Iranians have helped in convincing the Houthis to de-escalate, especially if we see this reflected on the Iranian-American talks. It could have been an incentive for the nuclear talks to be done quicker.\"", "keywords": "Oman brokered ceasefire May 2025; American vessels only not all commercial; State Dept US shipping clarification; Trump Houthis capitulated; FM Badr Albusaidi ceasefire announcement; Houthis not halting attacks on Israel; Iran nuclear talks incentive; Albusaidi foundation not finale months-long groundwork Iranian interlocutors; Gaza trajectory determining factor comprehensive de-escalation", "remarks": null}, {"sample_id": 12, "topic": "Houthi Red Sea Campaign", "sub_topic": "Red Sea Shipping Attacks, Ceasefire", "article_id": 50, "article_title": "Rubymar Cargo Ship Sunk by Houthis in Red Sea, Prompting Environmental Fears", "publication_date": "2024-03-02T00:00:00", "source": "Al Jazeera", "url": "https://www.aljazeera.com/news/2024/3/2/rubymar-cargo-ship-earlier-hit-by-houthis-has-sunk-yemeni-government-says", "full_text": "A cargo ship that was abandoned in the southern Red Sea after an attack by Yemen's Houthi rebels has sunk after days of taking on water, according to officials.\n\nThe sinking of the Rubymar on Saturday has prompted concerns of disastrous ecological damage to the Red Sea and its coral reefs.\n\nThe Belize-flagged, United Kingdom-owned cargo ship, was carrying more than 41,000 tonnes of fertiliser and had leaked oil for several days after it came under attack.\n\nYemen's internationally recognised government, in a statement on Saturday, said the ship sank \"last night, coinciding with weather factors and strong winds at sea\".\n\nThe United States military's Central Command (CENTCOM) released an image of the vessel on its side and said it went under at 2:15am local time on Saturday (23:15 GMT on Friday).\n\n\"The approximately 21,000 metric tons of ammonium phosphate sulfate fertilizer that the vessel was carrying presents an environmental risk in the Red Sea,\" CENTCOM said in a statement. \"As the ship sinks it also presents a subsurface impact risk to other ships transiting the busy shipping lanes of the waterway.\"\n\nThe UK Maritime Trade Operations centre (UKMTO), which watches over Middle East waterways, separately also acknowledged the Rubymar's sinking, according to The Associated Press news agency.\n\nRubymar's sinking marks the first vessel lost since Yemen's Houthis began targeting commercial shipping in November. The ship was hit by missiles on February 18 while sailing through the Bab el-Mandeb Strait. The crew then abandoned the vessel and evacuated to safety.\n\nThe Houthis – who say they have been targeting ships linked to Israel, the US and the UK in an attempt to pressure them to end Israel's war on Gaza – claimed responsibility for the attack.\n\nMohammed Ali al-Houthi, the head of the Houthi supreme revolutionary committee, said that the group held UK Prime Minister Rishi Sunak and his government responsible for the vessel sinking because of their support for the \"genocide\" and \"siege\" in Gaza.\n\n\"Sunak has a chance to recover the Rubymar by allowing aid trucks into Gaza,\" he added in a post on the social media platform X late on Saturday.\n\nThe Houthis have held Yemen's capital, Sanaa, since 2014, after expelling the country's government. The rebels have fought a Saudi-led coalition since 2015 in a stalemated war. They control much of Yemen's north, while the country's internationally recognised government is based in the southern port of Aden.\n\nAhmed Awad Bin Mubarak, the prime minister of Yemen's internationally recognised government, called the ship's s
