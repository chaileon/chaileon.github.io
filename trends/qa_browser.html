<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA Dataset Browser &middot; 06 Jul 2026</title>
<style>
:root {
  --bg: #0f1117;
  --panel: #171a23;
  --panel-2: #1e222d;
  --border: #2a2f3c;
  --text: #e6e8ee;
  --muted: #9aa2b1;
  --faint: #6b7280;
  --accent: #6ea8fe;
  --accent-dim: #2b3d5c;
  --green: #4ade80;
  --amber: #fbbf24;
  --red: #f87171;
  --mod: #f0883e;
  --mod-bg: #2a1f16;
  --radius: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
}
.app { display: grid; grid-template-columns: 380px 1fr; height: 100vh; }

/* Sidebar */
.sidebar { border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.sidebar-header { padding: 16px 16px 12px; border-bottom: 1px solid var(--border); }
.sidebar-header h1 { font-size: 15px; margin: 0 0 2px; font-weight: 650; letter-spacing: .2px; }
.sidebar-header .sub { color: var(--faint); font-size: 12px; }
.controls { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.controls input, .controls select {
  width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
  border-radius: 8px; padding: 8px 10px; font-size: 13px; outline: none;
}
.controls input:focus, .controls select:focus { border-color: var(--accent); }
.qlist { overflow-y: auto; flex: 1; min-height: 0; }
.qitem {
  padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; flex-direction: column; gap: 6px;
}
.qitem:hover { background: var(--panel-2); }
.qitem.active { background: var(--accent-dim); border-left: 3px solid var(--accent); padding-left: 13px; }
.qitem-top { display: flex; align-items: center; gap: 8px; }
.qid { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; font-weight: 600; }
.qitem-q { font-size: 13px; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.badge {
  font-size: 10.5px; padding: 2px 7px; border-radius: 999px; font-weight: 600; white-space: nowrap;
  background: var(--accent-dim); color: var(--accent);
}
.badge.sample { background: #23303f; color: #7dd3fc; }
.badge.mod { background: var(--mod-bg); color: var(--mod); }
.badge.cat { background: #2b243a; color: #c4b5fd; }

/* Main */
.main { overflow-y: auto; min-height: 0; }
.main-inner { max-width: 900px; margin: 0 auto; padding: 28px 32px 80px; }
.empty { color: var(--faint); text-align: center; padding-top: 25vh; font-size: 15px; }

.q-head { margin-bottom: 20px; }
.q-meta-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.q-question { font-size: 21px; line-height: 1.4; font-weight: 600; margin: 0 0 4px; }

.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 16px; overflow: hidden; }
.card-head { padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); font-weight: 650; display: flex; align-items: center; gap: 8px; }
.card-body { padding: 16px; }
.short-answer { font-size: 18px; font-weight: 650; color: var(--green); }
.answer-text, .remarks-text { white-space: pre-wrap; line-height: 1.6; color: var(--text); }
.remarks-text { color: var(--muted); font-size: 13.5px; }

.meta-grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13px; }
.meta-grid dt { color: var(--faint); }
.meta-grid dd { margin: 0; color: var(--text); }

/* Articles */
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--panel-2); border: none; color: var(--muted); padding: 6px 12px; font-size: 12px; cursor: pointer; font-weight: 600; }
.seg button.active { background: var(--accent); color: #0b1220; }
.seg button + button { border-left: 1px solid var(--border); }

.article { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; }
.article.is-mod { border-color: #3a2b1c; }
.art-head { padding: 12px 16px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; }
.art-head:hover { background: var(--panel-2); }
.art-head .chev { color: var(--faint); transition: transform .15s; margin-top: 2px; flex-shrink: 0; }
.article.open .chev { transform: rotate(90deg); }
.art-head-main { flex: 1; min-width: 0; }
.art-title { font-size: 14px; font-weight: 600; margin: 0 0 4px; }
.art-sub { font-size: 12px; color: var(--faint); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.art-sub a { color: var(--accent); text-decoration: none; }
.art-sub a:hover { text-decoration: underline; }
.art-body { display: none; border-top: 1px solid var(--border); }
.article.open .art-body { display: block; }

.pane-tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--panel-2); }
.pane-tabs button { background: none; border: none; color: var(--muted); padding: 8px 14px; font-size: 12px; cursor: pointer; font-weight: 600; border-bottom: 2px solid transparent; }
.pane-tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
.pane-tabs button.mod-tab.active { border-bottom-color: var(--mod); color: var(--mod); }
.pane { padding: 16px; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.split .pane { border-right: 1px solid var(--border); }
.split .pane:last-child { border-right: none; }
.pane-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--faint); font-weight: 700; margin-bottom: 8px; }
.pane-label.mod { color: var(--mod); }
.body-text { white-space: pre-wrap; line-height: 1.65; font-size: 13.5px; color: var(--text); }
.mod-remark { margin-top: 14px; padding: 10px 12px; background: var(--mod-bg); border-left: 3px solid var(--mod); border-radius: 4px; font-size: 12.5px; color: #f0c9a8; }
.mod-remark b { color: var(--mod); }
.missing { color: var(--faint); font-style: italic; }

.hidden { display: none !important; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #2a2f3c; border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: #353b4a; }

@media (max-width: 800px) {
  .app { grid-template-columns: 1fr; }
  .split { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>QA Dataset Browser</h1>
      <div class="sub"><span id="stat-line"></span></div>
    </div>
    <div class="controls">
      <input id="search" type="search" placeholder="Search questions, answers, remarks..." autocomplete="off">
      <select id="cat-filter"><option value="">All categories</option></select>
    </div>
    <div class="qlist" id="qlist"></div>
  </aside>
  <main class="main" id="main">
    <div class="main-inner">
      <div class="empty" id="empty">Select a question from the list to begin.</div>
      <div id="detail" class="hidden"></div>
    </div>
  </main>
</div>

<script id="data" type="application/json">{"qa": [{"question_id": 1, "sample_id": "1", "necessary_articles": "1, 2, 3", "modified_articles": "M1-1, M2-1, M3-1", "all_articles": null, "question": "Drawing on all three reports, how many drones did Russia launch against Ukraine before the April 11 truce took effect?", "question_category": "Aggregation", "answer": "Article 1: 45 eastern strikes (20+15+10).\n\nArticle 2: 55-drone northern salvo (25+20+10), plus a separate 18-launch line from 15:30 to 16:35. Only 11 of those 18 launches came before the 16:00 truce; 7 came after.\n\nArticle 3: 60 western/central strikes (25+20+15), but the 20-drone follow-up group was double-entered in the northern and western/central tallies and should be counted once.\n\nCalculation: 45 + 55 + 60 = 160; subtract the 20-drone double count to get 140; add the 11 pre-truce launches from the separate group to get 151.\n\nExclude the 138 destroyed/jammed figure because it is a disposition count, not a launch count.", "short_answer": "151", "remarks": "metric-confusion + temporal-boundary-split + conflated-events - The naive regional sum is 160. Article 3 requires removing one 20-drone double entry, Article 2 adds only the 11 pre-truce launches from a separate 18-launch line, and the 138 destroyed/jammed figure is a disposition count, not a launch count.\n\nImprovement note: Repaired in vault only on 2026-06-21 by separate local Claude CLI Opus writer (`claude -p --model opus`) to restore the non-MHFC `Aggregation` category. The 2026-06-29 redesign keeps the 151 answer but removes both the fixed ledger template and the recipe-like counting instructions from the question."}, {"question_id": 2, "sample_id": "11", "necessary_articles": "43, 44, 45", "modified_articles": "M45-1", "all_articles": "True", "question": "Based on the median-line crossing figures reported across the three articles, what trend in PLA aircraft crossing the Taiwan Strait median line is observable across the three exercises?", "question_category": "TrendForecasting", "answer": "Article 44: 22 PLA aircraft crossed the median line during the February 26, 2025 exercise.\n\nArticle 43: 90 PLA aircraft crossed the median line during Justice Mission-2025 in December 2025. Taken alone, these two points suggest an apparent increase.\n\nArticle 45: no median-line crossing count is reported for Strait Thunder-2025A, the April 2025 exercise between the other two. It reports 76 PLAAF aircraft conducting sorties across the Taiwan Strait and 37 sorties entering Taiwan's ADIZ, which are different measures from median-line crossings.\n\nConclusion: because the April crossing count is absent, no complete three-exercise trend can be established. Any trend that treats 76 as a median-line crossing count conflates a PLAAF strait-sortie count with the median-line crossing figures in Articles 43 and 44.", "short_answer": "No reliable trend: only February (22) and Justice Mission (90) report median-line crossings; Strait Thunder lacks a comparable crossing count.", "remarks": "metric-confusion - Article 45's modified phrasing reports 76 PLAAF aircraft conducting sorties across the Taiwan Strait, which tempts a model to treat 76 as the missing April median-line crossing count. Articles 43 and 44 provide real median-line crossing counts, but Article 45 does not, so the three-exercise trend is not determinable."}, {"question_id": 3, "sample_id": "3", "necessary_articles": "9, 10, 11, 12", "modified_articles": "M10-1", "all_articles": true, "question": "Label each Iran-Russia drone clause as `Supported`, `Misattributed`, or `Wrongly merged`.\n\nC1: Iran's official disclosure admitted a limited drone transfer to Russia before the invasion.\n\nC2: The several-dozen-strong Iranian technical team that helped integrate smuggled craft into the Russian military in Moscow was an IRGC unit.\n\nC3: After a Russian delegation visited Tehran, at least 18 advanced drones were delivered, consisting of six Mohajer-6 and twelve Shahed 191/129.\n\nC4: That same Moscow integration team also operated from a Russian military base in Crimea to fix Russian operator errors and mechanical drone problems.\n\nC5: Russia later received hundreds of Iranian one-way attack drones via the Caspian route and the two countries pursued co-production of Iranian UAV designs inside Russia.", "question_category": "Multi-hop FactChecking", "answer": "C1 - Supported: Iran's official disclosure admitted a limited drone transfer to Russia before the invasion.\n\nC2 - Misattributed: the Moscow integration team is not identified as IRGC. The IRGC evidence concerns senior leaders' role in drone exports.\n\nC3 - Supported: at least 18 advanced drones followed the Russian delegation's Tehran visit.\n\nC4 - Wrongly merged: the Crimea-based IRGC trainers were a separate group from the Moscow integration team.\n\nC5 - Supported: later reporting covers Caspian-route one-way drone transfers and Russia-Iran UAV co-production in Russia.", "short_answer": "C1 Supported;\nC2 Misattributed;\nC3 Supported;\nC4 Wrongly merged;\nC5 Supported.", "remarks": "conflated-events - C2 misattributes the non-IRGC-identified Moscow integration team to the IRGC by borrowing the article's separate note that IRGC senior leaders led drone exports, and C4 wrongly merges that Moscow team with the distinct IRGC trainer group operating from a base in Crimea, collapsing two separate personnel groups, locations, and functions into one.\n\nImprovement note: Earlier versions were hardened after Qwen mislabeled C4. The 2026-06-29 draft keeps the same five clauses and labels but removes explicit judge-facing scoring language from the prompt and answer. It has not been re-evaluated."}, {"question_id": 4, "sample_id": "2,3", "necessary_articles": "8, 10, 12", "modified_articles": "M8-1, M10-1", "all_articles": true, "question": "An analyst summary makes the two claims below. Using only the reporting, judge each claim separately as `Supported` or `Unsupported`, and for any unsupported claim name the factual error.\n\nClaim 1: The Iranian technical team based in Russia that integrated the smuggled drones into the Russian military was an IRGC unit.\n\nClaim 2: As the relationship matured, the flow reversed, with that IRGC personnel returning to Iran to transfer their know-how directly on the ground.", "question_category": "Multi-hop FactChecking", "answer": "Both claims are unsupported.\n\nClaim 1: Article 10 describes a several-dozen-person Iranian technical team integrating smuggled craft into the Russian military in Moscow and does not identify that team as IRGC. Article 12 separately identifies the Crimea-based field trainers as IRGC.\n\nClaim 2: Article 8 describes the later return flow as Russian-made Shahed drones and modified Shahed drone technology for navigation/targeting. It does not describe IRGC personnel returning to Iran to transfer know-how on the ground.\n\nThe response must get both claim verdicts right; treating Claim 1 as supported is not a correct answer even if Claim 2 is rejected.", "short_answer": "Claim 1: Unsupported - IRGC misattribution. The Russia/Moscow integration team is not identified as IRGC; only the separate Crimea field trainers are.\n\nClaim 2: Unsupported - the reverse flow was Russian-made Shahed drones and modified drone technology/know-how sent back to Iran, not IRGC personnel returning.", "remarks": "conflated-events - Claim 1 imports the Crimea trainers' IRGC label onto the separate Moscow integration team; Claim 2 turns the documented Russia-to-Iran return flow of drones/technology into personnel movement. Requiring both claim-level verdicts avoids the prior primary-error partial-credit fight.\n\nImprovement note: Earlier versions were hardened because Qwen rejected the summary for the secondary return-flow error while missing the central IRGC misattribution. The 2026-06-29 redesign asks for separate verdicts on both claims to remove the single-error partial-credit issue."}, {"question_id": 5, "sample_id": "4", "necessary_articles": "13, 14, 16", "modified_articles": "M13-1, M14-1, M16-1", "all_articles": "True", "question": "Before the Geneva pause (May 10-12), the United States and China repeatedly answered each other with matching across-the-board reciprocal tariffs on the other side's goods. Judge every rate by the date each side ANNOUNCED (set) it, ignoring any later date a rate took effect. Give every reciprocal rate that satisfies BOTH conditions: (1) both sides set their across-the-board reciprocal tariff on the other's goods to that same level; and (2) on the calendar day after the second side matched that level, it was still each side's most recently announced across-the-board reciprocal rate - that is, neither side had yet announced a different across-the-board reciprocal rate on the other's goods. Ignore sector-specific or one-sided levies, aggregate \"all-in\" totals, and intermediate figures that only one side ever announced. Give the qualifying rate or rates only.", "question_category": "Counting", "answer": "34% and 125%.\n\nDerivation over the overlaid articles, on announcement dates:\n- 34% - QUALIFIES. US set 34% across-the-board on Apr 2 (M13-1); China matched 34% on Apr 4 (M13-1/M16-1). Day after the second side (China) matched = Apr 5. On Apr 5, 34% was still each side's most-recent across-the-board reciprocal rate (US did not announce 84% until Apr 8). Both conditions met.\n- 84% - EXCLUDED. US set 84% on Apr 8 (M13-1); China matched 84% on Apr 9 (M16-1). Day after China matched = Apr 10. By then the US's most-recent across-the-board reciprocal rate was 125% (announced Apr 9, M14-1), not 84%. Condition (2) fails: the two sides never simultaneously held 84% into the next calendar day.\n- 125% - QUALIFIES. US set 125% on Apr 9 (M14-1); China matched 125% on Apr 11 (M16-1). Day after China matched = Apr 12. Both sides still at 125% (held to the Geneva pause). Both conditions met.\n- Rejected decoys: 145% (US aggregate all-in, China never matched), 104% (US-only transitional figure), 20% (US fentanyl-related, one-sided), 15% (China coal/LNG, sector-specific), 10% (China's was crude-oil/autos sector levy; US Feb 10% had no across-the-board Chinese reciprocal match).\n\nSCORING CONTRACT: deterministic exact-set. CORRECT iff the normalized rate set equals {34, 125} exactly (order-independent; strip %/\"per cent\"). Any missing or extra element is INCORRECT, no partial credit. Unacceptable (all INCORRECT): {34}; {125}; {34, 84}; {34, 84, 125}; {84, 125}; {34, 125, 145}; {34, 104, 125}; any set containing 84, 104, 145, 20, 15, or 10.", "short_answer": "34% and 125%", "remarks": "metric-confusion. The surface-matched 84% level is a decoy: Article 16 says China matched 84% on April 9, but Article 14 says the United States raised above that level to 125% on the same date, so 84% fails the next-calendar-day rule. Article 13 is needed for the lower 34% plateau; Article 14 is needed to exclude 84% and establish the U.S. 125% rung; Article 16 is needed for China's 84% and 125% moves. Scoring is exact-set, so an answer that includes 84% or omits 125% is incorrect."}, {"question_id": 6, "sample_id": "4", "necessary_articles": "13, 15, 16", "modified_articles": "M13-1, M15-1, M16-1", "all_articles": "True", "question": "Focusing only on China's controlled-export track - China's own export curbs and licensing controls over strategic inputs - and only on the sequence that the Geneva talks framed as non-tariff countermeasures imposed after the early-April escalation, reconstruct the chronological state-transition ledger of that track through the end of October. For each entry give the date or window, exactly one state label, the supporting evidence, and the narrower goods label where the coverage specifies one. Choose each label from this closed set, but note that not every label is used and you must decide which apply: TIGHTEN, ROLLBACK-COMMITMENT, DISPUTED-NON-EASING, PARTIAL-RELIEF, FULL-RELIEF, RENEWED-TIGHTENING, RELIEF-OFFER, PRE-ESCALATION-CURB. Restrict the ledger strictly to discrete China export-control acts tied to the post-escalation Geneva frame. Do not create a ledger row for tariff-enforcement disputes, fentanyl, agricultural/soybean, or semiconductor-access items; do not create a row for bilateral supply-chain \"issues resolved\" statements that are not a discrete Chinese export-control act; do not infer a goods label from generic export-control wording; and do not anchor the ledger on any pre-escalation metal curbs.", "question_category": "DescriptiveAnalysis", "answer": "The Geneva talks defined the relevant scope as non-tariff countermeasures imposed since April 2, with tariff-enforcement disputes handled separately, so the ledger starts no earlier than the early-April escalation and excludes the February 4 five-metal curbs. The closed label set is deliberately over-complete: FULL-RELIEF and PRE-ESCALATION-CURB match no qualifying ledger event.\n\nThe ordered state-transition ledger is:\n\n1. Apr 4 - TIGHTEN. China imposes export curbs on some strategic inputs. The same announcement carried 34% tariffs, but those belong to the separate tariff-enforcement track, not this ledger.\n\n2. May 10-12, Geneva - ROLLBACK-COMMITMENT. China commits to removing the non-tariff countermeasures imposed since April 2.\n\n3. May 31 - DISPUTED-NON-EASING. Article 16 specifies that the accusation was China failing to ease export curbs and licensing controls, so this is an export-track non-easing claim, not a generic violation.\n\n4. Jun 9-12 - PARTIAL-RELIEF. Some rare-earth or magnet producers receive export licences. This is limited rather than a full rollback, but it is a genuine partial easing on this track. The June 27 supply-chain-resolution statement is not a discrete Chinese export-control act and is not a ledger row.\n\n5. Oct 9 - RENEWED-TIGHTENING. China widens its export controls over strategic industrial inputs / rare earths. The accompanying semiconductor-user scrutiny is a chip-access item and is not a separate export-ledger entry.\n\n6. Oct 30 - RELIEF-OFFER. Beijing offers rare-earth / critical-mineral export relief in exchange for reduced tariffs. The concurrent fentanyl crackdown and soybean terms are separate tracks and are not ledger entries.\n\nThe FULL-RELIEF and PRE-ESCALATION-CURB labels are unused. The February 4 five-metal curbs are excluded because they predate the April 2 Geneva cutoff; tariff, fentanyl, soybean, and semiconductor-access items are excluded because they fall outside the controlled-export track this ledger isolates.\n\nScoring is exact-ledger: an answer must contain all six entries in chronological order with the correct labels and leave the two distractor labels unused. Omitting a required row, inventing an extra row such as June 27 FULL-RELIEF, September tightening, or February PRE-ESCALATION-CURB, mislabeling June as FULL-RELIEF, or listing excluded tariff/fentanyl, soybean/agriculture, semiconductor-access, or February metal-curb items as ledger entries is incorrect, not merely partial.", "short_answer": "Exactly six ordered entries: Apr 4 TIGHTEN; May 10-12 ROLLBACK-COMMITMENT; May 31 DISPUTED-NON-EASING; Jun 9-12 PARTIAL-RELIEF; Oct 9 RENEWED-TIGHTENING; Oct 30 RELIEF-OFFER. FULL-RELIEF and PRE-ESCALATION-CURB are unused. Adding a June 27 FULL-RELIEF row, labeling June as FULL-RELIEF, adding a Feb 4 PRE-ESCALATION-CURB row, or including any tariff/fentanyl/soybean/semiconductor-access entry is incorrect, not partial.", "remarks": "contract-first ledger discipline. Difficulty does not depend on a hidden gotcha; the capability under test is faithful cross-article state reconstruction under an explicit closed-set classification contract. Article 13 carries the Apr 4 and Oct 9 China-side acts and the Geneva non-tariff frame, Article 16 carries the May 31 export-curb/licensing non-easing dispute and June producer-licence detail, and Article 15 carries the rare-earth/critical-mineral relief-offer framing. A complete ledger therefore requires synthesis across Articles 13, 15, and 16 rather than a single Reuters timeline read. The scope contract admits only discrete China export-control acts tied to the post-April-2 Geneva frame and excludes separate tariff-enforcement, fentanyl, soybean/agriculture, semiconductor-access, pre-escalation metal-curb, and generic supply-chain-resolution events. The two unused labels (FULL-RELIEF, PRE-ESCALATION-CURB) are openly declared as possible labels, not hidden traps: deciding that they match no qualifying ledger row is part of the exact completeness/exclusion contract. Scoring is deterministic exact-ledger: six ordered rows with the correct labels, no extra rows, and the non-matching labels left unused."}, {"question_id": 7, "sample_id": "5-9", "necessary_articles": "17, 19, 23, 25, 26, 28, 29, 35", "modified_articles": null, "all_articles": null, "question": "Based on the timeline of Ukrainian drone strikes during the Russia-Ukraine war from 2022 to 2024, which month(s) or period(s) are anomalous because the strike distance significantly stands out?", "question_category": "AnomalyDetection", "answer": "In early 2022, Ukraine's farthest drone missions were limited to within regions neighbouring the Ukraine border, like Bryansk, a distance of roughly 100-150km.\n\nBy late 2022, Ukraine was able to strike  Russian bomber bases situated at Dyagilevo and Engels, both roughly 480km from Ukraine; this is four times the distance compared to Bryansk. At the same time, a Ukrainian arms manufacturer. Ukroboronprom announced the planning and development of a drone that can reach up to 1000km.\n\nOn 30 May 2023, Ukrainian drones struck Moscow for the first time in the war. This distance is about 450-500km from the closest Ukrainian border.\n\nIn August 2023, an airfield in the Russian western Pskov region was struck, 660km north of the Ukrainian border. \n\nIn January 2024, the next farthest distance was to St. Petersburg, being about 900km from the northern border of Ukraine.\n\nSo far, all the data we've seen regarding the strike distance coincides with the 1000km planned distance of the Liutyi drone that was announced back in late 2022. However, there are two anomalous data points in the timeline that we can identify.\n\nIn April 2024, Ukrainian drones struck Russia's third-largest oil refinery, about 1300km from the front lines (Tatarstan strike), and in the next month, May, the farthest distance observed so far is 1500km, when a Ukrainian drone struck a major oil processing plant in the Bashkiria region. (Bashkiria strike)\n\nBoth of these distances exceed the intended 1000km of the Liutyi drone. The Defense Express articles reveal that the Liutyi drones were not used in these attacks and that instead, remodelled light civilian aircraft were used in the Tatarstan and Bahkrina strike. These repurposed drones were tentatively referred to as the \"Ninja\".\n\nThus, April and May in 2024 are anomalous periods due to being beyond the strike range trend that we can see for the timeline, and this indicates that at the time, Ukraine had discreetly added a drone with better far-range capabilities into its arsenal besides the domestic Liutyi drone.", "short_answer": "April and May 2024", "remarks": "2026-06-03 wording clarity: question now explicitly asks for the date/month answer format."}, {"question_id": 8, "sample_id": "5-7,9", "necessary_articles": "17, 19, 20, 23, 24, 25, 27", "modified_articles": null, "all_articles": null, "question": "Across the 2022-2024 timeline of Ukrainian drone strikes on Russian territory described in these articles, the strikes overwhelmingly hit military or industrial/energy targets (oil depots, strategic-bomber bases, oil and gas facilities, military transport airfields, oil refineries). On a small number of dates the target type breaks this pattern by striking the political capital itself. Identify EVERY strike date on which this happens. Report the complete set of such dates - no more and no fewer - because a partial or padded list does not answer the question.", "question_category": "AnomalyDetection", "answer": "Two dates are anomalous because the target is Moscow, the political capital, rather than a military or industrial/energy site:\n- 30 May 2023 (Article 23) - the first large-scale drone attack on Moscow in the war; drones hit residential buildings in the south-west of the city.\n- 24 July 2023 (Article 24) - two drones struck Moscow, one landing close to the Russian Defence Ministry's headquarters, described as a symbolic blow at the heart of the capital.\n\nEvery other dated strike in the set hits a military or industrial/energy target and therefore fits the baseline pattern: 25 April 2022, Bryansk oil depots (Art 17); 5 December 2022, Engels and Dyagilevo strategic-bomber bases (Art 19); 2 June 2023, Smolensk oil and gas facilities (Art 20); 30 August 2023, Pskov military transport airfield (Art 25); 12 March 2024, NORSI refinery and other energy facilities (Art 27). Moscow is the standout because it is the seat of political power, not a front-line military or energy asset.\n\nSCORING CONTRACT (EXACT SET): The response is CORRECT only if it names exactly the set {30 May 2023, 24 July 2023} - both dates present, and no additional date. All-or-nothing set match, not partial credit. Naming only one of the two dates (e.g., only \"24 July 2023\") is INCORRECT (incomplete set). Naming both required dates plus any extra date (e.g., adding 5 Dec 2022, 30 Aug 2023, or an undated \"early May 2023 Kremlin\" incident) is INCORRECT (padded set). Date formatting is flexible: \"24 July 2023\" = \"2023-07-24\" = \"July 24, 2023\". Only the set of dates is graded. Both dates must appear and no others for a CORRECT verdict.", "short_answer": "30 May and 24 July 2023 (exact set; both required, no others)", "remarks": "2026-06-03 wording clarity: question now explicitly asks for the date/month answer format."}, {"question_id": 9, "sample_id": 10, "necessary_articles": "40, 41, 42", "modified_articles": null, "all_articles": true, "question": "One of the articles explicitly stated that neither Pyongyang nor Moscow had officially acknowledged the troop deployment. Describe the exact sequence of events that changed this - which country moved first, through what mechanism, and what bilateral legal framework had formally authorized the deployment?", "question_category": "Multi-hop FactChecking", "answer": "Article 40 establishes that as of early February 2025, neither Pyongyang nor Moscow had officially acknowledged the deployment.\n\nArticle 41 documents the sequence: Russia moved first - General Gerasimov, Russia's chief of staff, publicly hailed the \"heroism\" of North Korean soldiers and reported to Putin that Kursk had been regained. North Korea followed, issuing a statement through KCNA via the Central Military Commission of the Workers' Party officially confirming the deployment.\n\nArticle 42 provides the bilateral legal framework: in June 2024, Kim and Putin signed a comprehensive strategic partnership treaty that included a mutual defense clause - this is the treaty Article 41 references as the basis for the deployment.", "short_answer": "Russia first (Gerasimov); NK second (KCNA/Workers' Party); June 2024 mutual defense treaty", "remarks": "Gerasimov praised NK soldiers + reported Kursk regained to Putin before KCNA Central Military Commission Workers' Party statement; treaty = comprehensive strategic partnership treaty"}, {"question_id": 10, "sample_id": 10, "necessary_articles": "40, 41, 42", "modified_articles": null, "all_articles": true, "question": "Based on the evidence across all three articles, evaluate this claim: \"Intelligence agencies warned on two separate occasions - in early 2025 and mid-2025 - that North Korea was preparing to send additional troops to Russia, but neither deployment had materialized by late 2025.\" Is this characterization accurate?", "question_category": "Multi-hop FactChecking", "answer": "The claim is partially false. Article 40 (February 2025) reports that Seoul's intelligence warned North Korea was \"preparing an additional deployment\" due to heavy casualties. Article 41 (April 2025) confirms this deployment occurred: Ukrainian officials cite approximately 14,000 total North Korean troops deployed \"including 3,000 reinforcements who were sent to replace the North Koreans' early battlefield losses\" - the reinforcements warned of in Article 40 had already arrived by April 2025.\n\nArticle 42 (November 2025) documents a separate, second warning: Ukraine's intelligence indicated in July 2025 that North Korea was preparing to send \"up to thirty thousand additional soldiers,\" and separately notes \"so far, there have been no reports of additional North Korean deployments.\" This second, much larger deployment had not materialized as of late 2025.\n\nThe claim conflates two distinct events: the first warning (Article 40) was fulfilled by April 2025; only the second warning (Article 42's 30,000-soldier projection) remained unexecuted. A model reading Article 42's \"no additional deployments\" in isolation would incorrectly conclude neither warning ever materialized.", "short_answer": "Partially false - first warning (Art.40, Feb 2025) materialized as 3,000 reinforcements (Art.41); second warning (Art.42, 30,000 soldiers) did not", "remarks": "Key trap: Art.42's 'no additional deployments' refers only to the second (30,000) warning; the first warning was already fulfilled by April 2025"}, {"question_id": 11, "sample_id": 10, "necessary_articles": "40, 41, 42", "modified_articles": null, "all_articles": true, "question": "A security brief states: \"All three articles document that the North Korea-Russia military cooperation was formalised through a bilateral treaty signed in 2024, which included a mutual defence clause - this legal framework is consistently referenced across all three sources as the basis for the troop deployment. Furthermore, by the time the most comprehensive article was published, North Korean combat troops had been deployed across multiple distinct regions within Russia, extending their operational reach beyond Kursk.\" Is this characterization accurate?", "question_category": "Multi-hop FactChecking", "answer": "The first component is accurate across all three articles. Article 40 references \"an agreement with a mutual defence element\" signed by Putin during his visit to North Korea. Article 41 states that Kim Jong Un \"had sent troops into combat alongside Russian forces as part of a mutual defence treaty between Moscow and Pyongyang.\" Article 42 provides the most complete characterisation: \"In June 2024, Kim and Russian President Vladimir Putin signed a comprehensive strategic partnership treaty that included a mutual defense clause.\" All three sources reference the same bilateral legal framework as the basis for the deployment, though with varying levels of detail.\n\nThe second component is false: Article 42 explicitly states that \"North Korean forces have only been deployed in the Kursk region in western Russia.\" There is no documentation in any of the three articles of NK troops operating in additional Russian regions beyond Kursk. The brief's claim of deployment \"across multiple distinct regions\" is directly contradicted.\n\nThe characterisation is partially false: the treaty documentation component is accurate across all three articles, but the multi-region deployment claim is contradicted by Article 42's explicit statement of exclusive Kursk deployment.", "short_answer": "Partially false - June 2024 mutual defense treaty referenced in all three; multi-region deployment contradicted by Art.42 (Kursk only)", "remarks": "Art.40: 'agreement with mutual defence element'; Art.41: 'mutual defence treaty'; Art.42: 'June 2024 comprehensive strategic partnership treaty with mutual defense clause'; Art.42: 'only been deployed in the Kursk region'"}, {"question_id": 12, "sample_id": 11, "necessary_articles": "43, 44, 45", "modified_articles": "M45-1", "all_articles": true, "question": "One article states that 90 aircraft crossed the Taiwan Strait median line during Justice Mission-2025. Another states that 76 PLAAF aircraft conducted sorties across the Taiwan Strait during Strait Thunder-2025A. Based on all three articles, which exercise involved more PLA aircraft crossing the median line?", "question_category": "Multi-hop FactChecking", "answer": "The two figures measure different things and cannot be directly compared as counts of the same activity. Article 43 specifies that \"90 crossed the median line\" during Justice Mission-2025 - a count specifically of median-line crossings. Article 44 uses the same metric for the February exercise: \"twenty-two PLA aircraft crossed the median line.\"\n\nArticle 45, by contrast, reports that the PLAAF deployed 76 aircraft during Strait Thunder-2025A, with 37 sorties entering Taiwan's air defence identification zone - ADIZ entry is a different, lower threshold than crossing the median line, and neither figure is stated as a median-line crossing count. Article 45 never states how many aircraft crossed the median line during Strait Thunder-2025A.\n\nThe exercises for which median-line crossing counts are available are the February exercise (22, Article 44) and Justice Mission-2025 (90, Article 43). Strait Thunder-2025A's median-line crossings cannot be determined from the provided articles. A reader who treats 76 (Strait Thunder PLAAF aircraft) as comparable to 90 (Justice Mission median-line crossings) is conflating a PLAAF deployment count with a median-line crossing count.", "short_answer": "Cannot determine: 90 is a median-line crossing count; 76 is PLAAF sorties across the strait, not confirmed median-line crossings for Strait Thunder-2025A.", "remarks": "Art.43: 90 crossed median line; Art.44: 22 crossed median line; Art.45: 135 sorties across strait is a different metric - trap: question stem cites both figures inviting direct comparison"}, {"question_id": 13, "sample_id": 11, "necessary_articles": "43, 44, 45", "modified_articles": null, "all_articles": true, "question": "A policy memo states: \"Across all three exercises described in the articles, Beijing's formal justifications explicitly referenced Taiwan's pursuit of independence or separatism as a core concern. Additionally, the U.S. government publicly maintained a firm stance against China's exercises in each case - with U.S. officials on record condemning each of the three operations as destabilising.\" Is this characterization accurate?", "question_category": "Multi-hop FactChecking", "answer": "The first component is accurate across all three articles. Article 44 records China's Defence Ministry calling the February drill a \"solemn warning to separatist forces.\" Article 45 records PRC outlets condemning \"Lai Ching-te authorities' attempts to solicit US support for Taiwan independence.\" Article 43 states China launched drills to send a \"serious warning against any push for Taiwanese independence and 'external' forces interfering.\" Independence or separatism language appears in each article's description of Beijing's stated rationale - verifying this requires reading all three.\n\nThe second component is false: Article 43 records that U.S. President Trump, when asked about Justice Mission-2025, said \"I have a great relationship with President Xi [Jinping]\" and dismissed concerns by saying \"They've been doing naval exercises for 20 years in that area\" - the opposite of a condemnation. Articles 44 and 45 record no U.S. government response at all.\n\nThe characterization is partially false: the independence/separatism citation component is accurate across all three articles, but the U.S. condemnation component is directly contradicted by Article 43 and unsupported in Articles 44 and 45.", "short_answer": "Partially false - independence/separatism in all three; US condemned none (Trump dismissed in Art.43; Arts.44/45 silent)", "remarks": "Art.43: 'against any push for Taiwanese independence'; Art.44: 'solemn warning to separatist forces'; Art.45: 'solicit US support for Taiwan independence'; Trump: 'great relationship with Xi... doing naval exercises for 20 years'"}, {"question_id": 14, "sample_id": 11, "necessary_articles": "43, 44, 45", "modified_articles": null, "all_articles": true, "question": "A briefing note claims: \"Of the three exercises described in the articles, the February 2025 drill was the only operation that involved no reported simulated strikes on infrastructure or confirmed live-fire activity - distinguishing it from both the April and December exercises. Moreover, Justice Mission-2025 was characterised in Chinese state framing as Beijing's first major military exercise near Taiwan since the start of the Fourth Taiwan Strait Crisis in August 2022.\" Is this characterisation accurate?", "question_category": "Multi-hop FactChecking", "answer": "The first component is accurate but requires reading all three articles to confirm. Article 44 states that although Beijing claimed the February exercise would involve \"shooting training,\" Taiwan \"ultimately did not detect any such activity\" - no live-fire occurred. Article 45 describes Strait Thunder-2025A as practising \"simulated strikes against Taiwan's energy infrastructure and port facilities\" - confirming active simulated strike objectives. Article 43 states the December exercise \"included live-fire activities as well as rocket launches\" and that rockets \"fired on Tuesday landed in waters near Taiwan, according to Taiwan's Defence Ministry\" - confirming actual live fire. Only the February exercise had neither confirmed live-fire nor described simulated strikes.\n\nThe second component is false: Article 43 explicitly states that the December exercises were \"the eighth major military drill held around Taiwan since the beginning of the Fourth Taiwan Strait Crisis in August 2022.\" Justice Mission-2025 was the eighth such drill, not the first.\n\nThe characterisation is partially false: the February-only finding is supported across all three articles, but the \"first major exercise since 2022\" assertion is directly contradicted by Article 43.", "short_answer": "Partially false - February only without strikes/live-fire (true); Justice Mission-2025 was eighth drill, not first", "remarks": "Art.44: Taiwan detected no live-fire; Art.45: simulated strikes on energy/port infrastructure; Art.43: live-fire rockets confirmed near Taiwan; Art.43 explicit: 'eighth major military drill since Fourth Taiwan Strait Crisis August 2022'"}, {"question_id": 15, "sample_id": 11, "necessary_articles": "43, 44, 45", "modified_articles": "M45-1", "all_articles": true, "question": "Based on all three articles, what is the total number of PLA aircraft recorded as crossing the Taiwan Strait median line across all three exercises described?", "question_category": "Aggregation", "answer": "Article 43 states that 90 PLA aircraft crossed the Taiwan Strait median line during Justice Mission-2025. Article 44 states that 22 PLA aircraft crossed the median line during the February 26, 2025 exercise. These two figures both specifically describe aircraft crossing the median line and sum to 112.\n\nArticle 45 provides two aircraft figures, neither of which is a median-line crossing count. The 76 figure describes PLAAF aircraft deployed during the exercise - a service-branch sortie count, not a tally of aircraft specifically confirmed to have crossed the median line. The 37 figure describes sorties entering Taiwan's air defence identification zone - ADIZ entry is a different, lower threshold from crossing the median line. Including 76 in the sum (producing 188) conflates PLAAF sortie counts with median-line crossings; including 37 (producing 149) conflates ADIZ entry with median-line crossings.\n\nThe correct total for confirmed median-line crossings is 112.", "short_answer": "112 - only 22 (February) and 90 (Justice Mission) are median-line crossings; Art.45's 76 PLAAF sorties and 37 ADIZ entries are different metrics.", "remarks": "Wrong sums: 247 (90+22+135) conflates sorties with median-line crossings; 185 (90+22+73) conflates ADIZ entry with median-line crossings"}, {"question_id": 16, "sample_id": 11, "necessary_articles": "43, 44, 45", "modified_articles": "M45-1", "all_articles": true, "question": "Based on the median-line crossing figures reported across the three articles, what trend in PLA aircraft crossing the Taiwan Strait median line is observable across the three exercises?", "question_category": "TrendForecasting", "answer": "Article 44 reports 22 PLA aircraft crossed the median line during the February 26, 2025 exercise. Article 43 reports 90 PLA aircraft crossed the median line during Justice Mission-2025 in December 2025. These two data points, read in chronological order (February then December), suggest an apparent increase.\n\nHowever, Article 45 does not report how many aircraft crossed the median line during Strait Thunder-2025A (April 2025, between the other two exercises) - it reports 76 PLAAF aircraft deployed in the exercise, with 37 sorties entering Taiwan's ADIZ, both of which are different measures from median-line crossings. With Strait Thunder-2025A's median-line crossing count absent, no complete three-exercise trend can be established.\n\nAny trend description that treats the 76 PLAAF figure as a median-line crossing count (to produce an apparent pattern of 22 → 76 → 90) conflates a PLAAF deployment count with the median-line crossing figures reported in Articles 43 and 44.", "short_answer": "No reliable trend: only February (22) and Justice Mission (90) report median-line crossings; Strait Thunder lacks a comparable crossing count.", "remarks": "Feb 2025: 22 crossings (Art.44); Justice Mission Dec 2025: 90 crossings (Art.43); Strait Thunder Apr 2025: no crossing count - 135 is sorties across strait, a different metric"}, {"question_id": 17, "sample_id": 12, "necessary_articles": "46, 47, 50", "modified_articles": "M46-1, M47-1", "all_articles": true, "question": "True or False: Houthi attacks reduced Egypt's Suez Canal revenue by more than half in 2024, and the Eternity C was the first commercial vessel lost in the campaign.", "question_category": "Multi-hop FactChecking", "answer": "Part 1 - Article 46 states Egypt earned approximately $10bn from the Suez Canal in 2023. Article 47 states IMF found Houthi attacks reduced Suez inflows by $6bn in 2024. $6bn ÷ $10bn = 60% > 50%. Part 1 TRUE. Part 2 - Article 50 explicitly states \"Rubymar's sinking marks the first vessel lost since Yemen's Houthis began targeting commercial shipping.\" The Eternity C (July 2025) came later. Part 2 FALSE. Overall: Partially false.", "short_answer": "Partially false", "remarks": null}, {"question_id": 18, "sample_id": 12, "necessary_articles": "47, 48, 49", "modified_articles": "M47-1, M48-1", "all_articles": true, "question": "True or False: The Houthi campaign's total mariner death toll exceeded the number of crew detained after the Eternity C sinking, and the ceasefire that eventually ended all Houthi maritime attacks was brokered by Oman.", "question_category": "Multi-hop FactChecking", "answer": "Part 1 - Article 47 records nine mariners killed in the campaign. Article 48 states six crew members were held by Houthis after the Eternity C. 9 > 6. Part 1 TRUE. Part 2 - Article 47 states Houthis pulled back from all attacks after the Gaza ceasefire of October 10, 2025. Article 49 shows Oman brokered only the May 2025 US-Houthi deal, which covered US shipping only - a different, earlier ceasefire. The final pullback was triggered by the Gaza ceasefire, not the Oman deal. Part 2 FALSE. Overall: Partially false.", "short_answer": "Partially false", "remarks": null}, {"question_id": 19, "sample_id": 12, "necessary_articles": "46, 47, 49", "modified_articles": "M46-1, M47-1", "all_articles": true, "question": "Per the articles, of Egypt's $6bn IMF-reported Suez Canal foreign exchange inflow shortfall in 2024, the calendar year before the May 2025 US-Houthi ceasefire, what proportion is attributed to factors directly caused by Houthi attacks (i.e., Cape of Good Hope rerouting), as opposed to Egyptian domestic policy decisions?\n\n(A) Approximately one-quarter (~$1.5bn).\n(B) Approximately half (~$3bn).\n(C) Approximately three-quarters (~$4.5bn).\n(D) The full $6bn - the IMF attributed the entire shortfall to Houthi attacks with no domestic-policy component.", "question_category": "CausalAnalysis", "answer": "Article 49 establishes the US-Houthi ceasefire was brokered by Oman in May 2025, so 2024 is the calendar year immediately before it. Article 47 reports the IMF headline figure that Houthi attacks \"reduced foreign exchange inflows from the Suez Canal by $6bn in 2024\", with Fund economists attributing the entire shortfall to Houthi-driven maritime disruptions. However, Article 46 - in its October 2024 reporting on the campaign's economic impact - notes that Egypt's canal authority officials were weighing a revision of late-payment surcharges, with trade analysts estimating this domestic policy adjustment could reduce canal fee revenue by roughly one-quarter of any eventual inflow shortfall during the campaign period. Applying this estimate to the IMF's $6bn figure: ~one-quarter (~$1.5bn) reflects Egyptian domestic policy, ~three-quarters (~$4.5bn) reflects Houthi-driven rerouting losses. Option C is correct; D anchors on the IMF's \"entire shortfall = Houthi disruptions\" framing without engaging the A46 Egyptian officials' qualifier; A and B mis-proportion the breakdown.", "short_answer": "C", "remarks": "2026-06-03 wording clarity: made 2024/May 2025 temporal anchor explicit."}, {"question_id": 20, "sample_id": 12, "necessary_articles": "47, 48, 50", "modified_articles": "M47-1, M48-1", "all_articles": true, "question": "Of all the ships sunk in the Houthi campaign, how many are referred to by name across the articles?", "question_category": "Counting", "answer": "Article 47 states four ships were sunk in the campaign but names none, and later notes that Lloyd's-linked casualty monitors listed the Ariana Star as damaged pending verification rather than as one of the four confirmed sinkings. Article 48 names the Eternity C (sunk), the Magic Seas (crew abandoned ship; vessel \"reported as lost by UKMTO\" - confirmed), and the Ariana Star, which sustained severe damage, flooding, and radio silence, with analysts saying it \"appeared to have foundered.\" Article 50 names the Rubymar (first vessel lost). Named ships confirmed sunk: Rubymar, Eternity C, Magic Seas = 3. The Ariana Star is named and strongly implied sunk in Article 48, but Article 47's casualty-ledger qualifier excludes it from the confirmed sinking count.", "short_answer": "3", "remarks": "Ariana Star named but excluded by A47 casualty-ledger qualifier; Magic Seas confirmed lost by UKMTO. Correct named confirmed sunk ships: Rubymar, Eternity C, Magic Seas = 3."}, {"question_id": 21, "sample_id": 12, "necessary_articles": "47, 48, 49", "modified_articles": "M47-1, M48-1, M49-1", "all_articles": true, "question": "Per the articles, which of the following BEST characterizes the cause of the Houthi maritime attack halt indicated in November 2025?\n\n(A) A direct and immediate response to the US-brokered Gaza ceasefire of October 10, 2025, with no prior preparation.\n(B) A decision enabled by Iranian-backed diplomatic engagement via Omani intermediaries begun well before the May 2025 US-Houthi ceasefire, with the Gaza conflict's trajectory serving as the eventual trigger.\n(C) A bilateral signed ceasefire agreement between the Houthis and US forces concluded in November 2025.\n(D) A Houthi internal political reshuffling unrelated to either Gaza or Iranian-mediated diplomacy.", "question_category": "DescriptiveAnalysis", "answer": "Article 47 includes a Houthi military spokesperson quote (Nov 9) attributing the halt \"directly and immediately\" to the Gaza ceasefire and dismissing prior diplomatic preparation as \"a fabrication by external parties.\" Article 47 contains no Omani or Iranian diplomatic references. However, Article 49 (May 2025) - the ceasefire announcement article - reports Omani FM Albusaidi describing the May deal as \"a foundation, not a finale\" and confirming Oman had been working through Iranian interlocutors for months, with channels \"established well before the US bombing campaign began\" (i.e., before March 2025, and therefore well before May 2025), aimed at \"a more durable framework\" with \"the Gaza conflict's trajectory\" as the determining factor. Option A matches the Houthi spokesperson's self-attribution in Article 47 and is the surface-level reading of that article alone. Option C is ruled out by Articles 48 and 49 (the May deal covered US warships only; no November bilateral agreement exists). Option D is contradicted by the Iranian-Omani engagement described in Article 49. Option B is correct: a reader must cross-reference Article 49's forward-looking Omani FM statement with Article 47's November halt framing to establish that the Omani-Iranian diplomatic track predated the May ceasefire and enabled the halt - evidence Article 47 itself does not contain.", "short_answer": "B", "remarks": "A47 zero Omani content; all B evidence in A49 only (cross-article synthesis required)"}], "samples": [{"sample_id": 1, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare", "article_id": 1, "article_title": null, "publication_date": null, "source": null, "url": "https://www.straitstimes.com/world/europe/russia-and-ukraine-trade-drone-strikes-ahead-of-easter-truce", "full_text": "KYIV – A temporary truce between Russia and Ukraine entered into force on April 11, with Kyiv warning it would respond “immediately” if Russia violated it.\n\nRussian President Vladimir Putin ordered the ceasefire on April 9 to coincide with Orthodox Easter, more than a week after Ukrainian President Volodymyr Zelensky first made the proposal.\n\nBoth sides have agreed to observe it.\n\nThe ceasefire is due to last for 32 hours, from 4pm on April 11 until the end of the day on April 12, according to the Kremlin.\n\n“Ukraine will adhere to the ceasefire and respond strictly in kind. The absence of Russian strikes in the air, on land, and at sea will mean no response from our side,” Mr Zelensky said in a post on X.\n\nThe Ukrainian army said it was ready to “immediately” respond if Russia violated it.\n\nHours before the truce was due to start, Russia launched at least 160 drones at Ukraine, killing four people in the country’s east and south and wounding dozens of others, the Ukrainian authorities said.\n\nA wave of Ukrainian drones sparked a fire at an oil depot and damaged apartment buildings in Russia’s southern Krasnodar region, the authorities said.\n\nFour people died in a Ukrainian drone strike on the Russian-occupied part of Ukraine’s eastern Donetsk and Kherson regions, the Russian-installed authorities said.\n\nUkrainians have expressed scepticism about whether the truce will hold.\n\nThe two sides held a ceasefire for Orthodox Easter in 2025, but both accused the other of hundreds of violations.\n\nDespite tensions over the truce, the warring sides exchanged 175 prisoners of war each on April 11, according to officials.\n\nThe United Arab Emirates helped mediate the exchange, the Russian Defence Ministry said.\n\nPrisoner-of-war exchanges are one of the few areas of cooperation between the warring sides.\n\nStalled diplomacy\nUS-led talks aimed at ending the four-year-old conflict have stalled in recent weeks because of the war in the Middle East.\n\nEven before the Iran war, progress towards a peace deal in Ukraine had been slow due to differences over territory.\n\nUkraine has proposed freezing the conflict along the current front lines.\n\nBut Russia has rejected this, saying it wants Ukraine to give up all the territory in the Donetsk region that it currently controls – a demand Kyiv says is unacceptable.\n\nSeveral rounds of US-led talks have failed to bring the warring sides closer to an agreement.\n\nKremlin spokesman Dmitry Peskov denied Russia had discussed the ceasefire with Ukraine or the US in advance and said it was not linked to negotiations to end the war.\n\nThe war has cost hundreds of thousands of lives and forced millions to flee their homes, making it Europe’s deadliest conflict since World War II.\n\nAfter four years, fighting on the front has come to a near standstill.\n\nRussia has made small territorial gains at a high cost.\n\nBut Kyiv recently managed to push back in the south-east, and Russian advances have been slowing since late 2025, according to the US-based Institute for the Study of War (ISW).\n\nApart from Ukrainian counter-attacks, analysts attributed the slowdown to Russia being banned from using SpaceX’s Starlink satellites and Moscow’s own efforts to block the Telegram messaging app.\n\nBut the situation is unfavourable for Ukraine in the Donetsk region, towards the cities of Kramatorsk and Sloviansk, according to the ISW.\n\nMoscow occupies just over 19 per cent of Ukraine, most of which was seized during the first weeks of the conflict. AFP", "keywords": "A temporary truce between Russia and Ukraine entered into force on April 11,\nThe ceasefire is due to last for 32 hours, from 4pm on April 11 until the end of the day on April 12,\nRussia launched at least 160 drones at Ukraine,", "remarks": null}, {"sample_id": 1, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare", "article_id": 2, "article_title": "Russia attacks Ukraine with drones, hits and debris recorded at over 20 locations", "publication_date": "2026-04-11T00:00:00", "source": null, "url": "https://www.yahoo.com/news/articles/russia-attacks-ukraine-160-drones-052500311.html", "full_text": "Russian forces attacked Ukraine with 160 drones on the night of 10-11 April. About 100 of the UAVs have been Shahed loitering munitions.\n\nSource: Ukraine's Air Force\n\nDetails: Ukrainian air defence forces destroyed or jammed 133 drones.\n\nHits by 20 UAVs were recorded at 10 locations and the fall of downed aerial assets (debris) at 11 locations.\n\nAs of the morning, the attack is ongoing, as several Russian drones are still in Ukrainian airspace.\n\nBackground: Russian forces conducted a drone attack on the city of Odesa, hitting a house.", "keywords": "northern pre-ceasefire wave 55; 138 destroyed/jammed decoy; 18 tracks after 4pm ceasefire window; possible truce-violation monitoring", "remarks": null}, {"sample_id": 1, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare", "article_id": 3, "article_title": null, "publication_date": null, "source": null, "url": "https://www.nbcnews.com/world/ukraine/russian-strikes-odesa-kill-2-ahead-orthodox-easter-ceasefire-prisoner-rcna289197", "full_text": "KYIV, Ukraine - Russian drone strikes killed at least two people in the Ukrainian city of Odesa overnight into Saturday, local authorities reported, ahead of a proposed ceasefire for Orthodox Easter.\n\nAt the exchange site in northern Ukraine, Svitlana Pohosyan waited for her son's return. Asked about the ceasefire, she said: \"I want to believe it. God willing, may it be so. We will believe and hope that everything will be fine, that a ceasefire will come on such a holy day, and that there will be peace - peace in Ukraine and peace in the whole world.\"\n\n\"My celebration will come when my son returns,\" she added. \"I will hold him in my arms - and that will be the greatest celebration for me. And for every mother, every family.\"\n\nPeriodic prisoner exchanges have been one of the few positive outcomes of otherwise fruitless monthslong U.S.-brokered negotiations between Moscow and Kyiv. The talks have delivered no progress on key issues preventing an end to Russia's invasion of its neighbor, now in its fifth year.A further two people were wounded in the attack on the Black Sea port city, when drones hit a residential area, damaging apartment buildings, houses and a kindergarten.\n\nAccording to the Ukrainian Air Force, Russia targeted Ukraine with 160 drones overnight, of which 133 were shot down or intercepted, hours before a proposed Easter ceasefire was due to come into force.\n\nRussia's Defense Ministry said 99 Ukrainian drones were shot down overnight across Russia and occupied Crimea.\n\nRussian President Vladimir Putin on Thursday declared a 32-hour ceasefire over the Orthodox Easter weekend, ordering Russian forces to halt hostilities from 4 p.m. Saturday until the end of Sunday.\n\nUkrainian President Volodymyr Zelenskyy promised Saturday to abide by the ceasefire, describing it as an opportunity to build on peace initiatives. But he warned there would be a swift military response to any violations.\n\n\"Easter should be a time of silence and safety. A ceasefire (at) Easter could also become the beginning of real movement toward peace,\" Zelenskyy wrote in an online post on Saturday.\n\nBut he added: \"We all understand who we are dealing with. Ukraine will adhere to the ceasefire and respond strictly in kind.\"\n\nUkraine earlier proposed to Russia a pause in attacks on each other's energy infrastructure over the Orthodox Easter holiday.\n\nPrevious ceasefire attempts have had little impact, with both sides accusing each other of violations.\n\nKremlin spokesman Dmitry Peskov on Friday described Putin's move as a \"humanitarian\" gesture, but said Moscow remains focused on a comprehensive settlement based on its longstanding demands - a key sticking point that has prevented the two sides from reaching an agreement.\n\nPrisoners exchanged\nRussia's Defense Ministry said that a prisoner swap Saturday brought home 175 of its soldiers.\n\nZelenskyy confirmed Saturday's exchange, saying that 175 service members and seven civilians were returned.\n\n\"Most had been held in captivity since 2022. And finally, they are home,\" he wrote on X.\n\nSeparately, seven residents of Russia's Kursk region returned from Ukraine Saturday after they were captured by the Ukrainian army, Russian state media reported. They were greeted at the Belarusian-Ukrainian border by Russia's human rights ombudswoman, Tatyana Moskalkova.\n\nAccording to Moskalkova, the returnees were the last of those who were taken to Ukraine from the Kursk region after the Ukrainian army took control of parts of the region in 2024.\n\nUkrainian forces made a surprise incursion into Kursk in August 2024 in one of their biggest battlefield successes in the war. The incursion was the first time Russian territory was occupied by an invader since World War II and dealt a humiliating blow to the Kremlin.", "keywords": "western/central wave split across body; 25 opening drones; 20 follow-up drones; 15 trailing drones reconciled later; total western/central wave 60", "remarks": null}, {"sample_id": 2, "topic": "US-Iran War", "sub_topic": "Drone Warfare, Proxy Warfare", "article_id": 4, "article_title": null, "publication_date": null, "source": null, "url": "https://apnews.com/article/russia-iran-drones-shahed-war-israel-ukraine-840b4f885d99714bdb7813c0d56213cf", "full_text": "LONDON (AP) - Russia is sending a shipment of drones to Iran including upgraded versions of the drone technology that Tehran originally supplied to Moscow after its invasion of Ukraine, U.S. and European officials told The Associated Press this week.\n\nIran has been firing drone barrages at Israel, its Gulf neighbors and U.S. bases across the Middle East for more than a month following the U.S. and Israeli attack on the country. While Iran has its own stocks of Shahed drones, Russia has made improvements to the design during the war in Ukraine, including adding better navigation capabilities.\n\nRussian and Iranian officials have had “very active” discussions this month regarding transferring drones from Russia to Iran, the European intelligence official told AP. A U.S. defense official said it is unclear if the shipment is a one-time delivery or part of a series. Neither official could say how significant the delivery is or how many drones were sent. Another European official said a small number of drones would not have a major impact on the outcome of the war. All the officials spoke on condition of anonymity to discuss sensitive matters.", "keywords": "upgraded versions of the drone technology that Tehran originally supplied to Moscow after its invasion of Ukraine,\nRussian and Iranian officials have had “very active” discussions this month regarding transferring drones from Russia to Iran,", "remarks": null}, {"sample_id": 2, "topic": "US-Iran War", "sub_topic": "Drone Warfare, Proxy Warfare", "article_id": 5, "article_title": "Russia Is Sharing Intelligence With Iran, U.S. Officials Say", "publication_date": "2026-03-06T00:00:00", "source": "The New York Times", "url": "https://www.nytimes.com/2026/03/06/us/politics/russia-iran-partnership.html", "full_text": "Russia Is Sharing Intelligence With Iran, U.S. Officials Say\n\nThe information has included satellite imagery showing the locations of military personnel. But some officials played down the significance of the partnership.\n\nRussia has provided intelligence to Iran during the U.S.-Israeli war, including satellite imagery showing the locations of warships and military personnel,according to U.S. officials.\n\nThe information sharing could complicate relations between the United States and Russia, given that President Trump has often taken a more conciliatory stance toward Moscow than his predecessors.\n\nBut some of the officials played down the partnership, saying Russia has long provided similar intelligence to Iran. And it is not clear how much Tehran has been able to use the new intelligence, if at all. Iran has advanced missiles, but they lag far behind Russia’s and it is not clear Iran could use the intelligence to target a ship.\n\nFurthermore, given the immense pressure of the combined U.S.-Israeli assault, which began last Saturday, Iran’s ability to launch missiles has been degraded, officials said.\n\nBut officials confirmed that Russia has provided updated intelligence on the position of U.S. assets since the beginning of the war, information meant to help Iran target the assets.\nSo far Iranian forces have not hit any U.S. warships, but they have struck at U.S. military bases, killing six service members in Kuwait and damaging facilities in Bahrain. Iranian drones have also struck a building housing the C.I.A. station in Riyadh, Saudi Arabia, though no one was injured in that attack, officials said.\n\nThe Russian intelligence sharing was reported earlier by The Washington Post.\n\nPresident Vladimir V. Putin of Russia called President Masoud Pezeshkian of Iran on Friday to discuss the U.S.-Israeli campaign. In a statement, the Kremlin said that the two leaders agreed to continue contacts and that Mr. Putin expressed condolences for the death of Ayatollah Ali Khamenei, the supreme leader.\n\nMr. Putin also called for hostilities to stop and urged “a swift return to the path” of a diplomatic resolution.\nThe statement made no direct mention of the intelligence sharing, but said that communication through “various channels” would continue.\n\nIn its initial barrage, Iran launched thousands of attack drones and hundreds of missiles at U.S. bases throughout the Middle East. But the Iranian response has begun to lessen, according to the Pentagon, as U.S. bombers place more pressure on Iranian launchers and command and control centers.\n\nAs part of a defense partnership, Iran has been a crucial supplier of attack drones to Russia for its war in Ukraine. In return, Russia has supplied technology and intelligence to Iran, according to U.S. officials. Throughout the Biden administration, the White House regularly declassified information about Iranian drone shipments to Russia, as it tried, unsuccessfully, to pressure Tehran to stop supporting its partner.\n\nThe U.S. military’s Central Command and the C.I.A. both declined to comment on the classified intelligence sharing. In a statement, Anna Kelly, a White House spokeswoman, noted that the pace of Iranian retaliation had slowed.\n\n“The Iranian regime is being absolutely crushed,” she said. “Their ballistic missile retaliation is decreasing every day, their navy is being wiped out, their production capacity is being demolished and proxies are hardly putting up a fight.”\n\nJulian E. Barnes covers the U.S. intelligence agencies and international security matters for The Times. He has written about security issues for more than two decades.\n\nEric Schmitt is a national security correspondent for The Times. He has reported on U.S. military affairs and counterterrorism for more than three decades.", "keywords": "Russia provided updated intelligence on U.S. assets; latest material updates a preexisting intelligence relationship; unclear how much Iran could use the intelligence", "remarks": null}, {"sample_id": 2, "topic": "US-Iran War", "sub_topic": "Drone Warfare, Proxy Warfare", "article_id": 6, "article_title": "U.S. Intelligence Shows China Taking a More Active Role in Iran War", "publication_date": "2026-04-11T00:00:00", "source": "The New York Times", "url": "https://www.nytimes.com/2026/04/11/us/politics/china-iran-war-missiles-supplies.html", "full_text": "U.S. Intelligence Shows China Taking a More Active Role in Iran War\n\nChina may have shipped missiles to Iran, and Beijing is allowing some companies to sell Tehran supplies that can be used in military production,American officials said.\n\nAmerican intelligence agencies have obtained information that China in recent weeks may have sent a shipment of shoulder-fired missiles to Iran for its conflict with the United States and Israel, according to U.S. officials.\n\nThe officials said that the intelligence is not definitive that the shipment has been sent, and that there is no evidence that the Chinese missiles have yet been used against American or Israeli forces during the conflict.\n\nBut even a debate in Beijing over sending missiles to Iran suggests the degree that China sees itself as having a stake in the conflict. Intelligence agencies have assessed that China is secretly taking an active stance in the war, allowing some companies to ship chemicals, fuel and components that can be used in military production to Iran for the war.\n\nShoulder fired missiles, known as MANPADS,are capable of shooting down low-flying aircraft.\n\nChina has long been reluctant to send finished military equipment to Iran, but some officials in the government want Beijing to allow its companies to directly supply the Iranian security forces during the conflict with the United States.\n\nIf the Chinese government did allow the shipment of missiles, it would be a significant escalation and an indication that at least some of China’s leaders are working actively to bring about an American military defeat in a war that has engulfed the Middle East.\n\nThe intelligence about possible Chinese support to Iran comes as American intelligence agencies have seen evidence that Russia has provided the Iranian military with specific satellite intelligence to help Iran’s Islamic Revolutionary Guard Corps target American ships, along with military and diplomatic installations throughout the Middle East.\n\nTaken together, the military support to Iran shows how America’s powerful adversaries have seen an opportunity to raise the costs for the United States for launching the war and to potentially bog down the American military in the conflict.\n\nChinese support to Iran comes at a delicate moment in US-China relations. President Trump is planning next month to travel to China to meet with Chinese President Xi Jinping, a summit that is expected to focus on a range of trade, technology and military issues. The summit was originally scheduled for March, but was delayed because of the Iran war.\n\nAmerican intelligence agencies have been carefully tracking what support Russia and China have provided to Iran during the war. American officials have seen Russia as more eager to help, sending food aid, nonlethal military supplies and satellite imagery to Tehran. But Moscow appears to have ruled out providing any offensive or defensive military equipment, for fear of provoking the United States.\n\nChinese officials overall have been eager to protect, at least publicly, their image as a neutral party. Former officials say that Iran is reliant on China for parts that go into its missiles and drones, but Beijing is able to argue that those components, however crucial, can be used to manufacture more than just weaponry. China also provided some intelligence and supplied dual-use parts to Iran, much as they provided to Russia during its war with Ukraine.\n\nA CNN report on Saturday said that China was preparing to send a shipment of shoulder-fired missiles to Iran in the coming weeks.\n\nA spokesman for China’s embassy to the United States strongly denied his government had shipped missiles to Iran during the war.\n\n“China has never provided weapons to any party in the conflict; the information in question is untrue,” said Liu Pengyu, the spokesman. “As a responsible major country, China consistently fulfills its international obligations. We urge the U.S. side to refrain from making baseless allegations, maliciously drawing connections, and engaging in sensationalism; we hope that relevant parties will do more to help de-escalate tensions.”\n\nChina is heavily dependent on oil that passes through the Strait of Hormuz, and is anxious not to do anything that extends the war, according to American officials. At the same time, at least some Chinese officials are interested in supporting Tehran in a war that is seen as weakening American standing and strength.\n\nChina is Iran’s largest trading partner, and the largest purchaser of Iranian oil. According to a report by the U.S.-China Economic and Security Review Commission, a group founded by Congress to examine America’s bilateral ties to China, “Chinese purchases account for roughly 90 percent of Iran’s exported oil, providing tens of billions of dollars in annual revenue that supports Iran’s government budget and military activities.”\n\nStill, China experts have noted that China’s public rhetoric during the Iran war has been mostly neutral, possibly because of the deep economic ties that China has with Arab nations in the Persian Gulf which have been under attack by Iran during the conflict.\n\n“If anything, they are siding rhetorically more so with their Gulf partners than with Iran,” said Henrietta Levin of the Center for Strategic and International Studies in Washington. “The economic, the technological relationship, the energy relationship with the Gulf is in many ways more strategically significant for China than anything it has with Iran.”", "keywords": "China possible MANPADS transfer remains unsettled; Russia satellite intelligence used for targeting; Russian hardware channel narrower than intelligence support", "remarks": null}, {"sample_id": 2, "topic": "US-Iran War", "sub_topic": "Drone Warfare, Proxy Warfare", "article_id": 7, "article_title": null, "publication_date": null, "source": null, "url": "https://www.theguardian.com/world/2026/mar/27/european-intelligence-agencies-russia-supplying-drones-iran", "full_text": "European intelligence agencies believe Russia is supplying drones to Iran, says official\n\nIntelligence reports find Russia is close to completing phased shipment of drones, medicine and food\n\nIntelligence agencies in Europe believe Russia is in the final stages of preparing to supply drones to Iran for use in its war with the US and Israel, according to a senior European official.\n\nRussia has already been providing intelligence sharing with Tehran to help it target US forces in the region, the official said, but the upcoming delivery of explosive-laden drones would mark the first evidence of lethal support since the start of the war.\n\nThe official, who spoke on condition of anonymity, declined to provide details on the scale of any deliveries, but confirmed an article by the Financial Times that said “western intelligence reports” found Russia was close to completing a phased shipment of drones, medicine and food to Iran.\n\nIranian and Russian officials began secretly discussing drone deliveries days after Israel and the US attacked Tehran in late February, the news website said, citing officials briefed on the intelligence. It said drone deliveries could be completed by the middle of next week.\n\nResponding to the claim of Moscow sending drones to Iran, the Kremlin spokesperson, Dmitry Peskov, was quoted as saying: “There are a lot of fakes going around right now. One thing is true – we are continuing our dialogue with the Iranian leadership.”\n\nRussia and Iran signed a strategic partnership agreement last year and Moscow has sent more than 13 tonnes of medicine to Iran through Azerbaijan.\n\nMoscow’s growing involvement could expand and escalate an open-ended war launched by the US and Israel, which has been criticised – including at times by Washington’s allies – as illegal, having ill-defined objectives and resulting in geopolitical and economic chaos.", "keywords": "Russia is supplying drones to Iran, says official\nRussia is in the final stages of preparing to supply drones to Iran\nfor use in its war with the US and Israel,\nRussia has already been providing intelligence sharing with Tehran to help it target US forces", "remarks": null}, {"sample_id": 2, "topic": "US-Iran War", "sub_topic": "Drone Warfare, Proxy Warfare", "article_id": 8, "article_title": null, "publication_date": null, "source": null, "url": "https://www.atlanticcouncil.org/dispatches/from-drones-to-rocket-fuel-china-and-russia-are-helping-iran-through-supply-chains/", "full_text": "WASHINGTON-As the US-Israeli war with Iran continues, some commentators have speculated about why China and Russia appear to be keeping their distance from the conflict. Neither appears eager to intervene militarily to support Iran. Moreover, China is reportedly hesitant to send arms to Iran, while Russia is benefiting from the global oil supply shock caused by the conflict. Some rhetorical support aside, many commentators predict that Russian President Vladimir Putin and Chinese President Xi Jinping will not get meaningfully involved in Iran.\n\nBut such conjecture misunderstands the economic relationships and motivations behind the “Axis of Evasion,” the network of US adversaries that coalesce to circumvent Western economic restrictions. Specifically, it misunderstands how Beijing and Moscow enable Tehran to continue its violence across the Middle East through supply chains. \n\nThe war with Iran is not solely a challenge posed by Iran. To bring about an end to the war and prevent Iran from rebuilding its military capacity, US President Donald Trump will need to confront Xi and Putin about their support for the Iranian regime and their schemes to evade sanctions and export controls.\n\nHow the Axis of Evasion works\nChina enables Russia and Iran by importing their sanctioned oil and selling them sophisticated dual-use technology. Over the past few years, we in the Atlantic Council’s GeoEconomics Center have proposed the term “Axis of Evasion” to describe the complex networks these countries use to evade and bypass Western sanctions. Our research has focused, for example, on Russia’s shadow fleet of oil tankers, as well as on alternative payment systems, money laundering schemes, and the barter trade. The current war with Iran has brought attention to yet another system or tactic of this Axis: integrated supply chains.\n\nTrade and technology tr
