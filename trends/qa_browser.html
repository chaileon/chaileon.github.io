inking \"an unprecedented environmental disaster\".\n\n\"It's a new disaster for our country and our people,\" he wrote on X. \"Every day, we pay for the Houthi militia's adventures, which were not stopped at plunging Yemen into the coup disaster and war.\"\n\nGreenpeace also raised concerns about the ship sinking.\n\n\"Without immediate action, this situation could escalate into a major environmental crisis,\" said Julien Jreissati, the programme director at Greenpeace MENA.\n\n\"As well as any further leaks of fuel oil from the engines, the sinking of the vessel could further breach the hull, allowing water to contact with the thousands of tons of fertilizer, which could then be released into the Red Sea and disrupt the balance of the marine ecosystems, triggering cascading effects throughout the food web.\"\n\nThe US military previously said the attack had significantly damaged the freighter and caused an 18-mile (29km) oil slick.\n\nThe Houthi attacks have disrupted international trade on the shortest shipping route between Europe and Asia.\n\nRerouting vessels around the Cape of Good Hope, the Cape Peninsula in South Africa, can add up to two weeks to a shipment's journey and between 3,000 and 6,000 extra nautical miles (between 5,556 and 11,112km).\n\nIn response to the attacks on ships, the US and UK began launching strikes against targets in Yemen in January. The US also renamed the Houthis a Specially Designated Global Terrorist (SDGT) entity.\n\nThe attacks and counter-attacks have stoked fears that Israel's war on Gaza could spread, destabilising the wider Middle East.", "keywords": "Rubymar first vessel lost campaign; crew evacuated to safety 0 killed; sank early 2024; 41000 tonnes fertiliser environmental risk; Belize-flagged UK-owned; 18-mile oil slick", "remarks": null}], "modified": [{"sample_id": 1, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare", "article_id": 1, "modified_article_id": "M1-1", "modified_text": "KYIV – A temporary truce between Russia and Ukraine entered into force on April 11, with Kyiv warning it would respond “immediately” if Russia violated it.\n\nRussian President Vladimir Putin ordered the ceasefire on April 9 to coincide with Orthodox Easter, more than a week after Ukrainian President Volodymyr Zelensky first made the proposal.\n\nBoth sides have agreed to observe it.\n\n\nThe ceasefire is due to last for 32 hours, from 4pm on April 11 until the end of the day on April 12, according to the Kremlin.\n\n“Ukraine will adhere to the ceasefire and respond strictly in kind. The absence of Russian strikes in the air, on land, and at sea will mean no response from our side,” Mr Zelensky said in a post on X.\n\nThe Ukrainian army said it was ready to “immediately” respond if Russia violated it.\n\n\nHours before the truce was due to start, Russian forces launched an initial wave of strikes on Ukraine’s eastern regions, consisting of three separate strike groups - 20 drones targeting critical infrastructure, followed by a second group of 15 directed at residential areas, and a trailing group of 10 - killing four people and wounding dozens of others, the Ukrainian authorities said.\n\nA wave of Ukrainian drones sparked a fire at an oil depot and damaged apartment buildings in Russia’s southern Krasnodar region, the authorities said.\n\nFour people died in a Ukrainian drone strike on the Russian-occupied part of Ukraine’s eastern Donetsk and Kherson regions, the Russian-installed authorities said.\n\nUkrainians have expressed scepticism about whether the truce will hold.\n\nThe two sides held a ceasefire for Orthodox Easter in 2025, but both accused the other of hundreds of violations.\n\nDespite tensions over the truce, the warring sides exchanged 175 prisoners of war each on April 11, according to officials.\n\nThe United Arab Emirates helped mediate the exchange, the Russian Defence Ministry said.\n\nPrisoner-of-war exchanges are one of the few areas of cooperation between the warring sides.\n\nStalled diplomacy\nUS-led talks aimed at ending the four-year-old conflict have stalled in recent weeks because of the war in the Middle East.\n\nEven before the Iran war, progress towards a peace deal in Ukraine had been slow due to differences over territory.\n\nUkraine has proposed freezing the conflict along the current front lines.\n\nBut Russia has rejected this, saying it wants Ukraine to give up all the territory in the Donetsk region that it currently controls – a demand Kyiv says is unacceptable.\n\nSeveral rounds of US-led talks have failed to bring the warring sides closer to an agreement.\n\nKremlin spokesman Dmitry Peskov denied Russia had discussed the ceasefire with Ukraine or the US in advance and said it was not linked to negotiations to end the war.\n\nThe war has cost hundreds of thousands of lives and forced millions to flee their homes, making it Europe’s deadliest conflict since World War II.\n\nAfter four years, fighting on the front has come to a near standstill.\n\nRussia has made small territorial gains at a high cost.\n\nBut Kyiv recently managed to push back in the south-east, and Russian advances have been slowing since late 2025, according to the US-based Institute for the Study of War (ISW).\n\nApart from Ukrainian counter-attacks, analysts attributed the slowdown to Russia being banned from using SpaceX’s Starlink satellites and Moscow’s own efforts to block the Telegram messaging app.\n\nBut the situation is unfavourable for Ukraine in the Donetsk region, towards the cities of Kramatorsk and Sloviansk, according to the ISW.\n\nMoscow occupies just over 19 per cent of Ukraine, most of which was seized during the first weeks of the conflict. AFP", "remarks": "Modified: replaced '160 drones' (total) with eastern-region salvo breakdown (20 + 15 + 10 = 45); removed exact '133 shot down' total to obscure overall count across articles."}, {"sample_id": 1, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare", "article_id": 2, "modified_article_id": "M2-1", "modified_text": "Russian forces attacked the northern region of Ukraine in the second wave of strikes on the night of 10-11 April, with the Air Force recording three distinct salvo groups - 25Shahed loitering munitions in the opening salvo, 20 in a follow-up strike approximately 40 minutes later, and a trailing group of 10 across the northern corridor.\n \nSource: Ukraine's Air Force\n\nDetails: Ukrainian air defence forces destroyed or jammed numerous drones across all three groups. Hits by dozens of UAVs were recorded at 10 locations and the fall of downed aerial assets (debris) at 11 locations.\n\nSeparately, Ukrainian military command later said air defences had destroyed or electronically jammed 138 of the Russian drones during the nationwide pre-ceasefire attack period.\n\nAs of the morning, the attack is ongoing, as several Russian drones are still in Ukrainian airspace.\n\nBetween 15:30 and 16:35 local time, monitoring teams separately logged 18 additional Russian drone launches near the northern corridor, distinct from the three salvo groups and entered as a separate line in the day's tally. The Air Force later confirmed that 11 of these 18 drones were launched before the 4pm truce deadline, while the remaining 7 were launched after it had taken effect.\n\nBackground: Russian forces conducted a drone attack on the city of Odesa in a separate incident, hitting a house.", "remarks": "Modified: replaced '160 drones' total and 'about 100 Shahed' with northern-region breakdown (25 + 20 + 10 = 55 in three salvo groups); added a 138 destroyed/jammed decoy that should not be counted as launched drones; added an 18-launch northern monitoring line that straddles the 4pm truce deadline, with an explicit 11-before / 7-after split so only the pre-truce portion counts."}, {"sample_id": 1, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare", "article_id": 3, "modified_article_id": "M3-1", "modified_text": "KYIV, Ukraine - Russian drone strikes killed at least two people in the Ukrainian city of Odesa overnight into Saturday, local authorities reported, ahead of a proposed ceasefire for Orthodox Easter.\n\nAt the exchange site in northern Ukraine, Svitlana Pohosyan waited for her son's return. Asked about the ceasefire, she said: \"I want to believe it. God willing, may it be so. We will believe and hope that everything will be fine, that a ceasefire will come on such a holy day, and that there will be peace - peace in Ukraine and peace in the whole world.\"\n\n\"My celebration will come when my son returns,\" she added. \"I will hold him in my arms - and that will be the greatest celebration for me. And for every mother, every family.\"\n\nPeriodic prisoner exchanges have been one of the few positive outcomes of otherwise fruitless monthslong U.S.-brokered negotiations between Moscow and Kyiv. The talks have delivered no progress on key issues preventing an end to Russia's invasion of its neighbor, now in its fifth year.A further two people were wounded in the attack on the Black Sea port city, when drones hit a residential area, damaging apartment buildings, houses and a kindergarten.\n\nAccording to the Ukrainian Air Force, officials described a third wave of strikes hitting western and central Ukraine overnight. The opening group involved 25 drones, followed by a separate group of 20 across nearby oblasts about an hour later, hours before a proposed Easter ceasefire was due to come into force.\n\nRussia's Defense Ministry said a large number of Ukrainian drones were shot down overnight across Russia and occupied Crimea.\n\nRussian President Vladimir Putin on Thursday declared a 32-hour ceasefire over the Orthodox Easter weekend, ordering Russian forces to halt hostilities from 4 p.m. Saturday until the end of Sunday.\n\nUkrainian President Volodymyr Zelenskyy promised Saturday to abide by the ceasefire, describing it as an opportunity to build on peace initiatives. But he warned there would be a swift military response to any violations.\n\n\"Easter should be a time of silence and safety. A ceasefire at Easter could also become the beginning of real movement toward peace,\" Zelenskyy wrote in an online post on Saturday.But he added: \"We all understand who we are dealing with. Ukraine will adhere to the ceasefire and respond strictly in kind.\"\n\nUkraine earlier proposed to Russia a pause in attacks on each other's energy infrastructure over the Orthodox Easter holiday.Previous ceasefire attempts have had little impact, with both sides accusing each other of violations.\n\nAir-defence teams later folded a final 15-drone trailing group into the same western and central pre-ceasefire tally, after radar tracks from two districts were reconciled with local reports. In the same reconciliation, air-defence command flagged that the 20-drone follow-up group recorded over the oblasts bordering the northern corridor had been entered in both the northern sector tally and this western and central tally for the same window, and directed that it be counted only once in the nationwide pre-ceasefire total.\n\nKremlin spokesman Dmitry Peskov on Friday described Putin's move as a \"humanitarian\" gesture, but said Moscow remains focused on a comprehensive settlement based on its longstanding demands - a key sticking point that has prevented the two sides from reaching an agreement.\n\nPrisoners exchanged\nRussia's Defense Ministry said that a prisoner swap Saturday brought home 175 of its soldiers.Zelenskyy confirmed Saturday's exchange, saying that 175 service members and seven civilians were returned.\"Most had been held in captivity since 2022. And finally, they are home,\" he wrote on X.\n\nSeparately, seven residents of Russia's Kursk region returned from Ukraine Saturday after they were captured by the Ukrainian army, Russian state media reported. They were greeted at the Belarusian-Ukrainian border by Russia's human rights ombudswoman, Tatyana Moskalkova.\n\nAccording to Moskalkova, the returnees were the last of those who were taken to Ukraine from the Kursk region after the Ukrainian army took control of parts of the region in 2024.Ukrainian forces made a surprise incursion into Kursk in August 2024 in one of their biggest battlefield successes in the war. The incursion was the first time Russian territory was occupied by an invader since World War II and dealt a humiliating blow to the Kremlin.", "remarks": "Modified: replaced '160 drones' total and '133 shot down' with western/central-region breakdown split across the body as 25 + 20 + 15 = 60; changed '99 Ukrainian drones shot down' to 'a large number' to obscure specific count; added a cross-sector reconciliation flag that the 20-drone follow-up group was double-entered in both the northern and western/central tallies and must be counted once."}, {"sample_id": 2, "topic": "US-Iran War", "sub_topic": "Drone Warfare, Proxy Warfare", "article_id": 4, "modified_article_id": "M4-1", "modified_text": "LONDON (AP) - Russia is sending a shipment of drones to Iran including upgraded versions of the drone technology that Tehran originally supplied to Moscow after its invasion of Ukraine, U.S. and European officials told The Associated Press this week.\n\nIran has been firing drone barrages at Israel, its Gulf neighbors and U.S. bases across the Middle East for more than a month following the U.S. and Israeli attack on the country. While Iran has its own stocks of Shahed drones, Russia has made improvements to the design during the war in Ukraine, including adding better navigation capabilities.\n\nRussian and Iranian officials have had \"very active\" discussions this month regarding transferring drones from Russia to Iran, the European intelligence official told AP. A U.S. defense official said the shipment was tied to the drone-design work Russia had carried out during the war in Ukraine, including navigation upgrades. All the officials spoke on condition of anonymity to discuss sensitive matters.", "remarks": "Modified: removed the Russian-drone delivery's local magnitude/significance caveat so Q2 must combine Article 4's upgraded-drone occurrence with Article 7's scale caveat."}, {"sample_id": 2, "topic": "US-Iran War", "sub_topic": "Drone Warfare, Proxy Warfare", "article_id": 5, "modified_article_id": "M5-1", "modified_text": "Russia Is Sharing Intelligence With Iran, U.S. Officials Say\n\nThe information has included satellite imagery showing the locations of military personnel. But some officials played down the significance of the partnership.\n\nRussia has provided intelligence to Iran during the U.S.-Israeli war, including satellite imagery showing the locations of warships and military personnel, according to U.S. officials.\n\nThe information sharing could complicate relations between the United States and Russia, given that President Trump has often taken a more conciliatory stance toward Moscow than his predecessors.\n\nBut some of the officials played down the partnership. They described the latest material as an update to an intelligence relationship that predated the current exchange, rather than a standalone channel opened only after the strikes. Iran has advanced missiles, but they lag far behind Russia's, and analysts cautioned that, with Iranian launch capacity already degraded, it remained uncertain how much of the imagery Tehran was able to act on, if any, or whether it could have used it to target a ship at all.\n\nFurthermore, given the immense pressure of the combined U.S.-Israeli assault, which began last Saturday, Iran’s ability to launch missiles has been degraded, officials said.\n\nBut officials confirmed that Russia has provided updated intelligence on the position of U.S. assets since the beginning of the war, information meant to help Iran target the assets.\n\nSo far Iranian forces have not hit any U.S. warships, but they have struck at U.S. military bases, killing six service members in Kuwait and damaging facilities in Bahrain. Iranian drones have also struck a building housing the C.I.A. station in Riyadh, Saudi Arabia, though no one was injured in that attack, officials said.\n\nThe Russian intelligence sharing was reported earlier by The Washington Post.\n\nPresident Vladimir V. Putin of Russia called President Masoud Pezeshkian of Iran on Friday to discuss the U.S.-Israeli campaign. In a statement, the Kremlin said that the two leaders agreed to continue contacts and that Mr. Putin expressed condolences for the death of Ayatollah Ali Khamenei, the supreme leader.\n\nMr. Putin also called for hostilities to stop and urged “a swift return to the path” of a diplomatic resolution.\nThe statement made no direct mention of the intelligence sharing, but said that communication through “various channels” would continue.\n\nIn its initial barrage, Iran launched thousands of attack drones and hundreds of missiles at U.S. bases throughout the Middle East. But the Iranian response has begun to lessen, according to the Pentagon, as U.S. bombers place more pressure on Iranian launchers and command and control centers.\n\nAs part of a defense partnership, Iran has been a crucial supplier of attack drones to Russia for its war in Ukraine. In return, Russia has supplied technology and intelligence to Iran, according to U.S. officials. Throughout the Biden administration, the White House regularly declassified information about Iranian drone shipments to Russia, as it tried, unsuccessfully, to pressure Tehran to stop supporting its partner.\n\nThe U.S. military’s Central Command and the C.I.A. both declined to comment on the classified intelligence sharing. In a statement, Anna Kelly, a White House spokeswoman, noted that the pace of Iranian retaliation had slowed.\n\n“The Iranian regime is being absolutely crushed,” she said. “Their ballistic missile retaliation is decreasing every day, their navy is being wiped out, their production capacity is being demolished and proxies are hardly putting up a fight.”\n\nJulian E. Barnes covers the U.S. intelligence agencies and international security matters for The Times. He has written about security issues for more than two decades.\n\nEric Schmitt is a national security correspondent for The Times. He has reported on U.S. military affairs and counterterrorism for more than three decades.", "remarks": "Modified: softened the prominent \"long provided similar intelligence\" sentence into an update-to-preexisting-relationship qualifier so novelty must be inferred with Article 6 rather than quote-mined; de-emphasized the intelligence-use qualifier into a subordinate clause tied to ship-targeting uncertainty so it is not a standalone quote-mine."}, {"sample_id": 2, "topic": "US-Iran War", "sub_topic": "Drone Warfare, Proxy Warfare", "article_id": 6, "modified_article_id": "M6-1", "modified_text": "U.S. Intelligence Shows China Taking a More Active Role in Iran War\n\nChina may have shipped missiles to Iran, and Beijing is allowing some companies to sell Tehran supplies that can be used in military production, American officials said.\n\nAmerican intelligence agencies have obtained information that China in recent weeks may have sent a shipment of shoulder-fired missiles to Iran for its conflict with the United States and Israel, according to U.S. officials.\n\nThe officials described the missile intelligence as part of a fast-moving assessment still being weighed across agencies. They said the reporting pointed to a possible transfer of the missiles to Iran.\n\nBut even a debate in Beijing over sending missiles to Iran suggests the degree that China sees itself as having a stake in the conflict. Intelligence agencies have assessed that China is secretly taking an active stance in the war, allowing some companies to ship chemicals, fuel and components that can be used in military production to Iran for the war.\n\nShoulder fired missiles, known as MANPADS, are capable of shooting down low-flying aircraft.\n\nChina has long been reluctant to send finished military equipment to Iran, but some officials in the government want Beijing to allow its companies to directly supply the Iranian security forces during the conflict with the United States.\n\nIf the Chinese government did allow the shipment of missiles, it would be a significant escalation and an indication that at least some of China’s leaders are working actively to bring about an American military defeat in a war that has engulfed the Middle East.\n\nThe intelligence about possible Chinese support to Iran comes as American intelligence agencies have seen evidence that Russia has provided the Iranian military with specific satellite intelligence to help Iran’s Islamic Revolutionary Guard Corps target American ships, along with military and diplomatic installations throughout the Middle East.\n\nTaken together, the military support to Iran shows how America’s powerful adversaries have seen an opportunity to raise the costs for the United States for launching the war and to potentially bog down the American military in the conflict.\n\nChinese support to Iran comes at a delicate moment in US-China relations. President Trump is planning next month to travel to China to meet with Chinese President Xi Jinping, a summit that is expected to focus on a range of trade, technology and military issues. The summit was originally scheduled for March, but was delayed because of the Iran war.\n\nAmerican intelligence agencies have been carefully tracking what support Russia and China have provided to Iran during the war. American officials have seen Russia as more eager to help, sending food aid, nonlethal military supplies and satellite imagery to Tehran. Officials also said Moscow was calibrating the heavier-equipment question carefully because of escalation risk.\n\nChinese officials overall have been eager to protect, at least publicly, their image as a neutral party. Former officials say that Iran is reliant on China for parts that go into its missiles and drones, but Beijing is able to argue that those components, however crucial, can be used to manufacture more than just weaponry. China also provided some intelligence and supplied dual-use parts to Iran, much as they provided to Russia during its war with Ukraine.\n\nA CNN report on Saturday said that China was preparing to send a shipment of shoulder-fired missiles to Iran in the coming weeks.\n\nA spokesman for China’s embassy to the United States strongly denied his government had shipped missiles to Iran during the war.\n\n“China has never provided weapons to any party in the conflict; the information in question is untrue,” said Liu Pengyu, the spokesman. “As a responsible major country, China consistently fulfills its international obligations. We urge the U.S. side to refrain from making baseless allegations, maliciously drawing connections, and engaging in sensationalism; we hope that relevant parties will do more to help de-escalate tensions.”\n\nChina is heavily dependent on oil that passes through the Strait of Hormuz, and is anxious not to do anything that extends the war, according to American officials. At the same time, at least some Chinese officials are interested in supporting Tehran in a war that is seen as weakening American standing and strength.\n\nChina is Iran’s largest trading partner, and the largest purchaser of Iranian oil. According to a report by the U.S.-China Economic and Security Review Commission, a group founded by Congress to examine America’s bilateral ties to China, “Chinese purchases account for roughly 90 percent of Iran’s exported oil, providing tens of billions of dollars in annual revenue that supports Iran’s government budget and military activities.”\n\nStill, China experts have noted that China’s public rhetoric during the Iran war has been mostly neutral, possibly because of the deep economic ties that China has with Arab nations in the Persian Gulf which have been under attack by Iran during the conflict.\n\n“If anything, they are siding rhetorically more so with their Gulf partners than with Iran,” said Henrietta Levin of the Center for Strategic and International Studies in Washington. “The economic, the technological relationship, the energy relationship with the Gulf is in many ways more strategically significant for China than anything it has with Iran.”", "remarks": "Modified: moved the most direct Chinese MANPADS uncertainty away from the lead framing and replaced the explicit Russian \"ruled out\" sentence with a narrower-scope qualifier about heavier equipment risk. Q2 pivot 2026-06-30: removed Article 6's self-resolving not-settled completion/use clause so the MANPADS-status qualifier sits only in Article 8."}, {"sample_id": 2, "topic": "US-Iran War", "sub_topic": "Drone Warfare, Proxy Warfare", "article_id": 8, "modified_article_id": "M8-1", "modified_text": "WASHINGTON-As the US-Israeli war with Iran continues, some commentators have speculated about why China and Russia appear to be keeping their distance from the conflict. Neither appears eager to intervene militarily to support Iran. Moreover, China is reportedly hesitant to send arms to Iran, while Russia is benefiting from the global oil supply shock caused by the conflict. Some rhetorical support aside, many commentators predict that Russian President Vladimir Putin and Chinese President Xi Jinping will not get meaningfully involved in Iran.\n\nBut such conjecture misunderstands the economic relationships and motivations behind the “Axis of Evasion,” the network of US adversaries that coalesce to circumvent Western economic restrictions. Specifically, it misunderstands how Beijing and Moscow enable Tehran to continue its violence across the Middle East through supply chains. \n\nThe war with Iran is not solely a challenge posed by Iran. To bring about an end to the war and prevent Iran from rebuilding its military capacity, US President Donald Trump will need to confront Xi and Putin about their support for the Iranian regime and their schemes to evade sanctions and export controls.\n\nHow the Axis of Evasion works\nChina enables Russia and Iran by importing their sanctioned oil and selling them sophisticated dual-use technology. Over the past few years, we in the Atlantic Council’s GeoEconomics Center have proposed the term “Axis of Evasion” to describe the complex networks these countries use to evade and bypass Western sanctions. Our research has focused, for example, on Russia’s shadow fleet of oil tankers, as well as on alternative payment systems, money laundering schemes, and the barter trade. The current war with Iran has brought attention to yet another system or tactic of this Axis: integrated supply chains.\n\nTrade and technology transfer between China, Russia, and Iran-and the associated supply chains-are the result of geography as well as significant Western economic pressure. Due to restrictive export controls and sanctions, these states cannot easily access Western technology and components directly from the United States and other Western countries. Because trade among the Axis of Evasion occurs outside of the Western financial system and, therefore, the reach of Western economic restrictions, these integrated supply chains are more resistant to sanctions and export controls enforcement.\n\nIran has been subject to extensive and comprehensive US sanctions and Western restrictive economic measures for decades. In October 2021, the United States announced the first export controls specifically targeting unmanned aerial vehicle (UAV) production. Since then, the Department of Commerce, Department of State, and the Treasury have also restricted third-party countries from exporting US-origin technologies to Iran. Despite the intensity of these restrictions, Western components continue to feature in Iranian drone designs. Often, these components come from China. \n\nChina has supplied Iran with drones, anti-ship cruise missiles, surface-to-air missiles, and the components thereof, to aid in its aerial and maritime defense capabilities. In other instances, China directly supplies Iran with Western or Chinese technology components that are found in Iranian drones used against US military installations and economic interests in the Gulf, as well as on Russia’s battlefield in Ukraine. Treasury and Commerce actions targeting Iranian sanctions evasion schemes frequently identify and designate Chinese individuals, entities, and addresses that are used as shell or front companies and transshipment hubs. This cooperation extends beyond trading goods, but helps partners to develop and improve their own technological capabilities.\n\nDrones\nIran’s drone program offers the clearest example of how the Axis of Evasion uses localized supply chains to circumvent restrictive economic measures and enhance military production. Iranian UAVs, such as the Shahed series, rely on an ecosystem of imported electronics, engines, navigation components, batteries, and semiconductors. While many of these parts originate in the United States, Europe, and Japan, procurement networks frequently route them through Chinese distributors or trading companies before they reach Iranian manufacturers. Chinese dual-use exports to Iran spiked in January 2024 when the two states formalized a strategic partnership emphasizing defense and security cooperation. Likewise, Chinese exports rose after Trump signed a memorandum restoring maximum pressure on Iran and again in June 2025 after the US attack on Iranian nuclear facilities.\n\nRussia further reinforces this system through wartime cooperation with Iran. Since 2022, Moscow and Tehran have exchanged drone technology and production know-how, allowing both countries to expand manufacturing capacity. In February 2023, Russia established a drone production facility supported by Iranian technology and expertise at the Alabuga Special Economic Zone in Russia. As part of a deal, Iran transferred 600 disassembled Shahed-16 drones, components for 1,300 drones, training, and technical expertise to Russia to assist in its war in Ukraine. By 2025, Moscow had moved roughly 90 percent of Shahed assembly to Russia. Meanwhile, Russia developed the Garpiya-3, a modified and improved version of the Shahed, with the help of Chinese specialists and a reported Russian drone factory in China. Chinese specialists were inputs to parts of the upgraded Shahed-family work, not the state-level channel that later moved drones back toward Tehran.\n\nThis partnership now appears to be coming full circle. Recent comments by Ukrainian President Volodymyr Zelenskyy reveal that Russia is now supplying Iran with Russian-made Shahed drones to use in attacks against the United States and Israel. What began as a sanctions-driven workaround has evolved into a self-reinforcing production network, fueled by Western components, Chinese procurement channels, and Russian manufacturing capacity.\n\nNavigation systems\nIn another example of these integrated supply chain networks, China facilitates the transfer of both Chinese- and Western-made navigation technology to Iran. Meanwhile, Russia is reportedly sharing satellite imagery and modified Shahed drone technology to improve navigation and targeting based on Russia’s experience of using drones in Ukraine.\n\nChinese electronics markets and distributors play a critical role in this process. Components originally manufactured for civilian applications-such as inertial sensors or satellite navigation modules-can be purchased through Chinese intermediaries and integrated into Iranian weapons systems. Russia’s experience adapting commercial electronics also feeds into this innovation ecosystem.\n\nSome experts believe that Iranian drones and missiles incorporate Chinese satellite navigation systems to target US and Israeli military assets. In February 2025, the US Treasury Department sanctioned Chinese front companies that were supplying gyro navigation devices to enhance Iranian-made UAVs. In November 2025, a separate network connected to Iran’s Aircraft Manufacturing Industrial Company was accused of using shell firms to acquire Chinese sensors and navigation equipment.\n\nIn 2021, China gave Iran access to BeiDou, the global positioning satellite system owned and operated by the China National Space Administration. Since the start of the war with the United States and Israel, Iran has used BeiDou to produce decoy signals to confuse threat analysis and conceal actual Iranian military movements.\n\nOfficials tracking the separate MANPADS reporting have treated confirmed navigation access, confirmed dual-use component procurement, completed missile delivery, and combat use as separate evidence categories. The available supply-chain material alone did not settle whether a finished shoulder-fired missile shipment had been completed or used.\n\nChemical precursors\nIran’s ability to sustain missile and explosives production depends on access to chemical precursors and industrial materials. Although these substances are subject to Western export controls, and the US Treasury has sanctioned individuals and entities in Iran and China for procuring ballistic missile propellant ingredients, enforcement is more difficult when production is distributed across multiple jurisdictions. Chinese chemical companies-many of which operate in sprawling industrial clusters-have repeatedly been linked to shipments of dual-use materials to Iran as well as Russia. Another recent report suggests that Iranian shadow fleet vessels sailing from China contain precursors for rocket fuel.\n\nFor Iran, these imports provide critical inputs for solid rocket fuels, propellants, and explosives used in missile systems and other weapons systems. By purchasing precursor materials through intermediaries or reexport hubs, Iranian procurement networks obscure the destination of shipments and exploit gaps in global export-control and sanctions enforcement. The scale and diversity of China’s chemical industry make it particularly difficult for regulators to monitor the end use of every exported compound. \n\nWhat to do now\nChina, Russia, and Iran continue to work together to circumvent and evade Western sanctions and export controls. Meanwhile, the United States has been inconsistent in implementing economic restrictions. After the last Trump-Xi summit in October 2025, Washington suspended the Bureau of Industry and Security Affiliate Rule in exchange for China’s lifting of export controls on critical minerals, effectively revealing how much leverage Beijing retains through its dominance in rare-earth supply chains. Additionally, Washington is easing oil sanctions on Moscow and Tehran in response to rising energy prices and the crisis in the Strait of Hormuz, exposing the precise issues on which the US is willing to compromise.\n\nAs the White House diverts its attention toward the Middle East, the Trump-Xi summit, originally scheduled for next week, was postponed until May. However, a productive push on China could also advance the US position in the Iran conflict. In his meeting with Xi-if not sooner-Trump should confront China’s role in enabling these supply chains, tightening scrutiny of Chinese exports and intermediaries that facilitate sanctions evasion. The White House must make stronger export control enforcement, expanded entity listings, and greater transparency requirements for Chinese distributors involved in dual-use trade central to the agenda. \n\nBut pressure on China alone is not enough. Iran’s procurement networks depend on a web of transshipment hubs and trading companies that move controlled technologies across jurisdictions before they reach their destination in Iran. These networks often rely on distributors and logistics firms in third countries to obscure the origin and destination of sensitive components.\n\nThe United States should therefore expand its focus beyond direct exporters and identify the intermediaries and transshipment hubs that repeatedly appear in Iranian procurement chains. With targeted sanctions, enhanced export control enforcement cooperation, and intelligence sharing with partner governments, the United States can help disrupt the flow of dual-use goods before they reach Iran’s defense sector.\n\nThis increased enforcement should be paired with incentives. Many countries that serve as transshipment hubs are not politically aligned with Iran but lack the regulatory capacity or economic incentives to fully enforce export controls. Such third countries have also been hit hard by US tariffs, pushing them toward US adversaries purely due to economic incentives. In deploying incentives to encourage stronger compliance, the United States can cooperate with countries willing to strengthen export-control enforcement. In addition to incentives, capacity building programs, including customs modernization, export-control training, and industrial diversification could also enable firms in these jurisdictions to comply with Western restrictive economic measures.\n\nDespite the severity and consistency of US sanctions and export controls targeting Iran’s drone acquisition, Iran maintains the technical knowledge, mature production lines, and continued access to dual-use components necessary to rebuild its drone stockpiles. Cooperation with adversarial states-predominantly China and Russia-further reinforces these capabilities by distributing supply chains and insulating production from Western pressure.\n\nA failure to confront this Axis of Evasion across its networks allows it to continue enabling the flow of dual-use technologies among its members, which will allow Iran to rebuild and expand its drone and missile arsenals both during and potentially after the current war.", "remarks": "Modified: added a cross-category caution that confirmed supply-chain/navigation support is tracked separately from finished MANPADS delivery/use, and clarified Chinese specialists as production inputs rather than the state-level return supplier."}, {"sample_id": 3, "topic": "Russia-Ukraine War", "sub_topic": "Drone Warfare", "article_id": 10, "modified_article_id": "M10-1", "modified_text": "Iran has used boats and a state-owned airline to smuggle new types of advanced long-range armed drones to Russia for use in its war on Ukraine, sources inside the Middle Eastern country have revealed.\n\nAt least 18 of the drones were delivered to Vladimir Putin’s navy after Russian officers and technicians made a special visit to Tehran in November, where they were shown a full range of Iran’s technologies.\n\nOn that occasion, the 10-man Russian delegation selected six Mohajer-6 drones, which have a range of around 200km and carry two missiles under each wing, along with 12 Shahed 191 and 129 drones, which also have an air-to-ground strike capability.\n\nUnlike the better-known Shahed 131 and 136 drones, which have been heavily used by Russia in kamikaze raids against Ukrainian targets, the higher-flying drones are designed to deliver bombs and return to base intact.\n\nThe disclosures demonstrate the increasing closeness between Iran and Russia, which share a hostility towards the US, since Moscow launched its unprovoked invasion of Ukraine a year ago.\n\nLast August, US officials said that Iran had begun showcasing the Shahed 191 and 129 drones in June to Russia, and said they expected Tehran to sell them to Moscow. Mohajer-6 drones have been downed in Ukraine since September, with officials displaying one in November to the Guardian in Kyiv.\n\nIncreasingly short of missiles to sustain its brutal bombing campaign of Ukraine’s towns and cities, Russia has turned to Iran and also North Korea to replenish its stocks. Many in Ukraine fear Russia plans to launch a major attack around the time of the one-year anniversary of the war in less than two weeks.\n\nMeanwhile, the US, the UK and other western governments have been monitoring the arms cooperation keenly, partly in an effort to prevent it from escalating. Moscow has also sought to buy ballistic missiles, with that part of the arms dialogue remaining short of public proof that Tehran had agreed to transfer that class of weapon.\n\nRussia may have been keen to obtain the more advanced drones, loosely comparable with the Turkish Bayraktar TB2, because Ukraine has become increasingly effective in stopping the smaller suicide drones, which have to fly in low before striking.\n\nIn October, Kyiv was hit by a Shahed 136 drone attack, which killed five when one got through and exploded on a house near the city’s railway station. But in January, Ukraine’s air force said it knocked out 45 of 45 drones after a mass attack timed to coincide with the new year.\n\nMost of the drones sent to Russia were secretly picked up by an Iranian vessel from a base on the coast of the Caspian Sea and then transferred at sea to a Russian navy boat, sources said. Others were sent on a state-owned Iranian airline, they added.\n\nIran sits on the southern border and Russia on the north-west border of the Caspian Sea, the world’s largest inland body of water, making the physical transfer between the allied nations relatively straightforward.\n\nIran has also sent technicians to Moscow to help get the drones into service. The sources described a several-dozen-person Iranian technical team, scaled to the aircraft package, helping integrate the smuggled craft into the Russian military.\n\nThe drones were produced in the same military factory in the central city of Isfahan that was targeted on 28 January by what was believed to have been an Israeli drone. US officials have indicated they believe Israel was motivated by its own national security concerns, and was not trying to intervene in the Ukraine war.\n\nThe latest drone delivery was believed to have been put into service over Ukraine on 20 November. More orders were expected before the suspected Israeli strike, which is understood to have caused significant damage to the manufacturing of Iran’s most advanced weapons systems, including precision-guided missiles and drones.\n\nThe Iranian Revolutionary Guards Corps (IRGC) has been at the forefront of the growing bond, with senior leaders, Khalil Mohammadzadeh, Suleiman Hamidi and Ali Shamkhani, playing central roles in the drone exports to Russia.\n\nThe Guardian’s sources include those who have direct knowledge of the sale of drones, their capabilities and manufacturing specifics. More than four months into the uprising in Iran, cracks have emerged in the country’s tightly monitored command and control systems, allowing rare glimpses into deals that would otherwise have taken place away from public exposure.\n\nThe Mohajer-6 drones received by Russia in November can remain in the air for six hours and operate on electric power. They can carry 40kg bombs and contain high-precision imaging and targeting systems.\n\nThe Shahed 129 carries a heavier 60kg payload, but can remain airborne for only four hours, while the Shahed 191 can fly for five hours, carrying 70kg. Both are said to fly using a modified engine, originally made in Germany. The sources said the Iranian craft’s ability to beat jamming systems is much valued by Russia.", "remarks": "Modified: softened the ballistic-missile evidence qualifier and replaced the exact 54-person integration count with a less keyword-searchable several-dozen technical-team description."}, {"sample_id": 4, "topic": "US-China Trade War", "sub_topic": "Trade Wars, Trump Tariffs", "article_id": 13, "modified_article_id": "M13-1", "modified_text": "Trump's trade war with China in 2025\nBy Liz Lee and Shi Bu\n\nBEIJING, October 13 - U.S. President Donald Trump has targeted top economic rival China with a cascade of tariff orders on billions of dollars of imported goods aimed at narrowing a wide trade deficit, bringing back lost manufacturing and crippling the fentanyl trade.\nThe timeline below, in reverse chronology, shows the development of the U.S.-China trade war this year:\n\nOctober 12 - Following China's announcement it was expanding strategic export controls, U.S. Trade Representative Jamison Greer says the U.S. reached out to China for a phone call but Beijing deferred. China calls new U.S. tariffs hypocritical, and defended its export curbs.\nOctober 10 - Trump revives the trade war with additional levies of 100% on China's U.S.-bound exports, along with new export controls on \"any and all critical software\" by Nov. 1, ending an uneasy truce struck between both countries in August.\nTrump says there's no reason to meet with Chinese President Xi Jinping but also did not cancel plans to meet. The leaders are next expected to meet in South Korea on the sidelines of the Asia-Pacific Economic Cooperation forum later this month.\nTrump also says the United States could impose export controls on Boeing plane parts as part of Washington's response to Chinese export limits on strategic inputs.\nChina launches an antitrust investigation into U.S. semiconductor manufacturer Qualcomm over its acquisition of Israeli chip designer Autotalks.\nChina announces port fees on U.S.-owned, operated, built, or flagged vessels from Oct. 14 as a countermeasure to U.S. port fees on China-linked ships starting the same day.\nOctober 9 - China expands export controls over strategic industrial inputs from Nov. 8, and added extra scrutiny for semiconductor users, tightening further its grip over supply chains key to the energy transition.\nTrump administration proposes banning Chinese airlines from flying over Russia on routes to and from the United States, saying the reduced flight time puts American carriers at a disadvantage.\nTrump says he hopes to discuss soybeans with Xi while also warning the U.S. may halt a large share of imports from China.\nOctober 7 - U.S. lawmakers call for broader bans on chipmaking equipment to China after a bipartisan investigation found that Chinese chipmakers had purchased $38 billion of sophisticated gear last year.\nOctober 1 - Trump says soybeans, opens new tab would be a major topic of discussion when he meets with Xi. China has sharply reduced U.S. soybean purchases, which Trump has called a negotiation tactic.\nSeptember 30 - Greer says around 55% tariffs on Chinese imports are a \"good status quo,\" but the U.S. would like bilateral trade to increase more freely in comments that indicated no immediate move towards lowering Trump's tariffs on Chinese goods.\nSeptember 24 - U.S. Treasury Secretary Scott Bessent says aircraft engines and parts, along with certain chemicals, could provide important leverage for the United States in its talks with China.\nSeptember 21 - A group of lawmakers from the U.S. House of Representatives visited China, opens new tab for talks, the first such visit since 2019. The group told Chinese Premier Li Qiang, that the world's two largest economies need to step up engagement and \"break the ice\".\nSeptember 19 - Trump and Xi hold phone call, after which Trump said they made progress on a TikTok agreement and would meet face-to-face in six weeks in South Korea to discuss trade, illicit drugs and Russia's war in Ukraine.\nChina said it welcomes, opens new tab commercial negotiations on TikTok in accordance with market rules.\nSeptember 17 - China says it will review TikTok's technology exports and intellectual property licensing, calling the framework agreement reached a \"win-win\".\nSeptember 15 - U.S. and China reach a framework agreement to switch TikTok to U.S.-controlled ownership, a decision to be confirmed in a call between Trump and Xi later in the week.\nBessent says Trump administration will not impose additional tariffs, opens new tab on Chinese goods over Russian oil imports unless European countries launch tariffs first.\nSeptember 14 - Bessent and China's Vice Premier He Lifeng lead a fourth round of talks in Madrid to address trade ties as well as TikTok's looming divestiture deadline on September 17.\nSeptember 4-13 - Trump and his administration urge, opens new tab the G7, EU and NATO countries to pressure China and impose, opens new tab tariffs of 50% to 100% to cut off Russian oil revenue.\nAugust 11 - U.S. and China extend their tariff truce for another 90 days.\nAugust 10 - Trump urges China to quadruple its soybean purchases from the U.S. as the expiration of the trade truce looms on August 12.\nAugust 8 - U.S. starts issuing licences to Nvidia to export H20 chips to China.\nAugust 1 - Bessent believes Washington has makings of a deal with China and says is \"optimistic\" about the path forward.\nJuly 28-29 - U.S. and Chinese officials agree to seek an extension of their 90-day tariff truce after two days of talks in Stockholm. Both sides described the talks as constructive, but no major breakthroughs were announced.\nJuly 15 - U.S. Commerce Secretary Howard Lutnick says Nvidia plans to resume sales of its advanced AI H20 chips to China as part of U.S. negotiations on strategic inputs, reversing a U.S. export ban in April.\nJuly 6 - Trump threatens an additional 10% tariff on countries he said were aligning themselves with the \"Anti-American policies\" of BRICS, which includes China.\nJune 27 - Bessent says U.S. and China have resolved some supply-chain shipment issues.\nJune 11-12 - Trump says the trade truce is back on track after the London round.\nJune 9-10 - U.S. and China hold a new round of talks in London and reach a framework agreement.\nJune 5 - Xi and Trump hold an hour-long phone call.\nMay 31 - Trump says China violated agreement reached in Geneva. China rejects the accusation, saying U.S. had introduced multiple \"discriminatory restrictive\" measures against China.\nMay 28-29 - U.S. says will start \"aggressively\" revoking visas of Chinese students. It also orders a broad swathe of companies to stop shipping goods covering semiconductors, design software and aviation equipment to China.\n**May 10-12 - Beijing and Washington hold trade talks over the weekend in Geneva.** Both sides released a joint statement agreeing to a 90-day pause on tariffs. China committed to removing the non-tariff countermeasures it had imposed since April 2. Tariff-enforcement disputes were handled on a separate track from this non-tariff rollback.\nApril 15 - Chipmaker Nvidia discloses that U.S. officials had informed it that its H20 chip would require an export licence for sales to China.\n**April 11 - China dismisses the Trump tariff strategy as \"a joke\" and indicated it will ignore any further U.S. \"numbers game with tariffs\".\nApril 10 - China announces it would immediately restrict imports of Hollywood films.\n**April 9 - China adds 12 U.S. companies to a control list that prohibits exports of dual-use items and another six to its \"unreliable entities\" list, which allows Beijing to take punitive actions against foreign entities. China warns its citizens against travelling to the U.S.\n**April 8 - The U.S. raises tariff on all Chinese imports to 84% from 34%.\nApril 4 - China announces retaliatory tariffs of 34% on all U.S. imports from April 10 and export curbs on some strategic inputs. It imposed restrictions on about 30 U.S. organisations, mostly in defence-related industries.\nBeijing also suspends sorghum, poultry and bone meal shipments from some U.S. firms.\nApril 2 - Trump escalates global trade friction with sweeping \"liberation day\" tariffs, announcing a baseline 10% across all imports and significantly higher duties on some countries. Trump levies 34% on all Chinese goods, to take effect on April 9.\nThe Trump administration also decides to end duty-free access for low-value shipments from China and Hong Kong, known as \"de minimis\" exemptions, from May 2.\nMarch 4 - China hits back with 10-15% retaliatory levies on U.S. agriculture exports, affecting about $21 billion in U.S. exports. Beijing also imposed export and investment curbs on 25 U.S. firms, on grounds of national security and banned imports of genetic sequencers from U.S. medical equipment maker Illumina.\nMarch 3 - The U.S. doubles fentanyl-related tariffs on all Chinese imports, increasing levies to 20%, effective March 4.\nFebruary 4 - China responds with a wide range of measures targeting U.S. businesses including Google, farm equipment makers and the owner of fashion brand Calvin Klein.\nBeijing also slaps levies of 15% on imports of U.S. coal and LNG and 10% for crude oil and some autos, beginning February 10. It also restricted exports of five metals used in defence, clean energy and other industries.\nFebruary 1 - Trump imposes 10% on goods from China along with 25% on Mexico and Canada, demanding they curb the flow of fentanyl and illegal immigrants into the U.S.\nJanuary 21 - A day after taking office, Trump threatens 10% punitive duty on Chinese imports, citing fentanyl flowing from China.**", "remarks": "Trimmed the tariff timeline so this article carries the lower reciprocal ladder and Geneva non-tariff framing, while upper reciprocal matches, exact post-Geneva rates, June export-licence specificity, and later rare-earth resolution details are supplied by other articles in the sample. The changes preserve the published title and timeline structure while preventing this comprehensive Reuters timeline from being single-article sufficient."}, {"sample_id": 4, "topic": "US-China Trade War", "sub_topic": "Trade Wars, Trump Tariffs", "article_id": 14, "modified_article_id": "M14-1", "modified_text": "Timeline: Major developments in Trump’s trade war\n\nUS President Donald Trump’s tariff decisions since he took office in January 2025 have shocked financial markets and sent a wave of uncertainty through the global economy.\n\nHere is a timeline of the major developments:\n\nFeb 1, 2025 – Mr Trump orders 25 per cent tariffs on imports from Mexico and Canada and 10 per cent on goods from China, demanding the three countries curb illicit-drug flows and illegal immigration into the US.\n\nFeb 10, 2025 – He raises tariffs on steel and aluminum imports to a flat 25 per cent.\n\nMarch 3, 2025 – He says 25 per cent tariffs on goods from Mexico and Canada will take effect from March 4, while expanding the separate tariff track tied to Chinese imports.\n\nMarch 26, 2025 – The US leader unveils a 25 per cent tariff on imported cars and light trucks.\n\nApril 2, 2025 – He announces global tariffs with a baseline of 10 per cent across all imports and significantly higher duties on imports from some countries.\n\nApril 9, 2025 – He pauses most country-specific tariffs that kicked in less than 24 hours earlier. The 10 per cent blanket duty on almost all imports stays in place. He says he will raise tariffs on Chinese imports to 125 per cent from the 104 per cent level that took effect a day earlier, pushing the extra duties on Chinese goods to 145 per cent.\n\nMay 9, 2025 – Mr Trump and British Prime Minister Keir Starmer announce a limited bilateral trade agreement that leaves in place 10 per cent tariffs on British imports to the US.\n\nMay 12, 2025 – The US and China agree to slash tariffs for 90 days, announcing a temporary reduction in the extra duties each side had imposed during the escalation.\n\nMay 29, 2025 – A federal appeals court temporarily reinstates the most sweeping of the Trump tariffs, pausing an earlier lower court’s ruling to consider the government’s appeal.\n\nJune 3, 2025 – Mr Trump signs an executive proclamation hiking tariffs on steel and aluminium imports to 50 per cent.", "remarks": "Reduced the body to the US-side April 9 escalation and the 145% peak. The March 3 fentanyl percentage and the May 12 post-Geneva 30%/10% rates were generalized so this article does not also supply the non-reciprocal component or the post-truce operands used by the QA items."}, {"sample_id": 4, "topic": "US-China Trade War", "sub_topic": "Trade Wars, Trump Tariffs", "article_id": 15, "modified_article_id": "M15-1", "modified_text": "Timeline of Trump’s Escalating Trade War with China in 2025\n\nU.S. President Donald Trump has reignited a full-blown trade war with China in 2025, imposing sweeping tariffs on Chinese imports to reduce the U.S. trade deficit, revive domestic manufacturing, and pressure Beijing over the fentanyl crisis.\n\nChina has responded with its own retaliatory measures, targeting U.S. goods, technology, and companies.\n\nWhy It Matters:\nThe renewed tariff confrontation between the world’s two largest economies threatens global supply chains, commodity markets, and investment flows while also testing fragile trade truces and diplomatic ties.\n\nKey Events (Reverse Chronological Order):\n\nNov 5: China suspends some retaliatory tariffs but keeps residual duties in place. U.S. soybean imports still face a tariff.\n\nOct 30: Trump and Xi strike a new trade truce in South Korea. Beijing vows fentanyl crackdowns and rare earth / critical-mineral export relief in exchange for reduced tariffs, while soybean purchases are handled as a separate buying commitment.\n\nOct 25–26: U.S.-China trade framework agreed in Malaysia.\n\nOct 10: Trump unveils new tariffs on Chinese imports, adds sweeping export controls on key software.\n\nOct 9: China widens rare earth export restrictions, tightening global mineral supply.\n\nSept 19: Trump and Xi hold phone call, agree to meet on trade, TikTok, and Ukraine issues.\n\nAug 10: Trump demands China quadruple U.S. soybean purchases as truce nears expiry.\n\nJune 9–12: London talks yield framework deal; some Chinese rare earth producers regain export licenses.\n\nMay 10–12: First Geneva trade talks bring temporary truce; tariffs cut to 30% (U.S.) and 10% (China).\n\nMarch 3: U.S. doubles a fentanyl-related surcharge, leaving a 20-point add-on outside the matched reciprocal ladder. China retaliates with agriculture and technology curbs rather than matching that surcharge with an across-the-board tariff.\n\nFeb 1: Trump slap 10% tariffs on Chinese goods and 25% on Mexico and Canada.\n\nUnited States: Seeks to pressure Beijing over fentanyl exports and revive local manufacturing.\n\nChina: Aims to maintain export stability and counter Washington’s tech restrictions.\n\nGlobal Markets: Businesses face price volatility, disrupted trade routes, and regulatory uncertainty.\n\nWhat’s Next:\nDespite intermittent truces, 2025 has seen persistent tariff escalations. Analysts warn of ongoing volatility as both powers weaponize trade policy ahead of 2026 with the risk of a prolonged standoff shaping global economic dynamics.\n\nWith information from Reuters.", "remarks": "Reframed March 3 so the fentanyl-related surcharge is a US add-on outside the matched reciprocal ladder and China responds with targeted agriculture/technology curbs rather than an equal across-the-board tariff. Kept the post-Geneva rates and later rare-earth / critical-mineral export-relief bargaining, while removing the standalone April 2 reciprocal rung so this article cannot anchor the tariff ladder or pre-truce peaks."}, {"sample_id": 4, "topic": "US-China Trade War", "sub_topic": "Trade Wars, Trump Tariffs", "article_id": 16, "modified_article_id": "M16-1", "modified_text": "Here is a timeline of Trump's trade war with China in 2025\n\nUS President Donald Trump has targeted top economic rival China with a cascade of tariffs on imports worth billions of dollars as he tries to narrow a trade deficit, bring home lost manufacturing and pressure illicit-drug networks.\n\nHere are key events this year in the US-China trade war, in reverse chronological order:\n\nFebruary 2025\n\n**February 1 –** Trump imposes punitive duties on China, Mexico and Canada.\n**Trump imposes 10% punitive duty on goods from China** along with 25% on Mexico and Canada, to press for curbs on illicit drugs and illegal immigrants flowing into the United States.\n\nFebruary 4 – China responds with measures targeting US businesses.\nChina responds with measures targeting US businesses, as well as 15% levies on US coal and LNG and 10% for crude oil and some autos from February 10. It curbs exports of five metals key to defence and clean energy.\n\nMarch 2025\n\n**March 3 –** US expands a separate tariff track.\nThe United States expands a separate tariff track on Chinese imports from March 4.\n\nMarch 4 – China hits back with retaliatory levies.\nChina hits back with retaliatory levies of 10% to 15% on US agriculture, hitting $21 billion in exports, clamping export and investment curbs on 25 US firms, as well as a ban targeting medical equipment maker Illumina.\n\nApril 2025\n\n**April 4 – China sets retaliatory tariffs of 34%**\nChina sets retaliatory tariffs of 34% for all US imports from April 10 and export curbs on some strategic inputs, as well as limits on about 30 US bodies in defence-related fields.\n\n**April 9 – China matches US levies** and adds controls.\nChina matches levies at 84% on US imports, hits 12 US companies with controls barring exports of dual-use items, and designates six more as \"unreliable entities\".\n\nApril 10 – China threatens curbs on Hollywood imports.\nChina threatens immediate curbs on imports of Hollywood films.\n\n**April 11 – China raises levies and signals disregard for US strategy**\n**China also raises levies to 125% on US imports,** calls Trump's tariff strategy \"a joke\" and signals it will ignore any further US \"numbers game with tariffs\".\n\nApril 15 – Nvidia says US officials told it China sales need export licence.\nChipmaker Nvidia says US officials told it China sales of the H20 chip would need an export licence.\n\nMay 2025\n\n**May 10-12 –** First round of trade talks in Geneva.\nFirst round of trade talks in Geneva agrees to a 90-day pause on tariffs.\n\nMay 28-29 – US vows to revoke visas of Chinese students.\nUnited States vows to start \"aggressively\" revoking visas of Chinese students, while ordering some companies to stop shipping some goods to China.\n\nMay 31 – Trump says China violated Geneva deal.\nTrump says China violated the Geneva deal by failing to ease export curbs and licensing controls, but China rejects this, accusing the United States of \"discriminatory restrictive\" curbs instead.\n\nJune 2025\n\nJune 5 – Xi and Trump hold telephone call.\nXi and Trump hold an hour-long telephone call.\n\nJune 9-12 – Framework deal reached in London talks.\nFramework deal reached in London round of talks, while some Chinese producers begin to receive export licences. Trump says a trade truce is back on track.\n\nJune 27 – Both sides resolve remaining supply-chain shipment issues.\nBessent says both sides resolve remaining shipment issues destined for the United States.\n\nOctober 2025\n\nOctober 30 – US and China strike new trade truce.\nUnited States and China strike a new trade truce after talks in South Korea between Trump and Chinese President Xi Jinping. Trump agrees to trim tariffs in exchange for Beijing cracking down on illicit fentanyl trade and resuming US soybean purchases.\n\nNovember 2025\n\nNovember 5 – Beijing suspends retaliatory tariffs on US imports.\nBeijing suspends some retaliatory tariffs on US imports from November 10, including farm goods duties, but keeps residual levies countering Trump's \"Liberation Day\" tariffs.", "remarks": "Kept the China-side reciprocal ladder and the China 125% ceiling, while removing the US 145% aggregate peak, the post-Geneva 30%/10% rates, and the lower US 34%/84% rungs. The May 31 dispute is framed as export-curb / export-licensing compliance without naming rare earths, and the June 27 supply-chain resolution is left generic rather than a discrete China export-control act, so other articles are required for the US peak, post-truce rates, and final supply-chain issue identification."}, {"sample_id": 11, "topic": "China-Taiwan Tensions", "sub_topic": "Military Exercises, US Arms Sales", "article_id": 43, "modified_article_id": "M43-1", "modified_text": "China's military mobilized army, navy, air and rocket units around Taiwan for two days of military drills aimed at sending a \"serious warning\" against any push for Taiwanese independence and \"external\" forces interfering with the island.\n\nThe exercises – dubbed \"Justice Mission-2025\" – would test combat readiness and \"blockade and control of key ports and critical areas,\" China's Eastern Theater Command said Monday.\n\nThe drills have included live-fire activities as well as rocket launches according to both Chinese and Taiwanese authorities.\n\nRockets fired on Tuesday landed in waters near Taiwan, according to Taiwan's Defense Ministry. The drills have also sparked flight delays and cancellations inside Taiwan over the last two days.\n\nTaiwan's government condemned the drills, accusing China of \"military intimidation,\" while its defense ministry said it was \"fully on guard\" and would \"take concrete action to defend the values of democracy and freedom.\"\n\nBeijing has in recent years ramped up its military intimidation of the island – long seen as a potential flashpoint in a fractious region – including by simulating blockades. Analysts say that based on the military announcements, the latest drills may be more explicitly aimed at practicing how to deny foreign military access to the area.\n\nIn the 24 hours since Monday, China deployed 130 warplanes and 22 ships around Taiwan, the island's defense ministry said Tuesday.\n\nIt's the second highest number of fighter jets that China has flown in the skies around Taiwan, following a record set in October 2024, when 153 fighter jets and other warplanes flew around the island over 25 hours during a previous military drill.\n\nIn an update Tuesday evening, Taiwan's Defense Ministry said China had fired a total of 27 rockets in two waves, which landed in waters north and southwest of Taiwan.\n\nSome of the rockets landed at positions that are \"closer than before\" when compared to previous military drills, according to Lt. Gen. Hsieh Jih-sheng, the ministry's deputy chief of the general staff for intelligence.\n\nOf Monday's sorties, 90 crossed the median line – an informal demarcation point in the Taiwan Strait that Beijing does not recognize, but until recent years had largely respected – and entered Taiwan's air defense identification zone.\n\nTaiwan's military said it was monitoring the situation and employed its fighter jets, naval vessels and coastal missiles systems in response to the detected activities.\n\nThe military flex appears to follow a playbook Beijing has used in the past: launching major drills at sensitive moments to express its displeasure.The exercises are the eighth major military drill held around Taiwan since the beginning of the Fourth Taiwan Strait Crisis in August 2022.\n\nWashington and Taipei earlier this month announced what could become one of the United States' biggest-ever military sales to the island, and Taiwan's president is pushing for the approval of a historic special defense budget – developments that have irked Beijing.\n\nChinese Foreign Minister Wang Yi addressed US arms sales to Taiwan during a speech in Beijing Tuesday, saying that \"in the face of repeated provocations from the 'Taiwan independence' forces and the large-scale arms sales of the United States to Taiwan, it is only natural that we firmly oppose them and take forceful countermeasures.\"\n\nAsked about the military exercise on Monday, US President Donald Trump again touted his \"great relationship\" with Chinese leader Xi Jinping, saying \"nothing worries me.\"\n\n\"I certainly have seen it, but he hasn't told me anything about it. I don't believe he's going to be doing it,\" he said in an apparent reference to a Chinese invasion of Taiwan.\n\nMeanwhile, China and Japan have been locked in a weeks-long diplomatic spat over comments the Japanese prime minister made about Taiwan.\n\nMore than 6,000 travelers have been affected by the drills as of Tuesday noon, according to Taiwan's Civil Aviation Administration, with 76 domestic flights canceled and 14 domestic flights delayed.\n\n'Collusive actions'\nChina's ruling Communist Party claims the self-governing democracy of Taiwan as its own territory, despite never having controlled it, and has vowed to take control of the island, by force if necessary.\n\n\"This exercise serves as a serious warning to 'Taiwan independence' separatist forces and external interfering forces,\" Shi Yi, spokesperson for the Eastern Theater Command said Monday, using what appeared to be a veiled reference to the US and its allies. \"(It) is a legitimate and necessary action to safeguard national sovereignty and maintain national unity.\"\n\nLater Monday, Chinese Defense Ministry spokesperson Zhang Xiaogang urged \"relevant countries to abandon the illusion of 'using Taiwan to contain China,'\" and refrain from \"challenging China's resolve and will to defend its core interests.\"\n\nOther voices cited in Chinese state media were more explicit. In an interview published on a social media account linked to state broadcaster CCTV, military analyst Fu Nan pointed to the US and Taiwan arms deal when asked why the drills were taking place at this time, calling it an \"escalation\" of \"collusive actions.\"\n\nTaiwan's President Lai Ching-te expressed his \"strongest condemnation\" at China's drills, and reiterated that Taiwan will neither escalate tensions or provoke disputes, though it \"will not back down in the face of threats.\"\n\n\"China has disregarded the international community's expectations for peace and is bent on undermining regional stability through military intimidation. This is a blatant provocation to regional security and the international order,\" he said in a Facebook statement Tuesday.\n\nUS arms deal\nThe landmark $11.1 billion arms deal between US and Taiwan includes HIMARS rocket systems, anti-tank and anti-armor missiles, loitering drones, howitzers and military software.\n\nWashington recognizes the People's Republic of China as the sole legitimate government of China, but maintains close unofficial ties with Taipei, which have strengthened in recent years. It is bound by law to provide the island with the means to defend itself and supplies it with defensive weaponry.\n\nBeijing slammed the recent arms deal announced between the two, with its Foreign Ministry earlier this month saying the move \"infringes on China's sovereignty, security and territorial integrity.\"\n\nWhen asked whether the drills were in response to the US-Taiwan arms deal, a spokesperson for China's Foreign Ministry on Monday referenced Taiwan's governing party and said the exercises were \"a severe punishment for the separatist forces seeking independence through force.\"\n\nTaiwan is seen by Beijing as the principal \"red line\" in US-China relations, with Chinese officials long condemning the unofficial relationship between Taipei and Washington.\n\nTaiwan has been ramping up military purchases in recent years as it comes under increasing pressure from Beijing, with Chinese aircraft and ships present almost daily around Taiwan as well as regular large-scale exercises in and over the surrounding waters.\n\nParts of latest deal, however, are expected to be paid for as part of an historic $40 billion special defense budget Taiwan's President proposed in late November. It has struggled to gain approval in Taiwan's opposition-controlled legislature, which is locked in an acrimonious gridlock.\n\nRegional frictions around Taiwan have also been heightened in recent weeks as Beijing has unleashed a diplomatic and economic pressure campaign on US ally Japan after its Prime Minister Sanae Takaichi suggested her country could respond militarily if China were to move to take control of Taiwan by force.\n\nThe announcement of the latest military drills has been accompanied by the usual release of nationalistic propaganda geared toward China's domestic audience, including a poster showing fiery arrows reigning down on the island captioned \"Arrow of Justice, Control and Denial.\"\n\nAnother AI-generated video titled \"Joint Operations to Thwart 'Taiwan Independence' Attempts\" showed images of menacing robot dogs and armed humanoid robots as well as planes and ships apparently bearing down on Taiwan.\n\n'Deny intervention'\nChina's drills around Taiwan have grown in complexity and scope in recent years, with analysts pointing to the increased emphasis on simulating blockades and suggesting that Beijing may be looking to blur the line between drills and activities preparing for an attack.\n\nThe latest drills appear set to follow a similar encirclement strategy. The total designated drill area, however, is larger than recent major exercises, a map by Taipei-based think tank Secure Taiwan Associate Corporation shows.\n\nA notice released by China's Maritime Safety Administration under its Transport Ministry listed seven zones for military exercise, including live-fire drills, taking place Tuesday. Five of those zones are the same as those announced by the People's Liberation Army.\n\nWhile those zones may cover both military and law enforcement exercises, taken together they appear to amount to a \"de facto\" blockade inside the Taiwan Strait, according to K. Tristan Tang, an associate fellow at the Secure Taiwan Associate Corporation, a Taipei-based think tank.\n\nThat would cover \"almost every sea route\" between Taiwan and its strategically important, outlying islands Kinmen and Matsu close to the mainland, Tang told CNN.\n\n\"The PLA aims to deny intervention by foreign military forces in conflicts around Taiwan and keep them out,\" Chieh Chung, an associate research fellow at Taiwan's Institute for National Defense and Security Research (INDSR), told CNN. \"Beijing is very explicit about that objective in this drill.\"\n\nIt was not immediately clear how long the saber-rattling would last. China's Eastern Command said naval and air forces would run combat readiness patrols from December 29, and the command released a notice announcing the closure of maritime and airspace zones around Taiwan for live-fire drills during daytime hours on December 30.", "remarks": "Added explicit exercise count ('eighth major drill since August 2022') to trap Q4 - tests whether model incorrectly infers Justice Mission-2025 was the first major exercise since 2022."}, {"sample_id": 11, "topic": "China-Taiwan Tensions", "sub_topic": "Military Exercises, US Arms Sales", "article_id": 44, "modified_article_id": "M44-1", "modified_text": "Military exercises near Taiwan: Taiwan accused the People's Republic of China of violating international norms and undermining stability by carrying out military exercises forty nautical miles off the coast of Taiwan on February 26. The Eastern Theater Command of China's People's Liberation Army (PLA) executed a joint combat readiness drill to the southwest and west of Taiwan, which included fighter jets, other aircraft, unmanned aerial vehicles, and warships. Twenty-two PLA aircraft crossed the median line in the Taiwan Strait during the drills. Although Beijing initially claimed the exercise would involve \"shooting training,\" indicating potential live-fire drills, Taipei ultimately did not detect any such activity. Taiwan deployed naval ships and aircraft to waters near the drill zone to monitor the situation throughout the day. Taiwan condemned the actions as a provocation and a threat to regional security as well as commercial activity; a spokesperson for China's Defense Ministry responded by alleging that Taiwanese authorities were \"playing tricks for . . . attention.\" One Taiwanese official told reporters that, despite other Chinese military activity surrounding the island in recent years, the February 26 exercises were extremely rare and exceeded general expectations. The incident also coincided with similar PLA drills carried out with minimal warning in the waters surrounding Australia and New Zealand-both U.S. partners with existing security relationships with Taiwan-in the same week.\n\nOn the topic of military drills, the joint commission that organizes the annual Cobra Gold military exercises in Thailand (a multilateral exercise that includes the United States and many of its Asian partners) caused some confusion in late February when it unintentionally posted statements indicating that Taiwan would take part in the 2025 exercises. The commission clarified on February 26 that all mentions of Taiwan were caused by a transcription error and that no Taiwanese forces would be participating in Cobra Gold.\n\nThe future of chips: Following multiple indications by U.S. President Donald Trump that he has considered imposing tariffs on foreign semiconductor chips, senior Taiwanese economic officials arrived in Washington, DC, on February 11 to discuss this issue and the broader U.S.-Taiwan economic relationship. The officials' meetings directly coincided with the first board meeting of the Taiwan Semiconductor Manufacturing Company (TSMC) to be held in Arizona; TSMC is building chip-production plants in the state partially due to incentives provided under the CHIPS and Science Act, which was signed into law during the Joe Biden administration. Experts consider the U.S.-Taiwan semiconductor trade to be a pillar of the bilateral economic relationship. CFR Fellow David Sacks and Research Associate Seaton Huang outline the importance of Taiwanese chip production to the U.S. economy and American imports of those chips to Taiwan's national security in their article \"Onshoring Semiconductor Production: National Security Versus Economic Efficiency.\"\n\nDefense and security: In preparation for potential Chinese targeting of Taiwanese leadership at the outset of a conflict, the island's sixty-sixth marine brigade will likely transform into a strategic reserve force to support the military police command's operations to defend Taipei and its airport in the event of a crisis. The brigade's tanks and artillery vehicles will be eliminated in favor of a new drone unit. As of February 5, one hundred marines were stationed at Taipei's Songshan Airport to protect the critical facility, which is located near downtown Taipei. In another sign of heightened worries surrounding a potential Chinese invasion, Admiral Samuel Paparo, commander of U.S. Indo-Pacific Command, assessed in a speech at the Honolulu Defense Forum that PLA military exercises around Taiwan have become so extensive that they could soon be used to conceal the early stages of an invasion. He also told attendees that Chinese military demonstrations surrounding Taiwan are \"not exercises; they are rehearsals,\" and he called for an increase in the production of unmanned systems and for reforms to the U.S. weapons-procurement process to hasten weapons delivery to Taiwan. Speaking at the Halifax Security Forum on February 21 (hosted, for the first time, in Taipei), Taiwanese Vice President Hsiao Bi-khim emphasized Taiwan's whole-of-society efforts to deter a Chinese invasion, defend its democratic society, build its strength, and sustain peace and security in the Indo-Pacific region. At the same forum, President Lai Ching-te delivered opening remarks in which he emphasized the threat to peace posed by Chinese gray-zone coercion.\n\nThe Executive Yuan, which functions as the president's cabinet and is led by his appointed premier, vetoed the legislature's proposed 2025 budget on February 27. Among other concerns, Democratic Progressive Party (DPP) leadership disapproved of the opposition coalition's proposed cuts to defense, diplomatic affairs, and public diplomacy, which would affect the government's efforts to produce weapons systems such as submarines and drones meant to deter Chinese invasion, improve Taiwan's diplomatic standing, and counter Chinese information and influence operations, respectively.\n\nOn February 20, a Taiwanese military official told
